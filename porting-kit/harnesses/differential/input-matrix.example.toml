# Differential input matrix (example) - the documented set of inputs the C
# oracle and the Rust rewrite are diffed over. Keep it in version control; it
# IS the behavioral contract. Grow it every time a bug escapes (add the case
# that would have caught it). A .json matrix with the same shape works too.
#
# Each [[case]] runs both binaries with `args` (and optional stdin/env/
# timeout), normalizes both outputs (see normalize.py), and diffs. Cover the
# axes that matter for a rewrite: empty/edge inputs, large inputs, every
# output format, every flag, and - critically - the malformed/hostile inputs
# that exercise the safety improvements over C. Control bytes use TOML \u.
#
# COMPLETENESS IS NOT GREENNESS. A differential only checks the inputs you list:
# a fully-green run over a matrix that omits a feature class says *nothing* about
# that class. Enumerate the C's feature surface up front - every option letter,
# every object/record TYPE the tool can emit - and give each a case. lsof-rs's
# socket differential was green while the port silently dropped every non-File
# handle type (registry Key/Event/Mutant/...): the matrix only made sockets, so
# no fixture ever created the objects that would have exposed the gap. Matches-
# the-oracle-on-the-matrix is not ports-all-functionality.
#
# ENFORCE IT: ../coverage/coverage_gate.py diffs a feature inventory
# (bootstrapped from the C via --extract-options/--extract-types, then curated)
# against this matrix's cases and exits 1 on any feature no case exercises.
# Option coverage is inferred from each case's `args`; fixture-borne coverage
# (the TYPEs a case's fixtures create) is declared per case:
#   covers = ["type:KEY", "type:REG"]
# Out-of-scope features get a [[waive]] with a reason in the inventory.
# A case may only cite a test that CI actually EXECUTES (and, once stable,
# enforces): lsof-rs's matrix credited its 55-case smoke harness while CI never
# ran it — coverage backed by a test nobody runs is the same silent gap this
# gate exists to close, one layer up (LESSONS #13).
#
# TWO MODES. (1) same-binary-both-platforms: run the C oracle and the Rust side
# on one host (the case this file shows). (2) oracle-substitution: when the C
# binary can't run on the target (lsof-rs: no lsof on Windows), diff the Rust
# output against a *native* oracle (Get-NetTCPConnection, netstat, ...) over
# self-owned fixtures. Mode 2 needs a three-way exit contract - 0 match,
# 1 divergence, 2 infra-error - so a broken oracle/harness can't masquerade as a
# port bug, and it must parse the oracle *defensively* (PowerShell's
# ConvertTo-Json double-wrapped a single-element set and read as a divergence).
# In mode 2 the coverage trap above is sharper still: the oracle only observes
# what your fixtures create, so an un-created type is invisible to *both* sides -
# a false MATCH, never a divergence.

[[case]]
name = "help"
args = ["--help"]

[[case]]
name = "version"
args = ["--version"]

[[case]]
name = "no-args-default-output"
args = []

[[case]]
name = "json-format"
args = ["--format", "json"]

# Edge / adversarial inputs - where a C rewrite most earns its safety. These
# should behave *better* than C (no crash, no UB), and may be ledgered as
# intentional divergences in DIVERGENCES.md.
[[case]]
name = "empty-stdin"
args = ["-"]
stdin = ""

[[case]]
name = "oversized-token"
args = ["--name"]
stdin = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"

[[case]]
name = "negative-number-arg"
args = ["-n", "-1"]

[[case]]
name = "utf8-and-control-bytes"
args = ["-"]
# ESC + ANSI color escape, then multibyte UTF-8; control byte via TOML escape.
stdin = "safe \u001B[31m manana"
timeout = 10
