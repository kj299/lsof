# Safety-first CI for a C-to-Rust port. Copy to .github/workflows/ci.yml and tune.
# The matrix is organized around SAFETY GATES, not OS coverage — the point of the
# rewrite is safety, so the pipeline centers on proving it. Keep a small OS row if
# your port is cross-platform; it is not the focus.
#
# Gates (each PLAYBOOK Phase 4 / cross-cutting control). Every control CLAUDE.md
# declares is invoked below; `make check-kit` runs control-coverage over this file,
# so a control added there and not wired here fails the kit (LESSONS #080):
#   build+test | clippy -D warnings | unsafe contained + documented (HARD FAIL) |
#   c-flaw scanner self-test | ledgers | threat model (HARD FAIL) | miri | asan |
#   fuzz smoke | supply-chain (audit + deny) | differential | coverage
name: porting-ci

# LESSONS #5 — path-scope CI to what it actually builds. During a gradual port the
# C tree and the Rust workspace coexist in one repo; an unscoped `on: [push]` runs
# this whole safety pipeline on changes it cannot affect (docs), wasting CI and
# leaving PRs misleadingly "unstable" while unrelated jobs drain. Tune the globs.
#
# LESSONS #035 — but scope it to what it BUILDS, which is not the same as "the
# Rust paths". The differential job below builds the C oracle and compares the
# port against it, so **the C sources are an input to this workflow too**. An
# earlier version of this template said "scope this Rust workflow to the Rust
# paths, and scope the C workflow to the C paths"; follow that and a C change
# moves the oracle while the gate that enforces conformance to it does not
# re-run. The port can drift from its own specification with every check green.
#
# So the C source globs below are NOT optional decoration — they are the second
# half of the differential gate. Replace them with your C tree's real layout
# (what `make <binary>` actually compiles: sources, headers, build system), and
# leave out what cannot change the binary: man pages, docs, the C test suite.
# When unsure, include it. A path filter fails in two directions and they are
# not symmetric — an extra run costs minutes, a missing run costs the gate
# (LESSONS #034).
on:
  push:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/porting-ci.yml',
            'src/**', 'lib/**', 'include/**', 'configure.ac', 'Makefile.am']
  pull_request:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/porting-ci.yml',
            'src/**', 'lib/**', 'include/**', 'configure.ac', 'Makefile.am']

permissions:
  contents: read

jobs:
  build-test:
    name: build + test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - run: cargo fmt --all -- --check
      # -D warnings escalates the workspace safety lints (see skeleton Cargo.toml
      # [workspace.lints]) to hard errors. The explicit -D flags below are
      # belt-and-suspenders so this gate holds even if a repo copies this CI
      # without the [workspace.lints] table — every `unsafe fn` needs `# Safety`,
      # every `unsafe {}` a doc (cross-checks the audit harness). (LESSONS #3)
      - run: >
          cargo clippy --all-targets --
          -D warnings
          -D clippy::missing_safety_doc
          -D clippy::undocumented_unsafe_blocks
      - run: cargo test --all

  unsafe-audit:
    name: unsafe-audit (hard fail on undocumented unsafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # Fails the build if ANY `unsafe {}` block lacks a // SAFETY: comment.
      - run: python3 porting-kit/harnesses/unsafe-audit/audit_unsafe.py crates/
      # Fails unless every crate named here forbids `unsafe_code` on every target
      # root, in a form rustc applies (LESSONS #065). Name each portable crate.
      - run: python3 porting-kit/harnesses/unsafe-audit/check_forbid_unsafe.py crates/core
      # The flaw scanner is a Phase 0 tool, but its rules are code: run its own
      # self-test so a change to the kit cannot silently weaken it.
      - run: python3 porting-kit/harnesses/c-flaw-scan/scan_c_flaws.py --self-test

  ledgers:
    name: ledgers exist (progress, divergences, fuzz target, sanitizers per unit) + threat model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # LESSONS #19 — the PLAYBOOK names these as exit criteria, and lsof-rs
      # shipped 1.0 with three of the four absent while every gate was green,
      # because no gate looked. A control that is asserted but never checked
      # does not exist. Waive one only with a reason: --allow NAME=WHY.
      # It also requires a sanitizer step that runs `cargo … -p <unit>` for every
      # unit progress.json tracks (san-crates), so name each unit in the miri
      # (or ASan) command below — the units are cargo packages.
      - run: python3 porting-kit/harnesses/ledgers/check_ledgers.py . --ci-dir .github/workflows
      # Hard fail: a missing file, a leftover placeholder or a deleted section.
      - run: python3 porting-kit/harnesses/threat-model/check_threat_model.py THREAT-MODEL.md

  miri:
    name: miri (UB in unsafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Land this observe-first (continue-on-error: true) and promote it in its
      # own PR after consecutive log-verified green runs (LESSONS #13, #19). Once
      # it is a HARD gate, PIN the nightly to the build that produced those runs:
      #   - uses: dtolnay/rust-toolchain@master
      #     with: { toolchain: nightly-YYYY-MM-DD, components: miri }
      # and `cargo +nightly-YYYY-MM-DD miri test`. miri ships inside the nightly
      # and its sysroot build can break on any given day; a hard gate must fail
      # only for the code's reasons, so a newer miri is a deliberate bump in its
      # own PR, not a surprise red on someone else's. Floating is fine while the
      # job cannot block.
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: miri }
      # Isolation is miri's determinism sandbox, not its UB detection. Any test
      # that touches a real tmpdir (mkdir/chdir/realpath) aborts under the
      # default; lsof-rs's first miri run did exactly that after 14 tests had
      # already passed. Disabling isolation keeps every soundness check.
      # Name every unit progress.json tracks: check_ledgers' san-crates looks for
      # `-p <unit>` in a sanitizer step, and a workspace-wide run names none.
      - run: cargo +nightly miri test -p <unit>
        env:
          MIRIFLAGS: -Zmiri-disable-isolation

  sanitizers:
    name: sanitizers (asan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # rustc has no UB sanitizer: the harness's `ubsan` mode runs Miri, which
      # the miri job already does. ASan is the one for the FFI layer.
      - run: bash porting-kit/harnesses/sanitizers/run_sanitizers.sh asan .

  fuzz-smoke:
    name: fuzz (60s smoke per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz
      # Short smoke in CI; schedule a nightly deep run separately.
      - run: |
          for t in $(cargo fuzz list 2>/dev/null); do
            cargo fuzz run "$t" -- -max_total_time=60
          done

  supply-chain:
    name: supply-chain (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit cargo-deny
      - run: bash porting-kit/harnesses/supply-chain/run_supply_chain.sh .

  differential:
    name: differential vs C oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # Build both, then diff over the input matrix. The oracle must run here:
      # harnesses/golden replays captured stdout only, so it cannot stand in for
      # a live C binary in this job.
      - run: |
          cargo build --release
          # ./build-c-oracle.sh   # your C build
          python3 porting-kit/harnesses/differential/diff_run.py \
            --oracle ./c-oracle --rust ./target/release/<binary> \
            --matrix porting-kit/harnesses/differential/input-matrix.example.toml \
            --ledger DIVERGENCES.md
      # The matrix must cover the C's whole surface: every option letter and TYPE
      # code the C can emit, less waivers that carry reasons (LESSONS #8, #012).
      # Build the inventory once with --extract-options/--extract-types and
      # --emit-inventory, then run this once per platform the port targets.
      - run: |
          python3 porting-kit/harnesses/coverage/coverage_gate.py \
            --inventory feature-inventory.toml \
            --matrix porting-kit/harnesses/differential/input-matrix.example.toml \
            --platform linux
