# The platform ledger for this repository.
#
# Every directory the build system can select as a dialect must appear below,
# with either `built_by` (regexes, at least one of which must appear in some CI
# configuration) or `waived` (a reason, asserted to be true: if CI turns out to
# mention the platform, the waiver is reported as stale).
#
# This file is the claim. `check_platforms.py` is what makes it a control —
# the platform list is discovered from the tree, so adding a dialect and
# forgetting this file is a failure, not a silent omission.
#
# Written after LESSONS #049, which found four of these dialects tested by CI
# and three of them by providers that never appear in a GitHub check list. That
# was upstream's CI. This fork inherited the config files and never connected
# the providers, so on this repository those three are built by nothing; see
# [ci] (LESSONS #082).

repo_root = "../../.."

[discover]
# What the build system can select. configure.ac's AS_CASE on $host_os maps each
# host to one of these directories via LSOF_DIALECT_DIR, and Makefile.am gates
# the sources on the matching AM_CONDITIONAL.
dirs = ["lib/dialects/*"]

[ci]
# The CI configurations that RUN for this repository. A config file is a claim
# that a provider builds something; the evidence is a run (LESSONS #082).
#
# .cirrus.yml (FreeBSD) and .builds/*.yml (NetBSD, OpenBSD on sourcehut) are
# upstream lsof's and came with the fork, but no provider runs them here: on
# 2026-10-04 the GitHub API showed only GitHub Actions (and claude) check
# suites, and zero commit statuses, on master's head and on every commit since
# the fork that was checked, including PR #81's merge. Listing them below made
# this ledger certify three dialects as CI-built on the strength of their text.
# On 2026-10-09 the maintainer decided to keep FreeBSD, NetBSD and OpenBSD
# waived rather than connect Cirrus CI and builds.sr.ht (RETROSPECTIVE-lsof.md
# section 12.7, item 6). Connecting them, recording a run and adding them back
# is what would gate them again.
globs = [
    ".github/workflows/*.yml",
    ".github/workflows/*.yaml",
    ".travis.yml",
    "appveyor.yml",
    ".gitlab-ci.yml",
]

[platforms.linux]
# build.yml: the legacy Configure path and the autotools build, on two Ubuntu
# releases. Also the oracle lsof-rs's differential compares against.
built_by = ["Configure linux"]

[platforms.darwin]
# build.yml's macOS job: Configure -n darwin, make, check.bash, autotools, dist.
built_by = ["Configure -n darwin", "check\\.bash darwin"]

[platforms.freebsd]
# .cirrus.yml would build it (two FreeBSD images, make distcheck), if Cirrus CI
# ran for this repository. It does not; see [ci].
waived = "upstream's .cirrus.yml is here, but no Cirrus CI runs it for this fork; kept as source, not gated, on the maintainer's decision (2026-10-09)"

[platforms.netbsd]
# .builds/netbsd.yml would build it on sourcehut, if builds.sr.ht ran for this
# repository. It does not; see [ci].
waived = "upstream's .builds/netbsd.yml is here, but no sourcehut build runs it for this fork; kept as source, not gated, on the maintainer's decision (2026-10-09)"

[platforms.openbsd]
# .builds/openbsd.yml would build it on sourcehut. It does not run here; see [ci].
waived = "upstream's .builds/openbsd.yml is here, but no sourcehut build runs it for this fork; kept as source, not gated, on the maintainer's decision (2026-10-09)"

[platforms.aix]
waived = "no AIX runner on any provider we use; kept as source, not gated"

[platforms.sun]
aliases = ["solaris"]
waived = "no Solaris runner on any provider we use; kept as source, not gated"
