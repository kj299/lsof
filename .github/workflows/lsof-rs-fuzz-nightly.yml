name: lsof-rs nightly fuzz

# Deep fuzzing on a schedule — the long-budget counterpart to lsof-rs-ci.yml's
# 45-second PR smoke. Same target (the hand-rolled argument parser must never
# panic on adversarial input), 40x the budget, plus a corpus that accumulates
# across nights via the cache: each run restores the newest previous corpus,
# fuzzes on top of it, and saves the grown corpus for the next night.
#
# `workflow_dispatch` is the human button (porting-kit LESSONS #14): schedule
# workflows only fire from the default branch, so the button is both the way to
# exercise this on demand and the way to validate it right after merging
# instead of waiting for the first 03:43 UTC firing.
on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: lsof-rs

jobs:
  deep-fuzz:
    name: deep fuzz (every target, 30 min)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - name: restore accumulated corpus
        uses: actions/cache@v5
        with:
          path: lsof-rs/fuzz/corpus
          # The run-id key never hits, so the post-job save always stores the
          # grown corpus; restore-keys pulls the newest previous night's.
          # One cache for the whole corpus dir (per-target subdirs inside), so
          # a new target starts accumulating the night it lands. The key was
          # per-target (fuzz-corpus-parse_args-) while there was one target;
          # the first night on this key starts from that target's seeds only.
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-
            fuzz-corpus-parse_args-
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: deep fuzz every target
        # The 30-minute budget is split evenly across whatever `cargo fuzz list`
        # reports, so a target added to fuzz/Cargo.toml is soaked nightly
        # without touching this file. Five targets today: the argv parser and
        # the Linux backend's four /proc and /etc/passwd text parsers.
        run: |
          targets=$(cargo fuzz list)
          n=$(echo "$targets" | wc -w)
          per=$(( 1800 / n ))
          echo "$n targets, ${per}s each"
          for t in $targets; do
            echo "=== deep fuzz: $t (${per}s) ==="
            cargo fuzz run "$t" -- -max_total_time="$per" -rss_limit_mb=2048
          done
      - name: upload crash artifacts
        # Only exists on a finding; libFuzzer writes the reproducer input here.
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: lsof-rs-fuzz-crashes
          path: lsof-rs/fuzz/artifacts
          if-no-files-found: warn
