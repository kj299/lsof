name: C/C++ CI

# The Rust port's trees AND its workflow files are ignored: an edit to
# winlsof's CI/release workflow can't affect the C build, but without these
# entries it still kicked off all three heavyweight C jobs (the same waste the
# tree-level ignores fixed — porting-kit LESSONS #005).
on:
  push:
    paths-ignore:
      - 'porting-kit/**'
      - 'winlsof/**'
      - '.github/workflows/winlsof-*.yml'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - 'porting-kit/**'
      - 'winlsof/**'
      - '.github/workflows/winlsof-*.yml'

jobs:
  linux:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: install dependencies
      run: sudo apt install -y pkg-config
    - name: autoconf
      run: autoreconf -vif
    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5
    - name: pin the runner hostname to loopback (LTsock)
      # The C suite's LTsock creates sockets on gethostbyname(hostname) and
      # then matches lsof's output by hostname@port. On 2026-08 macos-latest
      # images the runner hostname no longer round-trips to the same address,
      # so the test fails ("no client socket by host and port"). Pinning the
      # hostname to loopback makes the test's resolution and lsof's rendering
      # agree by construction. CI-environment workaround only; no C source is
      # touched.
      run: echo "127.0.0.1 $(hostname)" | sudo tee -a /etc/hosts
    - name: install dependencies
      run: brew install pkg-config libtool autoconf automake groff
    - name: configure
      run: LSOF_INCLUDE=/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/usr/include ./Configure -n darwin
    - name: make
      run: make -j 2
    - name: test
      run: bash ./check.bash darwin
    - name: autotools build
      run: |
        git clean -fdx .
        autoreconf -vif
        ./configure
        make
        DESTDIR=$PWD/prefix make install
        make check
    - name: dist build and test
      run: |
        make dist
        mkdir temp
        cd temp
        tar xvf ../lsof-*.tar.gz
        cd lsof-*
        ./configure
        make
        DESTDIR=$PWD/prefix make install
        make check
