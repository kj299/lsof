name: C/C++ CI

# The Rust port's trees AND every workflow that cannot affect the C build are
# ignored: an edit to lsof-rs's CI/release workflow, or to the porting kit's,
# can't change what `./configure && make` produces, but without these entries it
# still kicked off all three heavyweight C jobs — the macOS matrix and
# `make distcheck` included (the same waste the tree-level ignores fixed —
# porting-kit LESSONS #005). The `paths-ignore` lists below are what porting-kit
# LESSONS #013 added: unrelated changes were making these jobs — and therefore
# every PR touching them — look unstable.
#
# `porting-kit.yml` was the omission: `porting-kit/**` was ignored while the
# kit's own workflow file was not, so PR #90 — four files, all of them kit —
# ran the entire C matrix twice because one of them was `porting-kit.yml`.
#
# The list is enumerated rather than generalised to "every workflow but this
# one", and `build.yml` is deliberately absent from it: a gate that ignores
# edits to itself cannot be re-verified when you change it (porting-kit
# LESSONS #034 — a path filter fails in two directions, and too-wide and
# too-narrow look identical from outside the run). Anything that can alter the
# oracle — C sources, Configure, Makefile.am, the man pages, this file — must
# still trigger these jobs.
on:
  push:
    paths-ignore:
      - 'porting-kit/**'
      - 'lsof-rs/**'
      - '.github/workflows/lsof-rs-*.yml'
      - '.github/workflows/porting-kit.yml'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - 'porting-kit/**'
      - 'lsof-rs/**'
      - '.github/workflows/lsof-rs-*.yml'
      - '.github/workflows/porting-kit.yml'

jobs:
  linux:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
    - name: install dependencies
      run: sudo apt install -y pkg-config
    # The legacy Configure path WITHOUT -n, which is the flow 00.README.FIRST
    # tells users to run. CI previously exercised Configure only via the macOS
    # job's `./Configure -n darwin`, and -n skips the inventory, customization
    # and AFS steps -- so when the Purdue-era helper scripts were deleted,
    # every job stayed green while `./Configure <dialect>` died at
    # "Can't find Inventory script." A -n-only gate cannot see a -n-only
    # blind spot.
    #
    # stdin is closed deliberately: Configure must stay non-interactive, and
    # a future prompt should fail here rather than hang the runner.
    - name: legacy Configure, no -n
      run: ./Configure linux </dev/null
    - name: legacy make
      run: make -j2
    # Configure writes Makefiles the autotools build would otherwise inherit.
    - name: reset the tree for the autotools build
      run: git clean -fdx .
    - name: autoconf
      run: autoreconf -vif
    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck

  macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5
    - name: make the hostname resolution round-trip (LTsock)
      # The C suite's LTsock resolves gethostname() and hands lsof the selector
      # -i@<hostname>:<port>, so the test and lsof must resolve that name to
      # the same address, and lsof's reverse lookup must return it. On 2026-08
      # macos-latest images the runner hostname is a *.local name, which macOS
      # resolves via mDNS -- /etc/hosts pinning does not reliably apply to
      # .local, and the round-trip broke ("no client socket by host and
      # port"). Setting HostName to localhost removes mDNS from the loop
      # entirely: gethostname() returns a name whose forward (127.0.0.1) and
      # reverse (localhost) resolution are symmetric on every path via the
      # stock /etc/hosts. CI-environment workaround only; no C source touched.
      run: |
        sudo scutil --set HostName localhost
        echo "hostname is now: $(hostname)"
    - name: install dependencies
      run: brew install pkg-config libtool autoconf automake groff
    - name: configure
      run: LSOF_INCLUDE=/Applications/Xcode.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/usr/include ./Configure -n darwin
    - name: make
      run: make -j 2
    - name: test
      run: bash ./check.bash darwin
    - name: autotools build
      run: |
        git clean -fdx .
        autoreconf -vif
        ./configure
        make
        DESTDIR=$PWD/prefix make install
        make check
    - name: dist build and test
      run: |
        make dist
        mkdir temp
        cd temp
        tar xvf ../lsof-*.tar.gz
        cd lsof-*
        ./configure
        make
        DESTDIR=$PWD/prefix make install
        make check
