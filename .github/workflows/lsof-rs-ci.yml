name: lsof-rs CI

# CI for the Rust, memory-safe, Windows-native lsof rewrite under lsof-rs/.
# The portable core builds and tests on Linux; the native Windows backend is
# built and tested on a real windows-latest runner (the paths that can't be
# linked off-Windows).
#
# Two trigger notes, both about not burning runner time:
#
# `push` is limited to master. Without that, every PR ran this workflow twice —
# once for the branch push and once for the pull_request — so a PR showed 8
# check runs, including the native-Windows job (release build + socket
# differential + the 59-case smoke suite) twice over. The pull_request run
# covers the branch; this one covers master after a merge.
#
# The `!` negations skip documentation-only changes: a markdown edit cannot
# affect the build, the gates, or the smoke suite. A change touching docs *and*
# code still runs everything, because the filter tests the union of changed
# files. (A docs-only PR therefore shows no checks at all — correct, but worth
# knowing before turning on required status checks.)
#
# `porting-kit/harnesses/**` is in the list because four of the gates below ARE
# kit harnesses: a change to one of them changes what this workflow enforces,
# and until it was added, editing a harness ran nothing at all.
#
# The C oracle's own sources are in the list for the same reason, one level
# deeper. The differential job below builds the oracle FROM THIS TREE
# (`autoreconf -vif && ./configure && make lsof`) and then diffs 87 cases
# against it, so the C sources are an input to *this* pipeline, not only to
# build.yml's. Scoping "the Rust workflow to the Rust paths and the C workflow
# to the C paths" — which is how the kit phrased it — leaves the differential
# comparing against an oracle whose definition can move without it re-running.
# PR #86 edited lib/dialects/linux/machine.h, a header the oracle compiles, and
# has four check runs with the differential not among them; that edit was safe
# because its preprocessed output was compared by hand, not because CI said so.
#
# What is deliberately NOT here: Lsof.8 and the 00* docs (not compiled),
# `Configure` (the legacy path — the oracle is built by autotools), tests/ and
# check.bash (that is `make check`, not `make lsof`). What is here on purpose
# despite not being oracle source: `lib/dialects/*/tests/**` rides along under
# `lib/**`. A path filter fails in two directions and over-triggering is the
# cheap one — an extra run costs minutes, a missing run costs the gate
# (LESSONS #034; LESSONS #035).
on:
  push:
    branches: [master]
    paths:
      - 'lsof-rs/**'
      - '!lsof-rs/**.md'
      - '!lsof-rs/docs/**'
      - 'porting-kit/harnesses/**'
      - '!porting-kit/harnesses/**.md'
      - '.github/workflows/lsof-rs-ci.yml'
      # the C oracle the differential job compares against
      - 'src/**'
      - 'lib/**'
      - 'include/**'
      - 'm4/**'
      - 'autotools/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'version'
      - 'version.in'
  pull_request:
    paths:
      - 'lsof-rs/**'
      - '!lsof-rs/**.md'
      - '!lsof-rs/docs/**'
      - 'porting-kit/harnesses/**'
      - '!porting-kit/harnesses/**.md'
      - '.github/workflows/lsof-rs-ci.yml'
      # the C oracle the differential job compares against
      - 'src/**'
      - 'lib/**'
      - 'include/**'
      - 'm4/**'
      - 'autotools/**'
      - 'configure.ac'
      - 'Makefile.am'
      - 'version'
      - 'version.in'

permissions:
  contents: read

defaults:
  run:
    working-directory: lsof-rs

jobs:
  core-linux:
    name: core + lints (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test (portable core + CLI via mock backend)
        run: cargo test --all
      - name: unsafe-audit (// SAFETY on every unsafe block)
        # Toolchain-free text scan from the porting kit. HARD gate: every unsafe
        # block in the backend carries a // SAFETY: justification (131/131), so
        # a new undocumented block fails CI.
        run: python3 ../porting-kit/harnesses/unsafe-audit/audit_unsafe.py crates/lsof-backend-windows/src

      - name: coverage gate (test surface vs the C's feature surface)
        # The question no other gate asks: are we testing everything the port
        # claims to do? A green differential says nothing about a feature no
        # fixture creates — that is how every non-File object type stayed
        # silently dropped (porting-kit LESSONS #8). HARD gate: the C's full
        # surface minus explicit, reasoned waivers must all be exercised, so a
        # newly dropped or newly untested feature fails CI. See coverage/README.md.
        #
        # Run once PER PLATFORM. A waiver's reason is usually platform-specific
        # ("Unix-only", "no Windows equivalent"), and such a reason expires
        # silently when the port grows a backend for that platform — the file
        # does not change, so an unscoped gate stays green while excusing
        # features the new backend is expected to have. Gating each platform
        # separately is what makes that expiry fail instead of pass.
        run: |
          for p in windows linux; do
            echo "=== coverage gate: $p ==="
            python3 ../porting-kit/harnesses/coverage/coverage_gate.py \
              --inventory coverage/feature-inventory-lsof-rs.toml \
              --matrix coverage/coverage-matrix.toml \
              --platform "$p"
          done

      - name: c-flaw scanner self-test
        # Four of the gates in this job are porting-kit harnesses, and a change
        # to one of them changes what CI enforces — but nothing ran the flaw
        # scanner's own `--self-test`, so its rules were unverified. It has
        # negative cases too: an `(unsigned char)` cast must NOT flag, a struct
        # field sharing a `char` variable's name must NOT flag, and `stat(2)` in
        # a comment must NOT count as a TOCTOU finding. A scanner whose rules
        # nothing checks is the "declared but never run" shape the ledger exists
        # to catch (LESSONS #019, #025).
        run: python3 ../porting-kit/harnesses/c-flaw-scan/scan_c_flaws.py --self-test

      - name: ledgers exist (progress, divergences, fuzz target, sanitizer per crate)
        # porting-kit LESSONS #19: the playbook names these as exit criteria and
        # this port reached 1.0 with three of the four absent while every gate
        # was green, because no gate looked. Now one does.
        run: python3 ../porting-kit/harnesses/ledgers/check_ledgers.py . --ci-dir ../.github/workflows

  windows:
    name: native backend (windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: clippy (windows)
        run: cargo clippy --all-targets -- -D warnings
      - name: build (native Win32 backend)
        run: cargo build --all
      - name: test
        run: cargo test --all
      - name: build release binary
        run: cargo build --release --bin lsof
      - name: socket differential (oracle-substitution vs Get-NetTCPConnection)
        # Compares lsof-rs's `-i` socket SET against the OS's own table over
        # self-owned fixtures (see differential/README.md). Built-in cmdlets +
        # python only; no elevation, no third-party actions.
        # HARD gate: promoted after consecutive green runs on the hosted runner.
        # The comparator distinguishes divergence (exit 1) from infra (exit 2),
        # and the one known data-source divergence (BOUND sockets) is ledgered.
        shell: pwsh
        run: ./differential/capture.ps1 -Bin target/release/lsof.exe
      - name: live smoke test (67 cases over self-owned fixtures)
        # The end-to-end harness: stands up real fixtures (held file at a known
        # offset, named pipe with a connected client, mapped data file, TCP
        # v4/v6 + UDP sockets, child processes with a known cwd) and exercises
        # every option against them, cross-checking native oracles. Built-in
        # cmdlets only — nothing is downloaded. It is the source of most of
        # coverage/coverage-matrix.toml's declared cases; running it here is
        # what makes that coverage claim real.
        #
        # HARD gate: landed observe-first (porting-kit LESSONS #9) and promoted
        # after its first run surfaced two real findings (an 8.3 short-name gap
        # in path selectors; a fixture asserting a kernel file position modern
        # .NET no longer moves — both fixed in PR #37) and then went green on
        # two consecutive hosted-runner runs (PR #37 + master 5549503),
        # PASS=53 FAIL=0 SKIP=2 each — the SKIPs are the elevation-dependent
        # cases, which self-skip by design.
        shell: pwsh
        run: ./smoketest/Invoke-LsofRsSmokeTest.ps1 -SkipBuild -Binary target/release/lsof.exe -OutDir smoke-results
      - name: upload smoke-test results
        # Uploaded even when the step above fails: results.csv / summary.txt /
        # transcript.log are how the observe-first runs get read before promotion.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lsof-rs-smoke-results
          path: lsof-rs/smoke-results
          if-no-files-found: warn
      - name: upload lsof.exe
        uses: actions/upload-artifact@v6
        with:
          name: lsof-exe-windows
          path: lsof-rs/target/release/lsof.exe
          if-no-files-found: error

  supply-chain:
    name: supply-chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        # advisories + licenses + bans + sources, per lsof-rs/deny.toml. The
        # third-party surface is just the windows-sys family (MIT/Apache-2.0).
        run: cargo deny check

  fuzz:
    name: fuzz smoke (every target)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: fuzz every target (short smoke)
        # Adversarial input into every parser that takes text from outside the
        # process: the hand-rolled option parser (argv) and the Linux backend's
        # /proc/net tables, /proc/<pid>/status, fdinfo and /etc/passwd readers
        # (kernel- and user-supplied text; `Name:` is attacker-settable). None
        # may panic. The loop is over `cargo fuzz list`, so a target added to
        # fuzz/Cargo.toml is gated here without touching this file — a target
        # that exists but is not run is the LESSONS #019 failure again. Short
        # time-box per target gates every PR; the nightly runs long.
        run: |
          for t in $(cargo fuzz list); do
            echo "=== fuzz smoke: $t ==="
            cargo fuzz run "$t" -- -max_total_time=45 -rss_limit_mb=2048
          done

  differential-linux:
    name: differential (linux, vs the C)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Mode 1 of the porting kit's differential — the one Windows cannot have:
    # the C lsof built from THIS tree (the exact source being ported, not apt's
    # older package) and lsof-rs, run against the same self-owned fixture
    # process at the same instant, diffed through porting-kit diff_run.py with
    # DIVERGENCES.md as the ledger. Every L0/L1 fidelity finding came from
    # doing this by hand; this is it as a gate. See differential/linux_diff.py.
    #
    # HARD gate from its first run, on purpose: unlike the Windows smoke suite
    # this is not CI-only — it runs identically on any Linux box, and it was run
    # end to end (13 cases, 9 MATCH, 4 ledgered, 0 unexplained) before this job
    # was written. A promotion PR validates itself by the mechanism it enables.
    #
    # Exit contract: 0 match/ledgered, 1 unexplained divergence, 2 infra (a
    # binary that cannot run, a fixture that did not come up) — so a broken
    # harness cannot read as a port bug (LESSONS #6).
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: build the C oracle from this tree
        # The same recipe build.yml proves on this runner, minus the man page
        # (`make lsof`, the binary target alone — the docs step needs groff and
        # the oracle needs no manual).
        working-directory: .
        run: |
          sudo apt-get install -y pkg-config
          autoreconf -vif
          ./configure
          make -j"$(nproc)" lsof
          # lsof writes -v to STDERR. Without 2>&1 grep sees nothing, exits 1,
          # and pipefail fails the step after a successful build — which is
          # exactly what happened on this job's first run.
          ./lsof -v 2>&1 | grep revision
      - name: build lsof-rs
        run: cargo build --release --bin lsof
      - name: allow unprivileged user namespaces (fixture L)
        # MEASURED, NOT ASSUMED: on head 195d7eb this runner skipped
        #
        #   SKIP (no unprivileged user namespaces for `unshare --user --net`):
        #     userns-sockets-show-the-kernels-protocol-name,
        #     userns-sockets-kernel-protocol-name-fields
        #
        # and those two cases are the ONLY thing in the repository that can
        # fail for DIVERGENCES item 24 — no unit test kills either mutation,
        # because naming a socket through its own namespace needs a live
        # foreign namespace to execute. Skipped there, the fix ships ungated.
        #
        # Ubuntu 24.04 ships kernel.apparmor_restrict_unprivileged_userns=1,
        # which blocks `unshare --user` for an unconfined binary. Clearing it
        # on an ephemeral runner VM restores a standard kernel feature for the
        # length of one job; it is not a workaround for a missing privilege,
        # and it does not make fixture K (real CAP_NET_RAW, host namespace)
        # runnable — those three cases stay skipped and stay reported.
        #
        # NON-FATAL on purpose. The sysctl does not exist on 22.04 and may go
        # away again; the authority on whether the cases ran is the harness's
        # own SKIP line, printed by name, not this step. `|| true` here would
        # hide the reason, so the status is echoed instead.
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns 2>&1 ||             echo "sysctl absent — nothing to relax on this kernel"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>&1 ||             echo "could not clear it; fixture L will report itself unavailable"
          if unshare --user --map-root-user --net true 2>&1; then
            echo "probe OK: unprivileged user+net namespaces work, fixture L will run"
          else
            echo "probe FAILED: fixture L will skip, and the harness will name its cases"
          fi
      - name: differential vs the C oracle
        run: python3 differential/linux_diff.py --oracle ../lsof --rust target/release/lsof

  miri:
    name: miri (UB in the portable crates)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # HARD GATE. Landed observe-first (continue-on-error) in the retrospective
    # PR #64 after LESSONS #19 found the playbook's sanitizer gate had never been
    # wired for this port; promoted here, in its own PR, on the kit's promotion
    # rule (LESSONS #13): consecutive log-verified green runs — two, heads
    # ae32953 and 5c1b654, 54 tests each (lsof-cli 14 lib + 6 bin, lsof-core
    # 15 lib + 19 golden), zero UB findings, read from the step log and not the
    # job status. This PR itself is the third: a promotion is validated by the
    # mechanism it enables.
    #
    # Scope: the forbid(unsafe_code) crates. The Windows backend needs Windows
    # and has its own ASan job.
    #
    # This comment used to say the Linux backend "reads live /proc, which miri
    # cannot interpose". That was FALSE, and nothing had ever tested it: with
    # -Zmiri-disable-isolation miri runs that crate's suite fine. Measured on
    # the pinned nightly below, 48 of its 50 tests pass; the two that do not
    # are miri shim artefacts, are `#[cfg_attr(miri, ignore)]` at the test with
    # the measurement that justifies it, and still run under plain `cargo test`.
    # The lsof-backend-linux arm is the separate miri-linux job below, and
    # separate ON PURPOSE -- see the note there.
    #
    # The nightly is PINNED to the build that produced the green runs. miri
    # ships inside the nightly and its sysroot build can break on any given
    # day; a hard gate must fail only for the code's reasons, so a newer miri
    # is a deliberate bump in its own PR, not a surprise red on someone else's.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-31
          components: miri
      - name: miri over lsof-core + lsof-cli
        # Isolation is miri's determinism sandbox, not its UB detection; the
        # first observe-first run tripped it on a legitimate temp-dir test after
        # 14 tests had passed. Disabling it keeps every soundness check.
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly-2026-08-31 miri test -p lsof-core -p lsof-cli

  miri-linux:
    name: miri (Linux backend — observe-first)
    runs-on: ubuntu-latest
    # 60, not the 25 the job above uses: on the first attempt this arm shared
    # that job and was killed by its timeout after 25m15s, having emitted no
    # `test result:` line at all.
    #
    # MEASURED. Three completed runs, spanning better than 2x:
    #
    #   8a4b2ea  48 passed; 0 failed; 2 ignored   2557.15s  (42m37s)
    #   22a9882  55 passed; 0 failed; 2 ignored   1216.62s  (20m17s)
    #   195d7eb  55 passed; 0 failed; 2 ignored   1463.71s  (24m24s)
    #
    # The last two run the IDENTICAL suite and differ by 20%; the first runs
    # seven FEWER tests and takes over twice as long as the fastest. So what
    # dominates is runner variance, not what the suite does. One measurement
    # would have read as a fact; it was the first number written into this
    # comment and it was wrong as a characterisation.
    #
    # Locally the same command is ~295s, so CI is 4-9x slower, and the log says
    # why itself: `warning: 5665 warnings emitted`. miri prints "files in
    # `/proc` can bypass the Abstract Machine", WITH A BACKTRACE, for every
    # access, and reading /proc is all this crate does.
    #
    # 60 stays. Against the SLOWER of the two observations that is ~1.4x
    # headroom, not the ~3x the faster one would suggest -- thinner than it
    # looks, and the reason not to trim it. It is free anyway: the job is
    # isolated and blocks nothing, which is the whole point of it being a job.
    #
    # What it is NOT free of is wall time. At 20-43 min this is the longest job
    # in the workflow either way (the fuzz smoke, next longest, is ~8), so the
    # check suite stays yellow that long on every push. If that becomes worth
    # fixing, the lever is NARROWING WHAT IT RUNS -- the live-/proc tests are
    # what generate the ~5700 warnings, and the pure parsers are where the UB
    # and leak surface actually is -- not raising this number again.
    timeout-minutes: 60
    # OBSERVE-FIRST (LESSONS #13), and A JOB RATHER THAN A STEP BECAUSE OF HOW
    # THE FIRST ATTEMPT FAILED. `continue-on-error` is a step property;
    # `timeout-minutes` is a job property. An observe-first STEP inside the
    # hard-gate job therefore could — and did — turn that gate from success to
    # cancelled, which is precisely what "does not block" was supposed to
    # prevent. Any job-level failure mode (timeout, runner loss, cancellation)
    # crosses a step-level exemption. Isolation is the only thing that actually
    # makes a trial arm harmless.
    #
    # PROMOTED. progress.json moved lsof-backend-linux from `fuzzed` to
    # `unsafe_audited` on the three consecutive log-verified greens above -- the
    # same rule, and the same evidence standard (the step log's `test result:`
    # line, never the job status), that promoted the job above and asan-windows
    # before it. The arm KEEPS `continue-on-error`: what the greens earned is
    # the ledger row, not blocking authority. Turning it into a hard gate is a
    # separate decision, and on a 20-43 minute job with 2x variance it is not
    # obviously the right one.
    #
    # Validated locally on this exact toolchain rather than written blind:
    # clean it is `48 passed; 0 failed; 2 ignored`, and it has been shown to
    # fail for the right reasons, which is the only thing that makes a clean
    # run mean anything —
    #
    #   a leaked allocation in parse_mounts  -> `error: memory leaked`, exit 1
    #   an out-of-bounds read, with the crate's forbid(unsafe_code) lifted
    #                                        -> `error: Undefined Behavior:
    #                                           in-bounds pointer arithmetic
    #                                           failed`, exit 1
    #
    # The leak case is the one worth having: it is real, it is not covered by
    # any other gate here, and this crate caches (`NetnsTables` holds a
    # RefCell<HashMap> per namespace and per pid). The UB case only bites if
    # someone lifts forbid(unsafe_code) — and that attribute fires first, so
    # miri is the second line there, not the first.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-31
          components: miri
      - name: miri over lsof-backend-linux
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo +nightly-2026-08-31 miri test -p lsof-backend-linux

  asan-windows:
    name: ASan (UB in the Windows unsafe layer)
    runs-on: windows-latest
    timeout-minutes: 30
    # HARD GATE. This is the last of the playbook's four exit criteria that this
    # port had never executed: miri covers the forbid(unsafe_code) crates, and
    # the ~150 unsafe blocks in the Windows backend — every one of them an FFI
    # call with a hand-sized buffer — had never been under a sanitizer at all
    # (see the miri job's scope note).
    #
    # It landed observe-first and is promoted here on the kit's rule
    # (LESSONS #13): consecutive green runs read from the STEP LOG rather than
    # the job status. Three, on PR #77's heads a29e4ff, 0965875 and e506b1a,
    # each showing the canary caught and the real suite clean:
    #
    #   ASan runtime dir: …\VC\Tools\MSVC\14.51.36231\bin\Hostx64\x64
    #   ==NNNN==ERROR: AddressSanitizer: heap-buffer-overflow … asan_canary.rs:33
    #   canary caught: ASan is live.
    #   test result: ok. 10 passed
    #
    # Reading the log is the whole point: this job's status is green in BOTH
    # the working and the silently-not-instrumenting case, which is why the
    # canary step exists and why a promotion here could not be taken from the
    # status alone. `CANARY SURVIVED` appeared in none of the three runs except
    # as the echoed script source.
    #
    # Unlike the miri job, this one could not be validated locally first —
    # there is no Windows here — so those three runs are the only evidence
    # there has ever been that it works.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          # `-Zsanitizer` is nightly-only. Pinned for the same reason the miri
          # job is: a hard gate must fail for the code's reasons, and a
          # sanitizer's codegen can change on any given nightly.
          toolchain: nightly-2026-08-31
          components: rust-src
      - name: locate the ASan runtime
        # Rust links `clang_rt.asan_dynamic-x86_64.lib`; the matching DLL ships
        # with the MSVC toolchain and is NOT on PATH by default, so the test
        # binary dies with a loader error that looks nothing like a sanitizer
        # finding. Resolve it through vswhere rather than hard-coding a VS
        # version that will age out from under the job.
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $ver = Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt"
          $bin = "$vs\VC\Tools\MSVC\$($ver.Trim())\bin\Hostx64\x64"
          if (-not (Test-Path "$bin\clang_rt.asan_dynamic-x86_64.dll")) {
            Write-Host "::warning::ASan runtime not found under $bin"
            Get-ChildItem -Path "$vs\VC\Tools\MSVC" -Filter "clang_rt.asan*" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 5 -ExpandProperty FullName
          }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          Write-Host "ASan runtime dir: $bin"
      - name: canary — ASan must catch a deliberate overflow
        # THE POINT OF THIS STEP. A sanitizer job that finds nothing is
        # indistinguishable from one that never instrumented anything: a
        # mistyped RUSTFLAGS, a missing --target, a runtime DLL that did not
        # load, and the job still goes green while proving nothing. That is
        # precisely how the kit's sanitizer gate came to be "declared but never
        # run" here (LESSONS #019). So the job first runs a test that reads one
        # byte past a heap allocation and REQUIRES it to abort with an ASan
        # diagnostic. If the canary survives, the job fails before it says
        # anything about the real code.
        shell: pwsh
        env:
          RUSTFLAGS: -Zsanitizer=address
        run: |
          $log = "canary.log"
          cargo +nightly-2026-08-31 test --target x86_64-pc-windows-msvc `
            -p lsof-backend-windows --features asan-canary `
            --test asan_canary 2>&1 | Tee-Object -FilePath $log
          $text = Get-Content $log -Raw
          if ($text -match "CANARY SURVIVED") {
            throw "ASan is not instrumenting this build: the out-of-bounds read completed."
          }
          if ($text -notmatch "AddressSanitizer") {
            throw "no AddressSanitizer diagnostic in the canary run — the sanitizer did not report, so a clean run below would prove nothing."
          }
          Write-Host "canary caught: ASan is live."
          # GitHub's pwsh appends `exit $LASTEXITCODE`, and cargo exited
          # non-zero here BY DESIGN — the canary is supposed to die. Without
          # this the step fails on the very outcome it requires.
          exit 0
      - name: ASan over the Windows backend
        # The real run. `enumerates_real_kernel_object_types` is the one that
        # matters: it creates an event, a mutex, a section and a token and
        # walks the live handle table through the same unsafe enumeration the
        # binary uses, so the buffers those FFI calls fill are the buffers ASan
        # is watching.
        shell: pwsh
        env:
          RUSTFLAGS: -Zsanitizer=address
          # Symbolized frames need the MSVC symbolizer; without it a report is
          # a list of addresses and the finding is unreadable.
          ASAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cargo +nightly-2026-08-31 test --target x86_64-pc-windows-msvc `
            -p lsof-backend-windows
      - name: ASan over one real run of the binary
        # The unit tests exercise the enumeration; only the binary exercises it
        # against every process on the box, which is where a short buffer shows
        # up. `-p $PID` keeps it to this process's own handles so the step stays
        # bounded.
        shell: pwsh
        env:
          RUSTFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cargo +nightly-2026-08-31 run --target x86_64-pc-windows-msvc `
            -p lsof-cli --bin lsof -- -nP -p $PID
