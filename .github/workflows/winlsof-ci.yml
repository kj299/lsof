name: winlsof CI

# CI for the Rust, memory-safe, Windows-native lsof rewrite under winlsof/.
# The portable core builds and tests on Linux; the native Windows backend is
# built and tested on a real windows-latest runner (the paths that can't be
# linked off-Windows).
on:
  push:
    paths:
      - 'winlsof/**'
      - '.github/workflows/winlsof-ci.yml'
  pull_request:
    paths:
      - 'winlsof/**'
      - '.github/workflows/winlsof-ci.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: winlsof

jobs:
  core-linux:
    name: core + lints (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test (portable core + CLI via mock backend)
        run: cargo test --all
      - name: unsafe-audit (// SAFETY on every unsafe block)
        # Toolchain-free text scan from the porting kit. HARD gate: every unsafe
        # block in the backend carries a // SAFETY: justification (131/131), so
        # a new undocumented block fails CI.
        run: python3 ../porting-kit/harnesses/unsafe-audit/audit_unsafe.py crates/lsof-backend-windows/src

      - name: coverage gate (test surface vs the C's feature surface)
        # The question no other gate asks: are we testing everything the port
        # claims to do? A green differential says nothing about a feature no
        # fixture creates — that is how every non-File object type stayed
        # silently dropped (porting-kit LESSONS #8). HARD gate: the C's full
        # surface minus explicit, reasoned waivers must all be exercised, so a
        # newly dropped or newly untested feature fails CI. See coverage/README.md.
        run: |
          python3 ../porting-kit/harnesses/coverage/coverage_gate.py \
            --inventory coverage/feature-inventory-winlsof.toml \
            --matrix coverage/coverage-matrix.toml

  windows:
    name: native backend (windows)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: clippy (windows)
        run: cargo clippy --all-targets -- -D warnings
      - name: build (native Win32 backend)
        run: cargo build --all
      - name: test
        run: cargo test --all
      - name: build release binary
        run: cargo build --release --bin lsof
      - name: socket differential (oracle-substitution vs Get-NetTCPConnection)
        # Compares winlsof's `-i` socket SET against the OS's own table over
        # self-owned fixtures (see differential/README.md). Built-in cmdlets +
        # python only; no elevation, no third-party actions.
        # HARD gate: promoted after consecutive green runs on the hosted runner.
        # The comparator distinguishes divergence (exit 1) from infra (exit 2),
        # and the one known data-source divergence (BOUND sockets) is ledgered.
        shell: pwsh
        run: ./differential/capture.ps1 -Bin target/release/lsof.exe
      - name: live smoke test (55 cases over self-owned fixtures)
        # The end-to-end harness: stands up real fixtures (held file at a known
        # offset, named pipe with a connected client, mapped data file, TCP
        # v4/v6 + UDP sockets, child processes with a known cwd) and exercises
        # every option against them, cross-checking native oracles. Built-in
        # cmdlets only — nothing is downloaded.
        #
        # It is the source of most of coverage/coverage-matrix.toml's declared
        # cases, which until now rested on a harness CI never ran. Running it
        # here is what makes that coverage claim real.
        #
        # OBSERVE-FIRST (porting-kit LESSONS #9): a brand-new CI-only gate is
        # landed non-blocking and promoted to a hard gate after consecutive
        # green runs on the hosted runner, so a harness that turns out to be
        # environment-sensitive can't wedge every PR. Every environment-
        # dependent case already self-SKIPs (elevation, IPv6, WOW64), and the
        # harness exits 1 only on a real FAIL.
        continue-on-error: true
        shell: pwsh
        run: ./smoketest/Invoke-WinlsofSmokeTest.ps1 -SkipBuild -Binary target/release/lsof.exe -OutDir smoke-results
      - name: upload smoke-test results
        # Uploaded even when the step above fails: results.csv / summary.txt /
        # transcript.log are how the observe-first runs get read before promotion.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winlsof-smoke-results
          path: winlsof/smoke-results
          if-no-files-found: warn
      - name: upload lsof.exe
        uses: actions/upload-artifact@v4
        with:
          name: lsof-exe-windows
          path: winlsof/target/release/lsof.exe
          if-no-files-found: error

  supply-chain:
    name: supply-chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        # advisories + licenses + bans + sources, per winlsof/deny.toml. The
        # third-party surface is just the windows-sys family (MIT/Apache-2.0).
        run: cargo deny check

  fuzz:
    name: fuzz smoke (arg parser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: fuzz the argument parser (short smoke)
        # Adversarial input into the hand-rolled option parser: it must never
        # panic. A short time-boxed run gates every PR; a longer nightly run can
        # follow. See winlsof/fuzz/.
        run: cargo fuzz run parse_args -- -max_total_time=45 -rss_limit_mb=2048
