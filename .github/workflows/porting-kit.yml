name: porting-kit

# The kit's own integrity gate.
#
# `make -C porting-kit check-kit` is what the retrospective skill tells every
# port to run after editing the kit — and until this workflow existed, NOTHING
# ran it. `grep -rn check-kit .github/workflows/` returned nothing, so the kit
# asserted a control that no automation enforced, which is LESSONS #19's exact
# shape turned on the kit itself. This workflow IS the kit change of
# LESSONS #029; delete it and the kit's integrity gate is unwired again.
#
# It was not hypothetical. Commit 15d7a03 deleted the heading line of LESSONS
# entry 022 from an append-only file while leaving the body, splicing one
# entry's text onto another and breaking PLAYBOOK's `(LESSONS #22)` citation.
# That merged and sat in master for three days. PR #82 then merged a
# PLAYBOOK + LESSONS change with zero checks of any kind, because the only
# workflow watching porting-kit/ filtered on `harnesses/**` and excluded `.md`.
#
# So this workflow has no markdown exclusion — and, since the change below, no
# path filter at all: the failure this gate exists for was markdown-only. This
# is deliberately its own workflow rather than a job in lsof-rs-ci.yml, because
# that workflow's matrix (the native Windows jobs, the memory-safety gates, the
# differential against the C) is far too heavy to fire on a prose edit to the
# playbook. check-kit is python3 + bash with no toolchain, so this job is cheap.
#
# Note for anyone editing this comment: check_ledgers.py once decided the
# memory-safety ledger was satisfied by regex-matching the NAMES of those tools
# against every workflow file, comments included. An earlier draft of this
# header named them in passing and thereby made THIS file the reported evidence
# for that ledger — a workflow that runs none of them. It now reads executable
# text only (cb778b4), but the rule stands: name them in lsof-rs-ci.yml, where
# they run, not here.
# The path filter is GONE, and its absence is load-bearing.
#
# `check_lesson_refs.py` used to walk only `porting-kit/`, so a trigger of
# `porting-kit/**` covered everything the gate could see. It now walks the whole
# repository (`--also-scan ..`), because a sixth of this repo's lesson
# citations live outside the kit — in the workflows beside this one, in backend sources,
# Cargo manifests and fuzz targets. A gate that checks `lsof-rs/**` while firing
# only on `porting-kit/**` is not a gate: deleting a lesson entry and breaking a
# citation in `lsof-rs/` are two commits that would each pass.
#
# A gate's trigger is part of the gate (LESSONS #019; LESSONS #033). Widening
# what it inspects without widening what wakes it just moves the blind spot.
# check-kit is python3 + bash with no toolchain. It ran in seconds until the
# gate-mutation sweep began forcing every decision in every verdict function
# (LESSONS #069); it is a few minutes now, still cheap enough for everything.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check-kit:
    name: kit integrity (harness self-tests, skills, lesson refs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # No toolchain setup: check-kit is python3 + bash by design (see the
      # comment at the top of porting-kit/Makefile) so it runs on any runner.
      # Its skeleton step builds and tests the skeleton when cargo is on PATH
      # and skips without it; GitHub's ubuntu image has cargo, so here it
      # builds (LESSONS #082: until then nothing automatic ever had).
      #
      # cargo-deny, so `run_supply_chain.sh --check` loads deny.template.toml
      # with the tool that reads it. Without it the check prints a note and
      # passes on a TOML parse, which is how a key cargo-deny rejects outright
      # sat in the template, passing, until 2026-11-14 (LESSONS #089). A release
      # binary checked against the SHA-256 its release publishes: a few seconds,
      # where `cargo install` is five minutes of building an unpinned version.
      - name: install cargo-deny (pinned release binary)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfLo deny.tgz https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  deny.tgz" | sha256sum -c -
          tar xzf deny.tgz
          mkdir -p "$HOME/.cargo/bin"
          install -m 0755 cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny "$HOME/.cargo/bin/"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: make check-kit
        run: make -C porting-kit check-kit
