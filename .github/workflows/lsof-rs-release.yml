name: lsof-rs release

# Build and publish a distributable, native Windows `lsof.exe` as a GitHub
# Release asset (plus a SHA-256 for integrity). Trigger either by pushing a
# version tag (e.g. `lsof-rs-v1.1.0`) or manually from the Actions tab
# (workflow_dispatch), supplying the tag to create.
on:
  push:
    tags:
      # The project was renamed from winlsof; new releases use lsof-rs-v*. The
      # old prefix still triggers, but the published winlsof-v0.1.0 …
      # winlsof-v1.0.1 predate the rename: their trees have no lsof-rs/ to
      # build, so a rebuild of one stops with that reason (below) instead of
      # publishing master's code under the old version.
      - 'lsof-rs-v*'
      - 'winlsof-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. lsof-rs-v0.1.0)'
        required: true
      replace:
        description: 'Rebuild a release that is already published (replaces its binary and SHA-256)'
        type: boolean
        default: false

# The release step needs to create the release and upload assets.
permissions:
  contents: write

# Two runs for the same tag must never publish concurrently. They raced once
# (v1.0.1): both built `lsof.exe` — MSVC output is not byte-reproducible, so the
# two binaries differed — one created the release embedding *its* SHA-256 in the
# notes, and the other then clobbered the assets with *its* binary, leaving a
# release whose published hash did not match its own download. Serializing means
# the second run finds the release published and stops ("Resolve tag and
# commit"); only a dispatch with `replace` goes on, to the "already exists" path
# below, which replaces the notes as well as the assets, so the two always
# describe the same build.
concurrency:
  group: lsof-rs-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: lsof-rs

jobs:
  release:
    name: build + publish (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    # Signing (issue #3) turns on automatically once the AZSIGN_* repository
    # secrets exist; until then the signing steps no-op and releases ship
    # unsigned exactly as before. Setup runbook: lsof-rs/docs/code-signing.md.
    env:
      AZSIGN_ENABLED: ${{ secrets.AZSIGN_TENANT_ID != '' }}
    steps:
      # The whole history, for the tags; and no token left in .git/config while
      # cargo runs build scripts: `gh` below takes GH_TOKEN from its own env.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # The tag comes in through the environment, never pasted into the script:
      # a dispatch input or a tag name like `lsof-rs-v1$(id)` would otherwise run
      # in a job that can write to the repository. It must look like a version.
      #
      # And the binary is built from the TAG's commit. A dispatch checks out the
      # branch it was started from, so a dispatch for a tag that already exists
      # used to build that branch's head and publish it under the old version:
      # rerun for winlsof-v1.0.1 from master, it would have replaced that
      # release's lsof.exe and SHA-256 with a build of other code. Replacing a
      # published release at all now takes the `replace` input.
      - name: Resolve tag and commit
        id: tag
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REPLACE: ${{ github.event.inputs.replace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$REF_NAME"; fi
          if ! [[ "$TAG" =~ ^(lsof-rs|winlsof)-v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag (lsof-rs-vX.Y.Z)"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            if ! git cat-file -e "refs/tags/$TAG^{commit}:lsof-rs/Cargo.toml" 2>/dev/null; then
              echo "::error::$TAG predates the rename: its tree has no lsof-rs/ to build"; exit 1
            fi
            git checkout --quiet --detach "refs/tags/$TAG"
          fi
          SHA="$(git rev-parse HEAD)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$REPLACE" != "true" ]; then
            echo "::error::release $TAG is published; to rebuild it from $SHA, run this workflow from the Actions tab with tag $TAG and replace ticked"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary (native MSVC)
        run: cargo build --release --bin lsof

      # The binary shipped here must carry the overflow checks [profile.release]
      # sets, in every crate (lsof-rs-ci.yml explains the two signals). This
      # build is not the CI one, so CI passing is not proof; the script reruns
      # the build above with --message-format=json, which rebuilds nothing. A
      # tag from before 2026-10-09 has neither the flag nor the script, and a
      # rebuild of one ships what it always did.
      - name: Overflow checks reached the release binary
        shell: pwsh
        run: |
          if (Test-Path differential/overflow_gate.py) {
            python differential/overflow_gate.py
          } else {
            Write-Output "this tree predates overflow-checks in the release profile: nothing to check"
          }

      # Must run BEFORE the SHA-256 is computed in "Publish release" — the
      # Authenticode signature changes the binary's bytes.
      - name: Sign lsof.exe (Azure Artifact Signing)
        if: env.AZSIGN_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZSIGN_TENANT_ID }}
          azure-client-id: ${{ secrets.AZSIGN_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZSIGN_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZSIGN_ENDPOINT }}
          signing-account-name: ${{ secrets.AZSIGN_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZSIGN_PROFILE }}
          files-folder: ${{ github.workspace }}/lsof-rs/target/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify signature
        if: env.AZSIGN_ENABLED == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature target\release\lsof.exe
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') { throw "lsof.exe signature status: $($sig.Status)" }

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ steps.tag.outputs.sha }}
        run: |
          set -euo pipefail
          sha256sum target/release/lsof.exe | awk '{print $1}' > target/release/lsof.exe.sha256
          NOTES="$(cat <<EOF
          lsof-rs — a memory-safe, Windows-native reimplementation of \`lsof\` written in Rust.

          \`lsof.exe\` is a standalone x86_64 Windows binary
          (MSVC; no runtime install needed on Windows 10/11).

          **What it does**
          - Lists processes and their open file handles, TCP/UDP endpoints (\`-i\`),
            loaded modules (\`txt\`/\`mem\`), current directory (\`cwd\`), and more.
          - Full lsof option parity where the concepts map onto Windows: \`-s\`
            socket-state filters, \`-K\` threads, \`-L\`/\`+L\` link counts, \`-T\`
            TCP window/queue (EStats), \`-U\` AF_UNIX sockets (via ETW), \`-E\`/\`+E\`
            pipe endpoint peers, and more — see \`lsof -h\` and the CHANGELOG.
          - lsof-compatible options, columns, \`-F\` field codes, and JSON (\`-J\`/\`-j\`).
          - **Least privilege:** runs in your user context by default; run as
            Administrator for a system-wide view. Elevation is never auto-requested.

          **Usage**
          \`\`\`
          lsof -p <pid>            # open files/handles of a process
          lsof -i                  # all TCP/UDP endpoints, with owning PID
          lsof -nP -iTCP:443       # numeric, TCP port 443
          lsof -E -p <pid>         # pipe rows show who is on the other end
          lsof -p <pid> -J         # JSON output
          lsof -h                  # full option list
          \`\`\`

          The binary is **unsigned by design** (a privacy-conscious choice: a
          publicly-trusted signing certificate would put the maintainer's validated
          legal name and location permanently on every binary, and would buy only
          reduced download-friction, not the integrity the SHA-256 below already
          gives). Windows SmartScreen may therefore warn on first run.

          **Antivirus / Defender note.** lsof-rs does what an open-files lister
          must - enumerate every process's handles, enable \`SeDebugPrivilege\`, and
          read process memory (for \`cwd\`/PEB) - so heuristic AV including Microsoft
          Defender may flag a *downloaded* copy as a "hacktool" / potentially-unwanted
          program and block it from running, exactly like Sysinternals \`handle.exe\`.
          This is a **false positive**: verify the download against
          \`lsof.exe.sha256\` (below), then allow it in Windows Security -> Protection
          history, or add an exclusion in an elevated shell:
          \`Add-MpPreference -ExclusionPath <path-to-lsof.exe>\`. A locally built
          binary isn't internet-marked, so it usually isn't flagged. Code signing
          would reduce this over time and remains an option, not a plan - see
          \`lsof-rs/docs/code-signing.md\`.

          Verify integrity against the published SHA-256 (\`lsof.exe.sha256\`):

          SHA-256: \`$(cat target/release/lsof.exe.sha256)\`
          EOF
          )"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Replace the notes too, not just the assets: the notes quote the
            # SHA-256 of the binary this run built, so uploading one without the
            # other publishes a hash that doesn't match the download.
            gh release upload "$TAG" \
              target/release/lsof.exe target/release/lsof.exe.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
          else
            gh release create "$TAG" \
              target/release/lsof.exe target/release/lsof.exe.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --title "lsof-rs $TAG" \
              --target "$SHA" \
              --notes "$NOTES"
          fi
