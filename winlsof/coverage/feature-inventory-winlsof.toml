  "type:PLWG", "type:PLWI", "type:PLWS", "type:PLWU", "type:PLWX",
  "type:PMAP", "type:PMEM", "type:PMPS", "type:PNTF", "type:POBJ",
  "type:PODR", "type:POLP", "type:POPF", "type:POPG", "type:PORT",
  "type:PREG", "type:PRMP", "type:PROCDSC", "type:PRTD", "type:PSGA",
