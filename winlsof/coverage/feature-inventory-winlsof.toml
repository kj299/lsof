# feature-inventory — winlsof (the Windows Rust port of lsof)
#
# [features] is the C's FULL enumerated surface, extracted from src/main.c and
# lib/print.c by the kit's coverage gate, plus winlsof's own Windows-native TYPE
# codes. Waivers SUBTRACT from it. Keeping the whole C surface here is the point:
# when the C grows a feature, it shows up as uncovered rather than never being
# noticed, and the waiver list is a reviewable record of every conscious
# exclusion (LESSONS #8 — nothing is dropped silently).
#
# Gate:  python3 ../../porting-kit/harnesses/coverage/coverage_gate.py \
#          --inventory feature-inventory-winlsof.toml --matrix coverage-matrix.toml

[features]
options = [
  "A", "C", "D", "E", "F", "H", "J", "K", "L", "M", "N", "O", "P", "Q", "R",
  "S", "T", "U", "V", "X", "Z", "a", "b", "c", "d", "e", "f", "g", "h", "i",
  "j", "k", "l", "m", "n", "o", "p", "r", "s", "t", "u", "v", "w", "x", "z"
]
# Options that consume a value, so `-iTCP:80` counts as `i` alone and the
# value's characters are never miscredited as coverage.
takes_value = [
  "A", "D", "F", "K", "L", "S", "T", "Z", "c", "d", "e", "f", "g", "i", "k",
  "m", "o", "p", "r", "s", "u", "x", "z"
]
types = [
  "ATALK", "BLK", "CHR", "DEL", "DIR", "DOOR", "EVENTFD", "FIFO",
  "FSEVENTS", "IPv4", "IPv6", "KQUEUE", "LINK", "MPB", "MPC", "NPOLICY",
  "PAS", "PAXV", "PCRE", "PCTL", "PCUR", "PCWD", "PDIR", "PETY", "PFD",
  "PFDR", "PFIL", "PFPR", "PGD", "PGID", "PIPE", "PLC", "PLDR", "PLDT",
  "PLPI", "PLST", "PLU", "PLWG", "PLWI", "PLWS", "PLWU", "PLWX", "PMAP",
  "PMEM", "PMPS", "PNTF", "POBJ", "PODR", "POLP", "POPF", "POPG", "PORT",
  "PREG", "PRMP", "PROCDSC", "PRTD", "PSGA", "PSIN", "PSTA", "PSXMQ",
  "PSXSEM", "PSXSHM", "PTS", "PUSG", "PW", "PXMP", "REG", "SHM", "SMT",
  "SOCK", "STR", "STSO", "UNKN", "UNKNcwd", "UNKNdel", "UNKNfd", "UNKNmem",
  "UNKNrtd", "UNKNtxt", "UNNM", "UNSP", "VBAD", "VBLK", "VCHR", "VDIR",
  "VLNK", "VMPC", "VNON", "VREG", "XNAM", "XSD", "XSEM", "a_inode", "ax25",
  "icmp", "inet", "ipx", "key", "lla", "ndrv", "netlink", "pack", "ppp",
  "raw", "raw6", "rte", "sock", "systm", "unix", "unknown", "x.25"
]
# Windows-native TYPE codes with no C counterpart — the all-handle scan's
# kernel object types (lsof-core `FileType::code`). Exactly the class that was
# silently dropped until PR #31, so they are required coverage here.
extra = [
  "type:EVT", "type:KEY", "type:MUT", "type:PROC", "type:SECT", "type:THRD",
  "type:TOKN"
]

# ============================================================== waivers
# 1. Options winlsof declares N/A (reasons verbatim from
#    docs/feature-parity-plan.md).

[[waive]]
id = "opt:A"
reason = "AFS NWA mode (HP-UX); not portable"

[[waive]]
id = "opt:C"
reason = "kernel name cache; Unix-only"

[[waive]]
id = "opt:H"
reason = "legacy \"headers\" toggle on certain dialects"

[[waive]]
id = "opt:M"
reason = "portmapper — Unix RPC"

[[waive]]
id = "opt:N"
reason = "NFS-file listing"

[[waive]]
id = "opt:S"
reason = "lstat/readlink timeout — Unix; winlsof has its own bounded model"

[[waive]]
id = "opt:X"
reason = "cross-over info — Linux epoll bridge"

[[waive]]
id = "opt:Z"
reason = "SELinux contexts"

[[waive]]
id = "opt:b"
reason = "\"avoid blocking kernel\" — superseded by winlsof's bounded-worker model"

[[waive]]
id = "opt:e"
reason = "filesystem exempt — Unix mount-table concept"

[[waive]]
id = "opt:f"
reason = "filesystem-detail sub-flags; Unix-specific internals"

[[waive]]
id = "opt:k"
reason = "kernel symbol file — Unix-only"

[[waive]]
id = "opt:m"
reason = "mount supplement — Unix mtab"

[[waive]]
id = "opt:x"
reason = "cross-mount FS traversal — Unix mount table"

[[waive]]
id = "opt:z"
reason = "Solaris zones"

# 2. TYPE codes of other dialects, or unreachable on Windows. Grouped `ids`
#    share a reason; every id is still named explicitly — no globs, so a
#    feature added to the C later can never be swallowed by an old waiver.

[[waive]]
ids = [
  "type:PAS", "type:PAXV", "type:PCRE", "type:PCTL", "type:PCUR",
  "type:PCWD", "type:PDIR", "type:PETY", "type:PFD", "type:PFDR",
  "type:PFIL", "type:PFPR", "type:PGD", "type:PGID", "type:PLC",
