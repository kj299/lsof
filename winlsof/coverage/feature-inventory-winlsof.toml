# 3. COVERAGE DEBT — in scope, shipped, but not yet exercised by any test.
#    These are NOT scope decisions: each one is a missing fixture, and this is
#    the list the gate exists to keep visible. Delete the waiver the moment a
#    test covers it; the gate then enforces it forever after. Everything else
#    in this file is hard-gated today, so a NEW dropped feature fails CI.

