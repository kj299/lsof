# lsof-rs Linux differential matrix — mode 1: the real C oracle, same host.
#
# Run by linux_diff.py, which stands up four fixture processes and substitutes
# their PIDs for {A} (files: cwd, a regular file on fd 3, a hostile-named file
# on fd 4, a directory on fd 5, a FIFO on fd 6), {B} (sockets: a TCP listener,
# a UDP socket, and four AF_UNIX sockets covering every state lsof names —
# listening, both halves of a connected pair, and one never connected), {C}
# (a sleeper whose COMMAND is hostile ASCII) and {D} (hostile with non-ASCII),
# then hands the rendered matrix to the porting kit's diff_run.py. Both
# binaries run against the SAME process at the same instant, under
# LC_ALL=C.UTF-8, so PIDs, inodes, devices and sizes are identical on both
# sides and the kit's default whitespace-only normalization is sufficient.
# Numbers are never masked here: they are exactly the cells this gate exists
# to compare.
#
# MOST CASES CARRY -a, and the two that do not are the whole point of
# `or-semantics-*`. lsof ORs its list options unless -a ANDs them (Lsof.8:
# "list options that are specifically stated are ORed"), which lsof-rs now
# implements. Keeping -a on the other cases is still not optional: without it
# `-d ^mem -p PID` means "every non-mem file on the host OR process PID's
# files", so the case would measure the whole system instead of the fixture it
# names — and a whole-system case cannot be gated at all, because each binary
# lists ITSELF, under a pid that differs on every run.
#
# -n -P everywhere: the C resolves hostnames and service names by default;
# lsof-rs never does (a deliberate difference, docs/known-limitations.md), so
# the C is asked for the numeric form it will otherwise not print.
#
# -d ^mem on most file cases: a process maps a dozen libraries, and excluding
# them lets each case measure the surface it names instead of drowning in them.
# It is no longer a workaround — the backend reads /proc/<pid>/maps now, and
# `files-mem-rows`, `files-table-with-mem` and `mappings-mem-and-del` compare
# those rows head-on.
#
# A case is ledgered (DIVERGENCES.md, `- [x] name: reason`) only for a known,
# reasoned difference. Everything else must MATCH — stdout AND exit code.

# ------------------------------------------------------------- files fixture

[[case]]
name = "files-table"
args = ["-n", "-P", "-a", "-d", "^mem", "-p", "{A}"]

[[case]]
name = "files-fd-3"
args = ["-n", "-P", "-a", "-d", "3", "-p", "{A}"]

[[case]]
# NAME escaping in the table: fd 4 is a file named with an ANSI colour
# sequence, CR, TAB, a space, a backslash, DEL, é and U+009B. The C prints
# `^[[31m\r\t \\\x7f` + é + `\xc2\x9b` — spaces and printable UTF-8 are text
# in NAME, the 8-bit CSI is not.
name = "files-fd-4-hostile-name"
args = ["-n", "-P", "-a", "-d", "4", "-p", "{A}"]

[[case]]
# The same name through -F n. `-Ffn`, not `-Fn`: `f` is selected explicitly so
# the case compares the escaping and nothing else. (It once compared the marker
# rule too — lsof-rs emitted `f` unconditionally; see DIVERGENCES.md item 11,
# resolved — and `files-fields-Fcn` now covers that on its own.)
name = "files-fields-Ffn-hostile-name"
args = ["-n", "-P", "-a", "-Ffn", "-d", "4", "-p", "{A}"]

[[case]]
name = "files-terse"
args = ["-t", "-a", "-d", "^mem", "-p", "{A}"]

[[case]]
# LEDGERED. The C prints OFFSET as the column header and an empty cell for the
# cwd/rtd/txt specials; lsof-rs keeps SIZE/OFF and falls back to size. Shared
# renderer behavior (affects Windows), so a decision, not a backend fix.
name = "files-offset-o"
args = ["-n", "-P", "-o", "-a", "-d", "^mem", "-p", "{A}"]

[[case]]
# The `mem` rows themselves, one per distinct mapped file. Ledgered as DEBT
# (L2) until the backend learned to read /proc/<pid>/maps; it MATCHes now.
name = "files-mem-rows"
args = ["-n", "-P", "-a", "-d", "mem", "-p", "{A}"]

[[case]]
# The whole default table for the files fixture, mem rows included. Every
# other case still passes `-d ^mem` to measure its own surface; this one does
# not, so the mem rows are compared in place, in order, against the C.
name = "files-table-with-mem"
args = ["-n", "-P", "-a", "-p", "{A}"]

[[case]]
# THE WHOLE DEFAULT FIELD SET, in the C's own order. Bare `-F` selects every
# standard field (Lsof.8), so this one case pins the letters, their values and
# the sequence `print.c` walks: f a l t G d/D s o i k P n, then the T tokens
# *after* the name. Order is not cosmetic here — a `-F` consumer that treats
# the first T after n as the end of a record parses a differently-ordered
# stream wrongly.
name = "files-fields-F"
args = ["-n", "-P", "-F", "-a", "-d", "^mem", "-p", "{A}"]

[[case]]
# `-F0`: NUL field terminators. The C *appends* the set-closing NL after the
# last field's NUL (`…\0\n`) rather than replacing it, which is the whole
# point of the flag — a consumer splitting the stream on NUL otherwise gets
# one set's last field glued to the next set's first.
name = "files-fields-F0"
args = ["-n", "-P", "-F0", "-a", "-d", "^mem", "-p", "{A}"]

[[case]]
# An explicit letter list, which is a different code path from bare `-F`: only
# the named fields may appear, and `f` is NOT one of them unless asked for.
name = "files-fields-Fcn"
args = ["-n", "-P", "-Fcn", "-a", "-d", "^mem", "-p", "{A}"]

[[case]]
# THE OR RULE ITSELF, made deterministic. Both selectors name exactly one
# fixture — {FILE} is a path only A holds, -iTCP:{PORT} is only B's listener —
# so the union is two rows and nothing else on the host can drift into it.
# Neither is a PROCESS selector, which matters: a process selector makes its
# process "primarily selected" and every one of its files then inherits that
# match, mem rows included (lib/proc.c:178). Those lsof-rs cannot emit until
# L2, so any OR case built on -p would measure the mem-row debt, not the rule.
#
# THE OPTION MUST COME BEFORE THE PATH. lsof stops option parsing at the first
# non-option argument, so `lsof FILE -iTCP:N` reads `-iTCP:N` as a second
# FILENAME (which does not exist, hence exit 1); lsof-rs permutes and reads it
# as an option. That is DIVERGENCES.md #12, found by this case.
name = "or-semantics-path-or-inet"
args = ["-n", "-P", "-iTCP:{PORT}", "{FILE}"]

[[case]]
# The same two selectors ANDed. No file is both A's regular file and B's TCP
# listener, so both binaries print nothing and exit 1. The OR/AND pair is what
# proves -a is wired to the rule rather than merely accepted.
name = "or-semantics-path-and-inet"
args = ["-n", "-P", "-a", "-iTCP:{PORT}", "{FILE}"]

[[case]]
# A `^` negation is neither ORed nor ANDed: Lsof.8 says it "is applied before
# all other selections and absolutely excludes the listing of the files of the
# process". Fixture A is a `sleep`, so `-c ^sleep` kills it even though `-p`
# names it — both binaries print nothing and exit 1, the 1 because an excluded
# process never counts as a located `-p` search item.
name = "negation-excludes-absolutely"
args = ["-n", "-P", "-c", "^sleep", "-p", "{A}"]

[[case]]
# Same, with -a, because Lsof.8 warns that -a's placement is irrelevant:
# "Wherever -a is placed, it causes the ANDing of all selection options" — and
# a negation takes part in neither.
name = "negation-outranks-dash-a"
args = ["-n", "-P", "-a", "-c", "^sleep", "-p", "{A}"]

# ----------------------------------------------------------- sockets fixture

[[case]]
name = "sockets-table"
args = ["-n", "-P", "-a", "-d", "^mem", "-p", "{B}"]

[[case]]
name = "sockets-inet"
args = ["-n", "-P", "-a", "-i", "-p", "{B}"]

[[case]]
name = "sockets-inet-tcp"
args = ["-n", "-P", "-a", "-iTCP", "-p", "{B}"]

[[case]]
name = "sockets-inet-udp"
args = ["-n", "-P", "-a", "-iUDP", "-p", "{B}"]

[[case]]
name = "sockets-unix-U"
args = ["-n", "-P", "-a", "-U", "-p", "{B}"]

[[case]]
# Every socket row through the full field set. This is where the two halves of
# lsof's NODE cell separate: an internet socket reports its protocol as `P`,
# an AF_UNIX socket reports its inode as `i` — one discriminant (`inp_ty`),
# never both and never neither. It also pins the `T` tokens for UDP, which
# carries queues (and, when connected, ESTABLISHED) exactly as TCP does.
name = "sockets-fields-F"
args = ["-n", "-P", "-F", "-a", "-p", "{B}"]

[[case]]
# THE -T SELECTION MODEL. `-T`'s sub-letters SELECT, they do not add: the C
# zeroes Ftcptpi before ORing them in, so `-T q` is the queues INSTEAD of the
# state. And the annotation is ONE parenthesised group, space-separated, in
# print_tcptpi()'s own order (state, read queue, send queue) rather than the
# order the letters were given.
name = "sockets-dash-T-queues-only"
args = ["-n", "-P", "-a", "-i", "-T", "q", "-p", "{B}"]

[[case]]
name = "sockets-dash-T-state-and-queues"
args = ["-n", "-P", "-a", "-i", "-Tqs", "-p", "{B}"]

[[case]]
# Letter order must not reach the output: print_tcptpi() has its own.
name = "sockets-dash-T-letter-order-ignored"
args = ["-n", "-P", "-a", "-i", "-Tsq", "-p", "{B}"]

[[case]]
# A bare `-T` DISABLES the annotation (main.c: `Ftcptpi = GOp == '-' ? 0 : …`).
# It is not "-T with default sub-options", which is what lsof-rs used to read
# it as.
name = "sockets-dash-T-bare-disables"
args = ["-n", "-P", "-a", "-i", "-T", "-p", "{B}"]

[[case]]
# ...and `+T` is the way back to the state-only default.
name = "sockets-plus-T-restores-default"
args = ["-n", "-P", "-a", "-i", "+T", "-p", "{B}"]

[[case]]
# `-T f` selects the socket options, which the Linux dialect fills only for
# AF_UNIX rows and whose printer then ignores. So nothing prints — but the C
# has already written the separator space, so every socket row ends in one.
# (The differential normalizer strips trailing whitespace, so what this case
# really gates is that no row gained a *group*; the golden test holds the
# space itself.)
name = "sockets-dash-T-options-only"
args = ["-n", "-P", "-a", "-i", "-Tf", "-p", "{B}"]

[[case]]
# `w` is not a letter the Linux C accepts: HASTCPTPIW is undefined there, so
# `-T w` is a hard error and exit 1, not a request that quietly returns
# nothing. Windows, which can read the window from EStats, still accepts it.
name = "sockets-dash-T-window-rejected"
args = ["-n", "-P", "-a", "-i", "-Tw", "-p", "{B}"]

[[case]]
# The AF_UNIX state, which is not in the NAME: the C keeps it in `Lf->lts` and
# prints it from print_tcptpi(), so `-Fn` carries `… type=STREAM` and the state
# arrives separately as `TST=`. Fixture B holds one socket in each state lsof
# names, so a mapping that always answered LISTEN would fail here.
name = "sockets-unix-fields-F"
args = ["-n", "-P", "-a", "-U", "-FtiPnT", "-p", "{B}"]

# ------------------------------------------------------------ mapped files
# Rows that come from /proc/<pid>/maps rather than from an fd. Fixture E holds
# one live mapped library and one deleted while still mapped.

[[case]]
# The DEL row: a file unlinked but still mapped, which is what `lsof | grep DEL`
# finds after a package upgrade. It is also the one maps row that cannot be
# stat'd, so its device and inode come from the maps line and SIZE is blank.
# Both library copies have a space in the name, because a maps path is the rest
# of the line and must never be split on whitespace.
name = "mappings-mem-and-del"
args = ["-n", "-P", "-a", "-p", "{E}"]

[[case]]
# The same rows through the full field set. A DEL row is the one row whose
# device number cannot come from a stat — it is decoded from the maps line —
# so `-F D` is the only place a wrong decoding shows.
name = "mappings-fields-F"
args = ["-n", "-P", "-F", "-a", "-p", "{E}"]

# ------------------------------------------------- COMMAND column width (H)
# THE DEFAULT WIDTH. The C caps COMMAND at CMDL (9) unless `+c` says
# otherwise; lsof-rs printed the whole name. Every other fixture's command is
# `sleep`, `python3` or a hostile string — under the cap, or ledgered for a
# different reason — so fixture H exists purely to make the cap visible. Its
# command is 15 characters, the Linux comm ceiling.

[[case]]
name = "command-width-default-is-nine"
args = ["-n", "-P", "-a", "-d", "cwd", "-p", "{H}"]

[[case]]
# `+c 0` is no cap at all, not a cap of nothing (Lsof.8).
name = "command-width-plus-c-zero-is-no-cap"
args = ["-n", "-P", "+c", "0", "-a", "-d", "cwd", "-p", "{H}"]

[[case]]
# A `+c` narrower than the `COMMAND` header is effectively the header width:
# `+c` caps each row's CONTRIBUTION to the column, and the cut then happens at
# the column width, which starts at strlen("COMMAND"). So `+c 3` prints seven
# characters, not three.
name = "command-width-plus-c-below-header"
args = ["-n", "-P", "+c", "3", "-a", "-d", "cwd", "-p", "{H}"]

[[case]]
# Exactly the ceiling: accepted, and the whole 15-character name prints.
name = "command-width-plus-c-at-system-max"
args = ["-n", "-P", "+c", "15", "-a", "-d", "cwd", "-p", "{H}"]

[[case]]
# The C refuses a width wider than the longest command name the system can
# report (MAXSYSCMDL, 15 on Linux) rather than accepting a number it could
# never fill. Exit 1, no output.
name = "command-width-plus-c-over-system-max"
args = ["-n", "-P", "+c", "16", "-a", "-d", "cwd", "-p", "{H}"]

# ------------------------------------------------- file-system path arguments
# THE MOUNT-POINT RULE. A path argument that names a mounted-on directory is a
# FILE SYSTEM name, and selects every open file on it rather than the directory
# alone (Lsof.8; the C's `is_file_named` compares `s->dev == Lf->dev`). Fixture
# A straddles two filesystems without anything having to be mounted for the
# test: its stdio is on /dev/null (devtmpfs) and its other fds and mem rows are
# on the root filesystem.
#
# The comparison must be against the FILESYSTEM device, never the DEVICE cell —
# that cell is `st_rdev` for a device node — which is why the first attempt at
# this rule over-reported and was backed out until the model carried both.

[[case]]
name = "fs-arg-dev-selects-devtmpfs"
args = ["-n", "-P", "-a", "-p", "{A}", "/dev"]

[[case]]
# The complement: everything NOT on devtmpfs. A rule that leaked into name
# matching would add the /dev/null rows here, because `/` prefixes every
# absolute path — the exact over-report that made this DEBT rather than a fix.
name = "fs-arg-root-excludes-devtmpfs"
args = ["-n", "-P", "-a", "-p", "{A}", "/"]

[[case]]
# `-f` forbids the file-system reading: `lsof -f -- /` looks for open files
# NAMED `/`, which is the rtd row alone.
name = "fs-arg-dash-f-forces-plain-file"
args = ["-n", "-P", "-a", "-p", "{A}", "-f", "--", "/"]

[[case]]
# `+f` forces it, and widens what counts as a file system to any mount source,
# not just a block device — so the root filesystem can be named by whatever
# this host mounted it from.
name = "fs-arg-plus-f-by-mount-source"
args = ["-n", "-P", "-a", "-p", "{A}", "+f", "--", "{ROOTSRC}"]

[[case]]
# The half of the source test the root filesystem usually cannot reach: /dev's
# mount source is never a block device, so this case fails if `+f` does not
# widen the test beyond one. Fixture A's stdio is on /dev/null, so the match
# has rows to show.
name = "fs-arg-plus-f-non-block-source"
args = ["-n", "-P", "-a", "-p", "{A}", "+f", "--", "{DEVSRC}"]

[[case]]
# ...and without `+f` that same source names nothing: a non-block mount source
# is not a file system argument by default.
name = "fs-arg-non-block-source-needs-plus-f"
args = ["-n", "-P", "-a", "-p", "{A}", "{DEVSRC}"]

[[case]]
# `+f` on something that names no mount: the C complains and exits 1 rather
# than falling back to treating it as a plain file.
name = "fs-arg-plus-f-not-a-file-system"
args = ["-n", "-P", "-a", "-p", "{A}", "+f", "--", "{FILE}"]

[[case]]
# A file system with nothing open on it is an unlocated search item: exit 1,
# no rows. /sys is mounted on every Linux host and nothing holds a file there.
name = "fs-arg-empty-file-system-exits-1"
args = ["-n", "-P", "-a", "-p", "{A}", "/sys"]

# --------------------------------------------------------------- path arguments
# lsof matches a path argument by what the file IS -- its (device, inode) --
# not by what it is called, and `+d` (one level) is not `+D` (the tree). All
# three were one lowercased string-prefix match, which both invented rows and
# missed them. Every case here names fixture A's own directory, so the result
# is that fixture and nothing else on the host.

[[case]]
# LEDGERED for the NAME cell only. Identity, decisively: hard.txt is a second
# name for f.txt, which fixture A holds on fd 3 under the FIRST name, and
# matching by name would find nothing. Both binaries now find the same fd on
# the same inode; they disagree on what to call it. The C substitutes the name
# you ASKED about, lsof-rs prints the name the process actually opened
# (DIVERGENCES.md #17).
name = "path-bare-hardlink"
args = ["-n", "-P", "{HARDLINK}"]

[[case]]
# A directory names the directory, NOT the files under it. Fixture A holds its
# own cwd, so the cwd row matches and fd 3/4/6 must not.
name = "path-bare-dir-is-not-a-prefix"
args = ["-n", "-P", "{ADIR}"]

[[case]]
# A directory nobody has open matches nothing at all -- and exits 1, because
# the search item was never located.
name = "path-bare-dir-unopened"
args = ["-n", "-P", "{ASUB}"]

[[case]]
# `+d` is ONE level: the directory and its immediate entries, so f.txt and the
# hostile-named file, but nothing inside sub/. Exit 1 whenever some expanded
# entry is not open, which the C treats as an unlocated search item.
name = "path-plus-d-one-level"
args = ["-n", "-P", "+d", "{ADIR}"]

[[case]]
# `+D` descends the tree, so sub/ and anything below it join the set.
name = "path-plus-D-tree"
args = ["-n", "-P", "+D", "{ADIR}"]

# ----------------------------------------------------------- anonymous inodes
[[case]]
# Fds with no filesystem identity: the kernel names them `anon_inode:<kind>`
# and lsof types them `a_inode`, drops the prefix and prints the kind. Three
# kinds carry an identity in fdinfo that the C substitutes in — an eventpoll's
# watched fds (sorted, and fdinfo lists them most-recent-first), an eventfd's
# `eventfd-id` (not its count, and not the fd number), and a pidfd's target
# pid. `inotify` is the control: no identity, so it prints bare.
name = "anon-inode-kinds"
args = ["-n", "-P", "-a", "-d", "^mem", "-p", "{G}"]

# ------------------------------------------------------------------- locks
[[case]]
# The lock character lsof appends to the FD cell: `3uW` for a whole-file write
# lock, `4uw` for a partial one, and `R`/`r` for the read equivalents. Fixture
# F holds one of each, which is every character /proc/locks can produce (it
# reports only shared-vs-exclusive and the byte range).
name = "locks-fd-suffix"
args = ["-n", "-P", "-a", "-d", "^mem", "-p", "{F}"]

# ---------------------------------------------------------- hostile COMMANDs
# A process names itself, and until DIVERGENCES.md #10 was closed lsof-rs
# printed the name raw — a comm holding ESC [2J cleared the screen of whoever
# ran it. The C escapes COMMAND with safestrprtn(…, 2): control characters,
# DEL and the backslash in visible form, the space as \x20 (so the column
# still splits on whitespace) and every non-ASCII byte as \xNN.

[[case]]
# +c 0 lifts the C's default 9-column COMMAND cap (DIVERGENCES.md #3), so the
# whole escaped comm is compared: `h^[[2J\r\x20\\\x7f\t^Az`.
name = "hostile-comm-table"
args = ["-n", "-P", "+c", "0", "-a", "-d", "^mem", "-p", "{C}"]

[[case]]
# -F c goes through safestrprt(…, 0): same escapes, the space kept.
name = "hostile-comm-fields-Ffc"
args = ["-n", "-P", "-a", "-Ffc", "-d", "^mem", "-p", "{C}"]

[[case]]
# LEDGERED — the C's defect, not the port's, and deliberately not reproduced
# (porting-kit CLAUDE.md: the C is a specification that may be buggy).
# safestrlen() sizes the column by comparing each `char` with 0x20; `char` is
# signed on x86-64, so every byte >= 0x80 is counted as a 2-column escape when
# safestrprtn() will print 4 (`\xc3`), and the printer then cuts the command
# to the undersized width — here `\xc2\x9bz` is silently dropped even with
# +c 0. lsof-rs sizes and prints the same text. `-Ffc` on the same comm below
# MATCHes: the width bug is the table's alone.
name = "hostile-comm-utf8-table"
args = ["-n", "-P", "+c", "0", "-a", "-d", "^mem", "-p", "{D}"]

[[case]]
# é passes through (printable, UTF-8 locale); U+009B, which iswprint()
# rejects, is `\xc2\x9b`.
name = "hostile-comm-utf8-fields-Ffc"
args = ["-n", "-P", "-a", "-Ffc", "-d", "^mem", "-p", "{D}"]

# ------------------------------------------------------------- tasks (-K, I)
# THREAD LISTING. lsof models a Linux task as a process of its own: `-K` adds
# one entry per thread that repeats the WHOLE file set, because `CLONE_FS` and
# `CLONE_FILES` are optional and a thread can hold its own cwd, root and fd
# table. The entry carries the thread's tid and its own `comm`, which the table
# shows in two extra columns (TID, TASKCMD) and `-F` in the `K` and `M` fields.
# Fixture I is the only fixture with a second thread, which is why deleting the
# feature left the rest of the suite green (LESSONS: a gate that cannot fail).
# Its thread names are lopsided on purpose -- `taskname-long-1` (15 bytes, the
# kernel's `comm` ceiling) and `t2` -- because TASKCMD has its OWN column width
# in `print.c` and a port that reused COMMAND's would cut a thread name against
# `python3`. Two 7-character names, the first draft, hid that exactly.
#
# The columns are the gate as much as the rows are: the runner collapses runs
# of spaces, so a process row reads `python3 PID root cwd ...` and a task row
# `python3 PID TID worker1 root cwd ...` -- two extra fields that no normalizer
# can hide.

[[case]]
# Three entries (the process and its two threads), each repeating all seven
# non-mem rows. TASKCMD is `worker1`/`worker2` from prctl(PR_SET_NAME) and
# differs from COMMAND, so a column that echoed the command would still fail.
name = "tasks-dash-K"
args = ["-n", "-P", "-K", "-a", "-d", "^mem", "-p", "{I}"]

[[case]]
# mem rows repeat per task too -- the task is a whole process entry, not a
# TID appended to the process's rows.
name = "tasks-dash-K-repeats-mem-rows"
args = ["-n", "-P", "-K", "-a", "-p", "{I}"]

[[case]]
# TASKCMD is sized and cut by its own width, not COMMAND's: `TaskCmdColW`
# starts at `strlen("TASKCMD")` and grows over the task names, each capped by
# `+c` (`TaskCmdLim`, which `+c` sets alongside `CmdLim`). Here that is 9 by
# default against COMMAND's 7, so `taskname-long-1` prints nine characters.
name = "tasks-taskcmd-has-its-own-column-width"
args = ["-n", "-P", "-K", "-a", "-d", "cwd", "-p", "{I}"]

[[case]]
# `+c 0` lifts the cap on both columns, so the whole 15-character name prints.
name = "tasks-taskcmd-width-plus-c-zero"
args = ["-n", "-P", "-K", "+c", "0", "-a", "-d", "cwd", "-p", "{I}"]

[[case]]
# A `+c` between the two: TASKCMD takes 12 while COMMAND stays at its header.
name = "tasks-taskcmd-width-plus-c-twelve"
args = ["-n", "-P", "-K", "+c", "12", "-a", "-d", "cwd", "-p", "{I}"]

[[case]]
# `+c` BELOW the header, the TASKCMD twin of `command-width-plus-c-below-header`
# and the only case that can see the column's seed: `+c` caps each name's
# CONTRIBUTION, and the width still starts at `strlen("TASKCMD")`, so `+c 3`
# prints seven characters of the long name rather than three. Seeding the width
# from 0 instead is invisible to every other case here, because the longest
# name exceeds seven whatever the cap.
name = "tasks-taskcmd-width-plus-c-below-header"
args = ["-n", "-P", "-K", "+c", "3", "-a", "-d", "cwd", "-p", "{I}"]

[[case]]
# THE DEFAULT. `-K` is not needed to see tasks -- the C lists them whenever
# NOTHING selects (main.c leaves Selflags == SelAll). Give it any selector and
# they go away, columns included. This is the case that pins the suppression:
# same fixture, same fds, no TID/TASKCMD and one entry instead of three.
name = "tasks-suppressed-by-a-selector"
args = ["-n", "-P", "-a", "-d", "^mem", "-p", "{I}"]

[[case]]
# `-K i` turns listing off explicitly. Same output as the case above, reached
# the other way -- so a `-K` that ignored its argument would fail here.
name = "tasks-dash-K-i-separated"
args = ["-n", "-P", "-K", "i", "-a", "-d", "^mem", "-p", "{I}"]

[[case]]
# The attached spelling of the same thing. The C's getopt entry for K takes an
# optional argument, so both forms are legal and mean one flag, not two.
name = "tasks-dash-K-i-attached"
args = ["-n", "-P", "-Ki", "-a", "-d", "^mem", "-p", "{I}"]

[[case]]
# `i` is the ONLY argument `-K` accepts. Anything else is a usage error: exit
# 1, nothing on stdout (the message and the usage banner go to stderr, which
# the runner does not compare -- the exit code is the contract).
name = "tasks-dash-K-rejects-other-arguments"
args = ["-n", "-P", "-K", "x", "-a", "-p", "{I}"]

[[case]]
# `strcasecmp`, not `strcmp`: the C accepts `-K I` as `-K i`. lsof-rs compared
# the byte exactly and rejected it.
name = "tasks-dash-K-i-is-case-insensitive"
args = ["-n", "-P", "-K", "I", "-a", "-d", "^mem", "-p", "{I}"]

[[case]]
# `-K` takes the next word WHATEVER it is unless that word opens an option
# (main.c pushes back only on a leading `-` or `+`), so a path after `-K` is a
# usage error, not a name to look up. Consuming only a literal `i` turned
# `lsof -K /some/file` into a whole-host task listing where the C exits 1 —
# which the `-K x` case above could not see, because `x` matches nothing and
# the accidental exit 1 looked like the right answer.
name = "tasks-dash-K-consumes-a-path-argument"
args = ["-n", "-P", "-K", "{FILE}"]

[[case]]
# The field form: `K` is the tid and `M` the task's command, both emitted
# right after `p` in the process set, and both absent from the process's own
# entry. `f` keeps the file set small enough to read.
name = "tasks-dash-K-fields"
args = ["-n", "-P", "-K", "-a", "-d", "^mem", "-FpKMcf", "-p", "{I}"]

# ------------------------------------------- sockets in another namespace (J)
# `/proc/net/*` shows the CALLING process's network namespace, so a socket
# inside a container is an inode no local table explains. The C answers it from
# the `system.sockprotoname` extended attribute (`dsock.c`) and prints the
# PROTOCOL with no address: `sock  0,9  0t0  <inode>  protocol: TCP`. Three
# cells differ from an ordinary socket row -- a lowercase `sock` TYPE, the
# OFFSET rather than a size, and that NAME.
#
# lsof-rs reaches the same answer by reading the owning process's own
# `/proc/<pid>/net/*`, cached per namespace. It could print the address it
# learns on the way; it deliberately does not, because matching the C is the
# contract. See the ledger entry on AF_VSOCK for the families this cannot name
# and the xattr can.
#
# SKIPPED, not failed, on a runner without CAP_SYS_ADMIN for `unshare --net`.

[[case]]
# The whole row for the namespaced listener, socket cell included.
name = "netns-socket-shows-protocol-only"
args = ["-n", "-P", "-a", "-d", "^mem", "-p", "{J}"]

[[case]]
# The same row through `-F`: `t` is the TYPE and `n` the NAME, so this pins
# the two cells the table case could only show positionally.
name = "netns-socket-fields"
args = ["-n", "-P", "-a", "-d", "^mem", "-Ftn", "-p", "{J}"]

[[case]]
# `-i` selects internet sockets by protocol and state. An unresolved socket
# has neither, so it must NOT be selected -- the C leaves it out, and a port
# that resolved the address from the namespace table would wrongly include it.
name = "netns-socket-is-not-selected-by-dash-i"
args = ["-n", "-P", "-a", "-i", "-p", "{J}"]

# ----------------------------------------------- the search-item contract
# WHAT COUNTS AS A SEARCH ITEM, and what happens when one is not located.
# Two different failures that look alike from the outside:
#
#   * an argument that **cannot be stat'ed**. `ck_file_arg` reports the errno
#     and DROPS it, and if no argument survived it returns non-zero, which
#     `main.c` answers with `Error()` -- an exit BEFORE the listing runs. So
#     another selector never gets its turn.
#   * an argument that resolves but is **never located** among the rows. The
#     listing prints normally and only the exit status records it.
#
# `-Q` mutes both, status included; `-V` narrates them, on STDOUT, because
# every "not located" line in `main.c` is a `printf`.
#
# None of this was covered: 69 cases and neither `-V` nor `-Q` appeared in any
# of them.

[[case]]
# THE FATAL CASE. A selector that would have matched plenty, and one path that
# cannot be stat'ed: the C prints NOTHING. lsof-rs used to print the -p rows.
name = "search-unstattable-path-is-fatal"
args = ["-n", "-P", "-p", "{A}", "{NOPE}"]

[[case]]
# ... but only when NOTHING survived. One good path alongside the bad one and
# the listing runs as usual, with exit 1 recording the failure.
name = "search-one-good-path-survives-a-bad-one"
args = ["-n", "-P", "{ADIR}", "{NOPE}"]

[[case]]
# Argument order does not change it.
name = "search-bad-path-before-good"
args = ["-n", "-P", "{NOPE}", "{ADIR}"]

[[case]]
# TWO bad arguments alongside a selector that would have matched. Written this
# way on purpose: with no selector, "every path is bad" prints nothing whether
# or not the run aborts, so the obvious spelling of this case cannot fail. The
# `-p` gives it something to lose, and the second bad path is what a mutant
# that only records the FIRST failure gets wrong.
name = "search-all-paths-unstattable"
args = ["-n", "-P", "-p", "{A}", "{NOPE}", "{NOPE}x"]

[[case]]
# `-a` does not save it -- argument processing has already given up.
name = "search-unstattable-path-fatal-under-dash-a"
args = ["-n", "-P", "-a", "-p", "{A}", "{NOPE}"]

[[case]]
# RESOLVES but is not located: exit 1, and nothing printed without `-V`.
name = "search-unlocated-path-exits-1"
args = ["-n", "-P", "{UNOPENED}"]

[[case]]
# `-V` narrates it, on STDOUT: `lsof: no file use located: <path>`. lsof-rs
# wrote a differently-worded line to stderr, so a consumer redirecting stdout
# saw the table and none of the explanation.
name = "search-dash-V-reports-an-unlocated-path"
args = ["-n", "-P", "-V", "{UNOPENED}"]

[[case]]
# The same for a PID: `lsof: process ID not located: <pid>`, stdout.
name = "search-dash-V-reports-an-unlocated-pid"
args = ["-n", "-P", "-V", "-p", "999999999"]

[[case]]
# `-V` on the unstattable path: the errno line is stderr (not compared), the
# exit is still 1, and stdout stays empty.
name = "search-dash-V-with-an-unstattable-path"
args = ["-n", "-P", "-V", "{NOPE}"]

[[case]]
# `-Q` mutes the STATUS, not just the message: exit 0 where the same run
# without it exits 1. This is the half scripts branch on, and lsof-rs had
# muted the message alone.
name = "search-dash-Q-mutes-the-unlocated-status"
args = ["-n", "-P", "-Q", "{UNOPENED}"]

[[case]]
# `-Q` also makes an all-unstattable argument set non-fatal.
name = "search-dash-Q-makes-a-bad-path-non-fatal"
args = ["-n", "-P", "-Q", "{NOPE}"]

[[case]]
# ... and then the other selector DOES get its turn, exiting 0.
name = "search-dash-Q-lets-another-selector-run"
args = ["-n", "-P", "-Q", "-a", "-d", "cwd", "-p", "{A}", "{NOPE}"]

[[case]]
# `-Q` on a PID that does not exist: exit 0, where plain exits 1.
name = "search-dash-Q-mutes-an-unlocated-pid"
args = ["-n", "-P", "-Q", "-p", "999999999"]

[[case]]
# `+d` and `+D` reach the C through `enter_dir()`, NOT `ck_file_arg()`, so an
# unstattable directory is a warning and the run continues -- the opposite of
# a bare path. Exit 1, empty stdout, and the warning on stderr.
name = "search-plus-d-unstattable-is-not-fatal"
args = ["-n", "-P", "+d", "{NOPE}"]

[[case]]
# The other side of that: a `+d` that DOES resolve supplies search items, so a
# bad bare path alongside it is no longer "nothing survived" and the listing
# runs. Measured -- this is the case that decides whether the fatal test may
# look at bare paths alone, and nothing else here can see it.
#
# `{ASUB}` and not `{ADIR}` on purpose: fixture A holds `sub` open on fd 5 and
# `sub` is EMPTY, so there are no entry rows for the C to lose to the defect
# ledgered as `plus-d-entries-lost-to-a-bare-path` -- which would otherwise
# make this case about that defect instead of about the abort.
name = "search-plus-d-supplies-a-surviving-item"
args = ["-n", "-P", "{NOPE}", "+d", "{ASUB}"]

# ------------------------------------------------------------- exit contract

[[case]]
# No such process: both print nothing and exit 1. Exit-code fidelity was a real
# lsof-rs bug once (LESSONS #4); the kit runner diffs the code, not just stdout.
name = "no-match-exit-code"
args = ["-n", "-P", "-a", "-p", "999999999"]
