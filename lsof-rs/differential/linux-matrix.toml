# lsof-rs Linux differential matrix — mode 1: the real C oracle, same host.
#
# Run by linux_diff.py, which stands up the fixture processes its docstring lists
# (`linux_diff.py --help`) and substitutes their PIDs, paths and port. The first
# four are {A} (files: cwd, a regular file on fd 3, a hostile-named file
# on fd 4, a directory on fd 5, a FIFO on fd 6), {B} (sockets: a TCP listener,
# a UDP socket, and four AF_UNIX sockets covering every state lsof names —
# listening, both halves of a connected pair, and one never connected), {C}
# (a sleeper whose COMMAND is hostile ASCII) and {D} (hostile with non-ASCII),
# then hands the rendered matrix to the porting kit's diff_run.py. Both
# binaries run against the SAME process at the same instant, under
# LC_ALL=C.UTF-8, so PIDs, inodes, devices and sizes are identical on both
# sides. Numbers are never masked here: they are exactly the cells this gate
# exists to compare. Nor is whitespace collapsed: linux_diff.py gives every
# case `keep_whitespace = true`, so the table's alignment is compared byte for
# byte (DIVERGENCES 35). A case may set it to false, and none does.
#
# MOST CASES CARRY -a. The ones that do not are about OR itself
# (`or-semantics-*`), search items, path arguments and option errors. lsof ORs its list options unless -a ANDs them (Lsof.8:
# "list options that are specifically stated are ORed"), which lsof-rs now
# implements. Keeping -a on the other cases is still not optional: without it
# `-d ^mem -p PID` means "every non-mem file on the host OR process PID's
# files", so the case would measure the whole system instead of the fixture it
# names — and a whole-system case cannot be gated at all, because each binary
# lists ITSELF, under a pid that differs on every run.
#
# -n -P wherever a socket can appear: the C resolves hostnames and service
# names by default; lsof-rs on Linux never does (docs/known-limitations.md), so
# the C is asked for the numeric form it will otherwise not print.
#
# -d ^mem on most file cases: a process maps a dozen libraries, and excluding
# them lets each case measure the surface it names instead of drowning in them.
# It is no longer a workaround — the backend reads /proc/<pid>/maps now, and
# `files-mem-rows`, `files-table-with-mem` and `mappings-mem-and-del` compare
# those rows head-on.
#
# A case is ledgered (DIVERGENCES.md, `- [x] name: reason`) only for a known,
# reasoned difference. Everything else must MATCH — stdout AND exit code.

# ------------------------------------------------------------- files fixture

[[case]]
name = "files-table"
args = ["-n", "-P", "-a", "-d", "^mem", "-p", "{A}"]

[[case]]
name = "files-fd-3"
args = ["-n", "-P", "-a", "-d", "3", "-p", "{A}"]

[[case]]
# NAME escaping in the table: fd 4 is a file named with an ANSI colour
# sequence, CR, TAB, a space, a backslash, DEL, é and U+009B. The C prints
# `^[[31m\r\t \\\x7f` + é + `\xc2\x9b` — spaces and printable UTF-8 are text
# in NAME, the 8-bit CSI is not.
name = "files-fd-4-hostile-name"
args = ["-n", "-P", "-a", "-d", "4", "-p", "{A}"]

[[case]]
# The same name through -F n. `-Ffn`, not `-Fn`: `f` is selected explicitly so
# the case compares the escaping and nothing else. (It once compared the marker
# rule too — lsof-rs emitted `f` unconditionally; see DIVERGENCES.md item 11,
# resolved — and `files-fields-Fcn` now covers that on its own.)
name = "files-fields-Ffn-hostile-name"
args = ["-n", "-P", "-a", "-Ffn", "-d", "4", "-p", "{A}"]

[[case]]
# `-H` (DIVERGENCES: the option was waived as a "legacy headers toggle" and is
# in fact human-readable sizes). fds 7/8/9 are sparse files of 1023, 1048575
# and 25847420 bytes: the sub-1KiB branch, the suffix-before-rounding rule that
# prints `1024.0K` rather than `1.0M`, and the integer-then-float divide that
# prints `24.6M` rather than `24.7M`. A plain -H run would exercise none of
# them.
name = "files-human-size"
args = ["-n", "-P", "-H", "-a", "-d", "7,8,9", "-p", "{A}"]

[[case]]
# -H scales the size only. The C humanises inside the sz_def branch alone, so
# the FIFO on fd 6 keeps its `0t0` offset under -H exactly as without it.
name = "files-human-size-leaves-offsets"
args = ["-n", "-P", "-H", "-a", "-d", "6", "-p", "{A}"]

[[case]]
# -H is table-only: the C's -F writer never consults Fhuman, so this must be
# byte-identical to the run without -H.
name = "files-human-size-not-in-fields"
args = ["-n", "-P", "-H", "-a", "-Fs", "-d", "7,8,9", "-p", "{A}"]

[[case]]
name = "files-terse"
args = ["-t", "-a", "-d", "^mem", "-p", "{A}"]

[[case]]
# `-o` is an OFFSET column, not "prefer the offset": the header says OFFSET,
# and cwd/rtd/txt -- which have a size and no offset, there being no fdinfo
# behind them -- print an EMPTY cell. lsof-rs kept SIZE/OFF and fell back to
# the size, ledgered as a decision until DIVERGENCES 6 was closed.
name = "files-offset-o"
args = ["-n", "-P", "-o", "-a", "-d", "^mem", "-p", "{A}"]

[[case]]
# `-s` alone is the other half: a SIZE column, and the FIFO -- an offset and
# no size -- prints an empty cell.
name = "files-size-s"
args = ["-n", "-P", "-s", "-a", "-d", "^mem", "-p", "{A}"]

[[case]]
# A word that opens an option is not `-s`'s value. lsof-rs had taken `-p` as
# a state filter and the pid as a file name, and exited on "status error".
name = "opt-s-before-another-option-is-the-size-column"
args = ["-n", "-P", "-a", "-s", "-p", "{A}", "-d", "^mem"]

[[case]]
# The `mem` rows themselves, one per distinct mapped file. Ledgered as DEBT
# (L2) until the backend learned to read /proc/<pid>/maps; it MATCHes now.
name = "files-mem-rows"
args = ["-n", "-P", "-a", "-d", "mem", "-p", "{A}"]

[[case]]
# The whole default table for the files fixture, mem rows included. Every
# other case still passes `-d ^mem` to measure its own surface; this one does
# not, so the mem rows are compared in place, in order, against the C.
name = "files-table-with-mem"
args = ["-n", "-P", "-a", "-p", "{A}"]

[[case]]
# THE WHOLE DEFAULT FIELD SET, in the C's own order. Bare `-F` selects every
# standard field (Lsof.8), so this one case pins the letters, their values and
# the sequence `print.c` walks: f a l t G d/D s o i k P n, then the T tokens
# *after* the name. Order is not cosmetic here — a `-F` consumer that treats
# the first T after n as the end of a record parses a differently-ordered
# stream wrongly.
name = "files-fields-F"
args = ["-n", "-P", "-F", "-a", "-d", "^mem", "-p", "{A}"]

[[case]]
# `-F0`: NUL field terminators. The C *appends* the set-closing NL after the
# last field's NUL (`…\0\n`) rather than replacing it, which is the whole
# point of the flag — a consumer splitting the stream on NUL otherwise gets
# one set's last field glued to the next set's first.
name = "files-fields-F0"
args = ["-n", "-P", "-F0", "-a", "-d", "^mem", "-p", "{A}"]

[[case]]
# An explicit letter list, which is a different code path from bare `-F`: only
# the named fields may appear, and `f` is NOT one of them unless asked for.
name = "files-fields-Fcn"
args = ["-n", "-P", "-Fcn", "-a", "-d", "^mem", "-p", "{A}"]

[[case]]
# THE OR RULE ITSELF, made deterministic. Both selectors name exactly one
# fixture — {FILE} is a path only A holds, -iTCP:{PORT} is only B's listener —
# so the union is two rows and nothing else on the host can drift into it.
# Neither is a PROCESS selector, which matters: a process selector makes its
# process "primarily selected" and every one of its files then inherits that
# match, mem rows included (lib/proc.c:178). Those lsof-rs cannot emit until
# L2, so any OR case built on -p would measure the mem-row debt, not the rule.
#
# THE OPTION MUST COME BEFORE THE PATH. lsof stops option parsing at the first
# non-option argument, so `lsof FILE -iTCP:N` reads `-iTCP:N` as a second
# FILENAME (which does not exist, hence exit 1); lsof-rs permutes and reads it
# as an option. That is DIVERGENCES.md #12, found by this case.
name = "or-semantics-path-or-inet"
args = ["-n", "-P", "-iTCP:{PORT}", "{FILE}"]

[[case]]
# The same two selectors ANDed. No file is both A's regular file and B's TCP
# listener, so both binaries print nothing and exit 1. The OR/AND pair is what
# proves -a is wired to the rule rather than merely accepted.
name = "or-semantics-path-and-inet"
args = ["-n", "-P", "-a", "-iTCP:{PORT}", "{FILE}"]

[[case]]
# ---- the socket-only collection path (P5) --------------------------------
# `-iTCP:<port>` alone specifies nothing but NET, so nothing but a socket can
# reach the output and the Linux backend stops collecting the rest: no cwd,
# rtd or txt, and no /proc/<pid>/maps walk at all. Measured at 577 processes,
# this port opened 578 maps files for `lsof -i` where the C opened none.
# THIS is the case that runs the fast path -- every other `-i` case in this
# matrix pairs it with `-p`, which by design switches the path off, so before
# this case the whole thing was ungated.
name = "inet-alone-collects-only-sockets"
args = ["-n", "-P", "-iTCP:{PORT}"]

[[case]]
# The other side of the same rule, and the one that fails loudly if the
# predicate forgets that selection ORs: a process selecter contributes EVERY
# file of a process it matches (measured in P4 for -N). So `-iTCP:<port> -p A`
# must print all of A's files -- cwd, txt and mapped rows included -- plus B's
# listener. A socket-only fast path that ignored `-p` would print one row.
name = "inet-with-a-pid-still-lists-that-pids-other-files"
args = ["-n", "-P", "-iTCP:{PORT}", "-p", "{A}"]

[[case]]
# A `^` negation is neither ORed nor ANDed: Lsof.8 says it "is applied before
# all other selections and absolutely excludes the listing of the files of the
# process". Fixture A is a `sleep`, so `-c ^sleep` kills it even though `-p`
# names it — both binaries print nothing and exit 1, but NOT for the same
# reason, which `-V` would show: the C counts the pid as located (it marks
# `-p` before it tests `-c ^`) and exits 1 because a `-c ^` value is itself a
# search item it can never mark (DIVERGENCES 13, a defect lsof-rs does not
# copy); lsof-rs exits 1 because the excluded pid was not located.
name = "negation-excludes-absolutely"
args = ["-n", "-P", "-c", "^sleep", "-p", "{A}"]

[[case]]
# Same, with -a, because Lsof.8 warns that -a's placement is irrelevant:
# "Wherever -a is placed, it causes the ANDing of all selection options" — and
# a negation takes part in neither.
name = "negation-outranks-dash-a"
args = ["-n", "-P", "-a", "-c", "^sleep", "-p", "{A}"]

# ----------------------------------------------------------- sockets fixture

[[case]]
name = "sockets-table"
args = ["-n", "-P", "-a", "-d", "^mem", "-p", "{B}"]

[[case]]
name = "sockets-inet"
args = ["-n", "-P", "-a", "-i", "-p", "{B}"]

[[case]]
name = "sockets-inet-tcp"
args = ["-n", "-P", "-a", "-iTCP", "-p", "{B}"]

[[case]]
name = "sockets-inet-udp"
args = ["-n", "-P", "-a", "-iUDP", "-p", "{B}"]

[[case]]
name = "sockets-unix-U"
args = ["-n", "-P", "-a", "-U", "-p", "{B}"]

[[case]]
# Every socket row through the full field set. This is where the two halves of
# lsof's NODE cell separate: an internet socket reports its protocol as `P`,
# an AF_UNIX socket reports its inode as `i` — one discriminant (`inp_ty`),
# never both and never neither. It also pins the `T` tokens for UDP, which
# carries queues (and, when connected, ESTABLISHED) exactly as TCP does.
name = "sockets-fields-F"
args = ["-n", "-P", "-F", "-a", "-p", "{B}"]

[[case]]
# THE -T SELECTION MODEL. `-T`'s sub-letters SELECT, they do not add: the C
# zeroes Ftcptpi before ORing them in, so `-T q` is the queues INSTEAD of the
# state. And the annotation is ONE parenthesised group, space-separated, in
# print_tcptpi()'s own order (state, read queue, send queue) rather than the
# order the letters were given.
name = "sockets-dash-T-queues-only"
args = ["-n", "-P", "-a", "-i", "-T", "q", "-p", "{B}"]

[[case]]
name = "sockets-dash-T-state-and-queues"
args = ["-n", "-P", "-a", "-i", "-Tqs", "-p", "{B}"]

[[case]]
# Letter order must not reach the output: print_tcptpi() has its own.
name = "sockets-dash-T-letter-order-ignored"
args = ["-n", "-P", "-a", "-i", "-Tsq", "-p", "{B}"]

[[case]]
# A bare `-T` DISABLES the annotation (main.c: `Ftcptpi = GOp == '-' ? 0 : …`).
# It is not "-T with default sub-options", which is what lsof-rs used to read
# it as.
name = "sockets-dash-T-bare-disables"
args = ["-n", "-P", "-a", "-i", "-T", "-p", "{B}"]

[[case]]
# ...and `+T` is the way back to the state-only default.
name = "sockets-plus-T-restores-default"
args = ["-n", "-P", "-a", "-i", "+T", "-p", "{B}"]

[[case]]
# `-T f` selects the socket options, which the Linux dialect fills only for
# AF_UNIX rows and whose printer then ignores. So nothing prints — but the C
# has already written the separator space, so every socket row ends in one.
# (The differential normalizer strips trailing whitespace, so what this case
# really gates is that no row gained a *group*; the golden test holds the
# space itself.)
name = "sockets-dash-T-options-only"
args = ["-n", "-P", "-a", "-i", "-Tf", "-p", "{B}"]

[[case]]
# `w` is not a letter the Linux C accepts: HASTCPTPIW is undefined there, so
# `-T w` is a hard error and exit 1, not a request that quietly returns
# nothing. Windows, which can read the window from EStats, still accepts it.
name = "sockets-dash-T-window-rejected"
args = ["-n", "-P", "-a", "-i", "-Tw", "-p", "{B}"]

[[case]]
# The AF_UNIX state, which is not in the NAME: the C keeps it in `Lf->lts` and
# prints it from print_tcptpi(), so `-Fn` carries `… type=STREAM` and the state
# arrives separately as `TST=`. Fixture B holds one socket in each state lsof
# names, so a mapping that always answered LISTEN would fail here.
name = "sockets-unix-fields-F"
args = ["-n", "-P", "-a", "-U", "-FtiPnT", "-p", "{B}"]

# ------------------------------------------------------------ mapped files
# Rows that come from /proc/<pid>/maps rather than from an fd. Fixture E holds
# one live mapped library and one deleted while still mapped, and every other
# kind of mapping an unprivileged process can make (see `mapping_holder`):
# each is a row in the C, whatever a `stat` of it says, where lsof-rs dropped
# the ones it could not `stat` (DIVERGENCES 95) and typed every one `REG`
# (48).

[[case]]
# The DEL row: a file unlinked but still mapped, which is what `lsof | grep DEL`
# finds after a package upgrade. It is also the one maps row that cannot be
# stat'd, so its device and inode come from the maps line and SIZE is blank.
# Both library copies have a space in the name, because a maps path is the rest
# of the line and must never be split on whitespace.
name = "mappings-mem-and-del"
args = ["-n", "-P", "-a", "-p", "{E}"]

[[case]]
# The same rows through the full field set. A DEL row is the one row whose
# device number cannot come from a stat — it is decoded from the maps line —
# so `-F D` is the only place a wrong decoding shows.
name = "mappings-fields-F"
args = ["-n", "-P", "-F", "-a", "-p", "{E}"]

[[case]]
# NLINK: 2 for the relinked file, 1 for /dev/zero, and blank where only the
# maps line speaks (`tab`, the io_uring ring, the DEL rows).
name = "mappings-plus-L"
args = ["-n", "-P", "+L", "-a", "-d", "mem,DEL", "-p", "{E}"]

[[case]]
# `-w` mutes the `(stat: …)` the C adds for what it could not `stat`, and
# keeps the row.
name = "mappings-minus-w-mutes-the-reasons"
args = ["-n", "-P", "-w", "-a", "-d", "mem,DEL", "-p", "{E}"]

[[case]]
# The fields a mapped device and a lock show in: `r` (the device /dev/zero
# names), `D` (the devtmpfs it lives on), no `s`; `l` on the `mem` and `DEL`
# rows of the locked files.
name = "mappings-device-and-lock-fields"
args = ["-n", "-P", "-FfatDsiklnr", "-a", "-d", "mem,DEL", "-p", "{E}"]

[[case]]
# A path argument naming a device finds its mapping: the row is `CHR`, with
# the device's identity.
name = "mappings-path-argument-finds-a-mapped-device"
args = ["-n", "-P", "-a", "-p", "{E}", "/dev/zero"]

[[case]]
# The relinked file is `mem`, with its size, and a path argument finds it.
name = "mappings-path-argument-finds-a-relinked-mapping"
args = ["-n", "-P", "-a", "-p", "{E}", "{ERELINK}"]

# ------------------------------------------------- COMMAND column width (H)
# THE DEFAULT WIDTH. The C caps COMMAND at CMDL (9) unless `+c` says
# otherwise; lsof-rs printed the whole name. Every other fixture's command is
# `sleep`, `python3` or a hostile string — under the cap, or ledgered for a
# different reason — so fixture H exists purely to make the cap visible. Its
# command is 15 characters, the Linux comm ceiling.

[[case]]
name = "command-width-default-is-nine"
args = ["-n", "-P", "-a", "-d", "cwd", "-p", "{H}"]

[[case]]
# `+c 0` is no cap at all, not a cap of nothing (Lsof.8).
name = "command-width-plus-c-zero-is-no-cap"
args = ["-n", "-P", "+c", "0", "-a", "-d", "cwd", "-p", "{H}"]

[[case]]
# A `+c` narrower than the `COMMAND` header is effectively the header width:
# `+c` caps each row's CONTRIBUTION to the column, and the cut then happens at
# the column width, which starts at strlen("COMMAND"). So `+c 3` prints seven
# characters, not three.
name = "command-width-plus-c-below-header"
args = ["-n", "-P", "+c", "3", "-a", "-d", "cwd", "-p", "{H}"]

[[case]]
# Exactly the ceiling: accepted, and the whole 15-character name prints.
name = "command-width-plus-c-at-system-max"
args = ["-n", "-P", "+c", "15", "-a", "-d", "cwd", "-p", "{H}"]

[[case]]
# The C refuses a width wider than the longest command name the system can
# report (MAXSYSCMDL, 15 on Linux) rather than accepting a number it could
# never fill. Exit 1, no output.
name = "command-width-plus-c-over-system-max"
args = ["-n", "-P", "+c", "16", "-a", "-d", "cwd", "-p", "{H}"]

# ------------------------------------------------- file-system path arguments
# THE MOUNT-POINT RULE. A path argument that names a mounted-on directory is a
# FILE SYSTEM name, and selects every open file on it rather than the directory
# alone (Lsof.8; the C's `is_file_named` compares `s->dev == Lf->dev`). Fixture
# A straddles two filesystems without anything having to be mounted for the
# test: its stdio is on /dev/null (devtmpfs) and its other fds and mem rows are
# on the root filesystem.
#
# The comparison must be against the FILESYSTEM device, never the DEVICE cell —
# that cell is `st_rdev` for a device node — which is why the first attempt at
# this rule over-reported and was backed out until the model carried both.

[[case]]
name = "fs-arg-dev-selects-devtmpfs"
args = ["-n", "-P", "-a", "-p", "{A}", "/dev"]

[[case]]
# The complement: everything NOT on devtmpfs. A rule that leaked into name
# matching would add the /dev/null rows here, because `/` prefixes every
# absolute path — the exact over-report that made this DEBT rather than a fix.
name = "fs-arg-root-excludes-devtmpfs"
args = ["-n", "-P", "-a", "-p", "{A}", "/"]

[[case]]
# `-f` forbids the file-system reading: `lsof -f -- /` looks for open files
# NAMED `/`, which is the rtd row alone.
name = "fs-arg-dash-f-forces-plain-file"
args = ["-n", "-P", "-a", "-p", "{A}", "-f", "--", "/"]

[[case]]
# `+f` forces it, and widens what counts as a file system to any mount source,
# not just a block device — so the root filesystem can be named by whatever
# this host mounted it from.
name = "fs-arg-plus-f-by-mount-source"
args = ["-n", "-P", "-a", "-p", "{A}", "+f", "--", "{ROOTSRC}"]

[[case]]
# The half of the source test the root filesystem usually cannot reach: /dev's
# mount source is never a block device, so this case fails if `+f` does not
# widen the test beyond one. Fixture A's stdio is on /dev/null, so the match
# has rows to show.
name = "fs-arg-plus-f-non-block-source"
args = ["-n", "-P", "-a", "-p", "{A}", "+f", "--", "{DEVSRC}"]

[[case]]
# ...and without `+f` that same source names nothing: a non-block mount source
# is not a file system argument by default.
name = "fs-arg-non-block-source-needs-plus-f"
args = ["-n", "-P", "-a", "-p", "{A}", "{DEVSRC}"]

[[case]]
# `+f` on something that names no mount: the C complains and exits 1 rather
# than falling back to treating it as a plain file.
name = "fs-arg-plus-f-not-a-file-system"
args = ["-n", "-P", "-a", "-p", "{A}", "+f", "--", "{FILE}"]

[[case]]
# A file system with nothing open on it is an unlocated search item: exit 1,
# no rows. /sys is mounted on every Linux host and nothing holds a file there.
name = "fs-arg-empty-file-system-exits-1"
args = ["-n", "-P", "-a", "-p", "{A}", "/sys"]

# --------------------------------------------------------------- path arguments
# lsof matches a path argument by what the file IS -- its (device, inode) --
# not by what it is called, and `+d` (one level) is not `+D` (the tree). All
# three were one lowercased string-prefix match, which both invented rows and
# missed them. Every case here names fixture A's own directory, so the result
# is that fixture and nothing else on the host.

[[case]]
# LEDGERED for the NAME cell only. Identity, decisively: hard.txt is a second
# name for f.txt, which fixture A holds on fd 3 under the FIRST name, and
# matching by name would find nothing. Both binaries now find the same fd on
# the same inode; they disagree on what to call it. The C substitutes the name
# you ASKED about, lsof-rs prints the name the process actually opened
# (DIVERGENCES.md #17).
name = "path-bare-hardlink"
args = ["-n", "-P", "{HARDLINK}"]

[[case]]
# A directory names the directory, NOT the files under it. Fixture A holds its
# own cwd, so the cwd row matches and fd 3/4/6 must not.
name = "path-bare-dir-is-not-a-prefix"
args = ["-n", "-P", "{ADIR}"]

[[case]]
# A directory nobody has open matches nothing at all -- and exits 1, because
# the search item was never located.
name = "path-bare-dir-unopened"
args = ["-n", "-P", "{ASUB}"]

[[case]]
# `+d` is ONE level: the directory and its immediate entries, so f.txt and the
# hostile-named file, but nothing inside sub/. Exit 1 whenever some expanded
# entry is not open, which the C treats as an unlocated search item.
name = "path-plus-d-one-level"
args = ["-n", "-P", "+d", "{ADIR}"]

[[case]]
# `+D` descends the tree, so sub/ and anything below it join the set.
name = "path-plus-D-tree"
args = ["-n", "-P", "+D", "{ADIR}"]

# An AF_UNIX socket is found by the path it is bound to (DIVERGENCES 60). The C
# stats each bound path in /proc/net/unix and, when it is a socket file, finds
# the socket by that file's device and inode -- so a symlink to it finds it
# too -- and otherwise compares the path as typed. Fixture Y: a listener on
# u.sock with one accepted connection (whose row carries the path; the client
# end has none), link.sock a symlink to it, and gone.sock a socket whose file
# was replaced by a regular one. lsof-rs compared each row's NAME, which ends
# in `type=STREAM`, and found no socket at all.

[[case]]
name = "path-unix-socket-by-its-path"
args = ["-n", "-P", "-V", "{YSOCK}"]

[[case]]
name = "path-unix-socket-through-a-symlink"
args = ["-n", "-P", "-V", "{YLINK}"]

[[case]]
# The file at gone.sock is no socket, so the path as typed decides.
name = "path-unix-socket-whose-file-was-replaced"
args = ["-n", "-P", "-V", "{YGONE}"]

[[case]]
# A symlink to that regular file reaches no socket file, and its own path is
# not the bound one: nothing is found, and the run exits 1.
name = "path-unix-socket-not-found-through-its-replacement"
args = ["-n", "-P", "-V", "{YGONELINK}"]

[[case]]
# Fixture X's socket is bound at a path that is not UTF-8; sock-link is an
# ASCII symlink to it. PID and fd only, because the NAME is a recorded display
# difference (U+FFFD for `\xff`); which socket is found is not. The fd tells
# it from X's other socket, bound at that NAME's spelling: `-t` could not,
# since the same process holds both.
name = "path-unix-socket-whose-path-is-not-utf8"
args = ["-F", "pf", "{XSOCKLINK}"]

[[case]]
# A `-e` on another file system changes nothing: the bound path is walked to
# the socket file through the symlink, and no name is looked up under /proc.
name = "path-unix-socket-through-a-symlink-under-another-dash-e"
args = ["-t", "-e", "/proc", "{YLINK}"]

[[case]]
# LEDGERED (C-DEFECT, DIVERGENCES 66). The C cuts a bound path at its first
# space when it reads /proc/net/unix, so it cannot find this socket by its
# real path, which lsof-rs does.
name = "path-unix-socket-with-a-space-found-in-lsof-rs"
args = ["-t", "{YSPACE}"]

[[case]]
# LEDGERED (C-DEFECT, DIVERGENCES 66). The other half: the C finds the socket
# through a regular file named as its cut path, which lsof-rs does not.
name = "path-unix-socket-cut-at-a-space-in-the-c"
args = ["-t", "{YCUT}"]

[[case]]
# A path is located as the C examines the file, before -a is applied: A holds
# {FILE} on fd 3, so `-d 0` prints nothing, and the run exits 0 with no -V
# line. lsof-rs had asked the rows it printed and exited 1.
name = "path-located-by-a-file-a-drops"
args = ["-n", "-P", "-V", "-a", "-p", "{A}", "-d", "0", "{FILE}"]

[[case]]
name = "path-unix-socket-located-by-a-socket-a-drops"
args = ["-n", "-P", "-V", "-a", "-p", "{Y}", "-d", "0", "{YSOCK}"]

[[case]]
# X's second socket is bound at `sock` + U+FFFD (valid UTF-8); its first, at
# `sock\xff`, is shown with U+FFFD as well. Only the second is that path.
name = "path-unix-socket-not-found-for-another-by-its-shown-name"
args = ["-n", "-P", "-F", "pfn", "{XSOCKREPL}"]

[[case]]
# LEDGERED (C-DEFECT, DIVERGENCES 66): the `:` form, found in lsof-rs only.
name = "path-unix-socket-with-a-colon-found-in-lsof-rs"
args = ["-t", "{YCOLON}"]

[[case]]
# LEDGERED (C-DEFECT, DIVERGENCES 66): `odd/c` is a socket, and the C finds
# `odd/c:lon.sock` through it too, by the cut path's identity.
name = "path-unix-socket-cut-at-a-colon-finds-another-in-the-c"
args = ["-n", "-P", "-F", "pfn", "{YCOLONCUT}"]

[[case]]
# The C strips a path argument's trailing slashes before it stats it, so
# `FILE/` is FILE (lsof-rs failed with `Not a directory`).
name = "path-trailing-slash-on-a-file"
args = ["-n", "-P", "-a", "-p", "{A}", "{FILE}/"]

[[case]]
name = "path-unix-socket-and-a-dash-U"
args = ["-n", "-P", "-V", "-a", "-p", "{Y}", "-U", "{YSOCK}"]

[[case]]
name = "path-unix-socket-terse"
args = ["-t", "{YSOCK}"]

[[case]]
name = "path-unix-socket-fields"
args = ["-n", "-P", "-F", "pfn", "{YSOCK}"]

[[case]]
# +d finds u.sock by identity and gone.sock by name; link.sock is a symlink,
# which +d skips; `ready` is open nowhere, so the run exits 1.
name = "path-plus-d-finds-the-sockets"
args = ["-n", "-P", "+d", "{YDIR}"]

# A file with the same path in another mount namespace is another file
# (DIVERGENCES 60). Fixture M's cwd and its open `f` are on a tmpfs mounted,
# in its own namespace, over a plain directory and file here. The C matches
# by device and inode only and finds neither; lsof-rs also compared names,
# printed M's rows, then reported both paths not located.

[[case]]
name = "path-another-mount-namespace-is-another-dir"
args = ["-n", "-P", "-V", "{MMNT}"]

[[case]]
name = "path-another-mount-namespace-is-another-file"
args = ["-n", "-P", "-V", "{MFILE}"]

[[case]]
name = "path-another-mount-namespace-and-a"
args = ["-n", "-P", "-V", "-a", "-p", "{M}", "{MMNT}"]

[[case]]
# The control: M's rows are there to be found, on the tmpfs.
name = "path-another-mount-namespace-process-rows"
args = ["-n", "-P", "-a", "-d", "cwd,3", "-p", "{M}"]

# What a process in another mount namespace has mapped (DIVERGENCES 95). The
# C `stat`s each mapping through `/proc/<pid>/map_files/`, not by its path,
# which here names another file or none. As root that reaches each file --
# the deleted `g` too, which is then `mem`, not `DEL`. As anyone else
# following those links is refused, and EVERY mapping, libraries included,
# is a row saying `(stat: Operation not permitted)`. lsof-rs `stat`ed the
# paths and dropped what did not match. Both answers are the C's; which one
# a run sees depends on who runs it.

[[case]]
name = "mapped-in-another-mount-namespace"
args = ["-n", "-P", "-a", "-d", "mem,DEL", "-p", "{M}"]

[[case]]
name = "mapped-in-another-mount-namespace-minus-w"
args = ["-n", "-P", "-w", "-a", "-d", "mem,DEL", "-p", "{M}"]

[[case]]
name = "mapped-in-another-mount-namespace-plus-L"
args = ["-n", "-P", "+L", "-a", "-d", "mem,DEL", "-p", "{M}"]

[[case]]
name = "mapped-in-another-mount-namespace-fields"
args = ["-n", "-P", "-FfatDsiklnr", "-a", "-d", "mem,DEL", "-p", "{M}"]

# A path argument finds a file by its `st_dev` and inode (DIVERGENCES 101):
# the C compares the argument's with each row's `Lf->dev` and `Lf->inode`,
# what `-F D` and `-F i` print (`dfile.c`), whatever the file's type. For a
# device node that is the node, on the file system holding it, and never the
# device it names, which the DEVICE cell shows. lsof-rs compared the DEVICE
# cell and inode, and so missed a row and found others.
#
# Missed: as anyone but root, the C cannot follow M's `map_files`, and its
# `/dev/zero` mapping is the maps line's `mem REG 0,6 4 /dev/zero (stat:
# Operation not permitted)`, which `lsof /dev/zero` finds by devtmpfs's 0,6
# and inode 4. lsof-rs looked for `1,5` and said `no file use located`. A
# root runner `stat`s the mapping (`CHR 1,5`), and both always found that;
# fixture MZ is the first shape on every runner, its cases run as the user
# it runs as.

[[case]]
name = "path-device-mapped-in-another-mount-namespace"
args = ["-n", "-P", "-V", "-a", "-p", "{M}", "/dev/zero"]

[[case]]
name = "path-device-mapped-in-another-mount-namespace-terse"
args = ["-t", "-a", "-p", "{M}", "/dev/zero"]

[[case]]
name = "path-device-mapped-in-another-mount-namespace-fields"
args = ["-n", "-P", "-FftDi", "-a", "-p", "{M}", "/dev/zero"]

[[case]]
name = "path-device-mapping-found-by-its-maps-line"
args = ["-n", "-P", "-V", "-a", "-p", "{MZ}", "/dev/zero"]
env = { LSOF_DIFF_UNPRIVILEGED = "1" }

[[case]]
# The C prints the pid and exits 0; lsof-rs printed nothing and exited 1.
name = "path-device-mapping-found-by-its-maps-line-terse"
args = ["-t", "-a", "-p", "{MZ}", "/dev/zero"]
env = { LSOF_DIFF_UNPRIVILEGED = "1" }

[[case]]
name = "path-device-mapping-found-by-its-maps-line-fields"
args = ["-n", "-P", "-FftDi", "-a", "-p", "{MZ}", "/dev/zero"]
env = { LSOF_DIFF_UNPRIVILEGED = "1" }

[[case]]
# A `+d` entry is its `lstat`'s device and inode too (`arg.c`): `+d /dev`
# lists the mapping beside MZ's `/dev/null` fds. Exit 1 in both, for the
# entries nothing holds.
name = "path-device-mapping-found-by-plus-d"
args = ["-n", "-P", "-a", "-p", "{MZ}", "+d", "/dev"]
env = { LSOF_DIFF_UNPRIVILEGED = "1" }

# Found where the C finds nothing: PTG holds the pty of PTH's index N in a
# devpts instance of its own, whose row reads like PTH's, `CHR 136,N ...
# N+3` (devpts numbers a pty's inode N+3 in every instance), on another file
# system: `D` differs. `lsof /dev/pts/N` is PTH's row in the C; lsof-rs also
# listed PTG's, and with PTG alone listed it where the C says `no file use
# located`. A container's own `/dev/null` was the same.

[[case]]
name = "path-pty-of-another-devpts-is-another-file"
args = ["-n", "-P", "-V", "-a", "-p", "{PTH},{PTG}", "{PTS}"]

[[case]]
name = "path-pty-of-another-devpts-alone-is-not-located"
args = ["-n", "-P", "-V", "-a", "-p", "{PTG}", "{PTS}"]

[[case]]
name = "path-pty-of-another-devpts-fields"
args = ["-n", "-P", "-FpftDi", "-a", "-p", "{PTH},{PTG}", "{PTS}"]

# Both ways between a file and a node naming its file system: DN's `t/y` is
# inode 3 on tmpfs `t`, and `u/node` (held `O_PATH`) is `c` of `t`'s device,
# inode 3 on `u`. Each argument finds its own file only; lsof-rs found both
# with either. A block device beside the file system it backs is this shape
# (measured with a loop device, which no fixture binds).

[[case]]
name = "path-file-is-not-a-node-naming-its-file-system"
args = ["-n", "-P", "-V", "-a", "-p", "{DN}", "{DNFILE}"]

[[case]]
name = "path-node-is-not-a-file-on-the-file-system-it-names"
args = ["-n", "-P", "-V", "-a", "-p", "{DN}", "{DNNODE}"]

[[case]]
# The node alone, in fields: `D` its own file system, `r` the one it names.
name = "path-node-fields-are-its-own-file-system"
args = ["-n", "-P", "-FftDir", "-a", "-p", "{DN}", "{DNNODE}"]

[[case]]
# LEDGERED (DIVERGENCES 125, OPEN). `t` is a mount point, so a file-system
# argument, and `t/y` is the only file DN has on it. The C's
# `is_file_named()` marks one search item per row, the file argument first,
# so `t` is reported `no file system use located` and the run exits 1, in
# either order. lsof-rs marks both and exits 0.
name = "path-file-and-its-file-system-one-item-per-row-in-the-c"
args = ["-n", "-P", "-V", "-a", "-p", "{DN}", "{DNT}", "{DNFILE}"]

# A socket is found by no path through its own device and inode, nor by its
# file system: the C hands every socket to `process_proc_sock()`, which
# compares only an AF_UNIX socket's bound path (DIVERGENCES 101). Rows no
# table describes keep a device and an inode for `-F D` and `-F i`, and
# lsof-rs found them by those. SF's fd 3 is a TCP socket bound and never
# listening, fd 4 a unix socket bound at {SFSOCK}, fd 5 an `O_PATH`
# descriptor on that socket file; J's fd 3, a listener in a network
# namespace of its own. Their own rows differ in TYPE and NAME (items 22,
# 126), so no case prints them, and none passes `-V`, which would report
# fds 0 and 1, the same `/dev/null`, as item 17 does.

[[case]]
# `-x l` makes the `+d` walk follow `/proc/SF/fd/3` to the socket. The C
# prints nothing and exits 1; lsof-rs printed `f3 tSOCK D0x9 i<N>`.
name = "sock-no-table-names-is-no-plus-d-entry"
args = ["-n", "-P", "-FftDi", "-a", "-p", "{SF}", "-d", "3", "-x", "l", "+d", "/proc/{SF}/fd"]

[[case]]
name = "sock-no-table-names-is-no-plus-d-entry-terse"
args = ["-t", "-a", "-p", "{SF}", "-d", "3", "-x", "l", "+d", "/proc/{SF}/fd"]

[[case]]
# The `sock … protocol: TCP` row of another network namespace, the same.
name = "netns-socket-is-no-plus-d-entry"
args = ["-n", "-P", "-FftDi", "-a", "-p", "{J}", "-d", "3", "-x", "l", "+d", "/proc/{J}/fd"]

[[case]]
# The listener, by its bound path; not fd 5, the socket file's own device
# and inode.
name = "sock-file-held-by-path-is-not-found-by-it"
args = ["-n", "-P", "-Fft", "-a", "-p", "{SF}", "{SFSOCK}"]

[[case]]
# Nothing printed; exit 0 in both, the file system located by SF's cwd.
name = "sock-file-held-by-path-is-not-on-its-file-system"
args = ["-n", "-P", "-Fft", "-a", "-p", "{SF}", "-d", "5", "{SFFS}"]

[[case]]
# `/proc/SF/fd/5` leads to the socket file: the listener is found by it,
# fd 5 is not. Exit 1 in both, for the entries nothing names.
name = "sock-file-held-by-path-is-no-plus-d-entry"
args = ["-n", "-P", "-Fft", "-a", "-p", "{SF}", "-d", "4,5", "-x", "l", "+d", "/proc/{SF}/fd"]

[[case]]
# LEDGERED (DIVERGENCES 126, OPEN). The row itself: the C's
# `process_proc_sock()` names no protocol for a socket file reached by its
# path, `tsock`, `o0t0`, `ncan't identify protocol`; lsof-rs types it by
# its `stat`, `tSOCK`, `s0`, and its path for NAME.
name = "sock-file-held-by-path-row-in-the-c"
args = ["-n", "-P", "-FftDsoin", "-a", "-p", "{SF}", "-d", "5"]

# A file-system argument finds a socket bound at exactly the path typed
# (DIVERGENCES 60, from the review). Fixture MS binds one at `/dev/shm`, free
# in its own mount namespace, where a tmpfs covers `/dev`; here that path is a
# mount point. The bound path is no socket file here, so the C compares it
# with every argument as typed, a mount point's included. lsof-rs printed the
# socket, then said `no file system use located` and exited 1.

[[case]]
name = "path-fs-arg-finds-a-socket-bound-at-its-path"
args = ["-n", "-P", "-V", "-a", "-p", "{MS}", "{MSMNT}"]

[[case]]
# `+f` insists the argument is a file system: the same.
name = "path-fs-arg-plus-f-finds-a-socket-bound-at-its-path"
args = ["-n", "-P", "-V", "-a", "-p", "{MS}", "+f", "--", "{MSMNT}"]

[[case]]
# `-f` makes it a plain directory, whose identity is not the socket's: the
# name finds the socket all the same.
name = "path-dash-f-finds-a-socket-bound-at-its-path"
args = ["-n", "-P", "-V", "-a", "-p", "{MS}", "-f", "--", "{MSMNT}"]

[[case]]
# Through a symlink to the mount point, the argument as typed is the link's
# path, which is not the bound path: no socket, and `-V` names the link.
name = "path-fs-arg-through-a-symlink-is-not-the-bound-path"
args = ["-n", "-P", "-V", "-a", "-p", "{MS}", "{MSLINK}"]

[[case]]
# `-e` takes a plain prefix (`isefsys()`): `-e /dev/shm` exempts MS's
# `/dev/shmx/f` (fd 4) and its mapping of `/dev/shmx/m`, which are not under
# it. lsof-rs required a path-component boundary, never measured.
name = "exempt-is-a-plain-prefix"
args = ["-n", "-P", "-e", "{MSMNT}", "-a", "-d", "4,mem", "-p", "{MS}"]

# ----------------------------------------------- -e and mapped files (EM)
# `-e` exempts mappings too (DIVERGENCES 40). Fixture EM maps a file on
# /dev/shm, maps another it then unlinks, and holds a third open. The C does
# not `stat` an exempted mapping: `UNKNmem` (`UNKNdel` for the unlinked one),
# DEVICE and NODE from the maps line, NAME with `(-e /dev/shm)`. lsof-rs
# `stat`ed them and printed `REG`.

[[case]]
name = "exempt-mappings-are-unkn"
args = ["-n", "-P", "-e", "{EMFS}", "-a", "-p", "{EM}"]

[[case]]
# `-F D` is the maps line's device; no size, no link count, no lock.
name = "exempt-mappings-fields"
args = ["-n", "-P", "-e", "{EMFS}", "-FfatDsiklnr", "-a", "-p", "{EM}"]

[[case]]
# `enter_efsys()` drops a trailing slash: NAME says `(-e /dev/shm)`.
name = "exempt-path-loses-its-trailing-slash"
args = ["-n", "-P", "-e", "{EMFSSLASH}", "-a", "-d", "mem,DEL,3", "-p", "{EM}"]

[[case]]
# An exempted row was never `stat`ed, and the C never asks whether a path
# argument names it: the live mapping, held nowhere else, is not found, and
# the run exits 1. lsof-rs found it by its maps device and inode.
name = "exempt-mapping-is-never-located"
args = ["-n", "-P", "-e", "{EMFS}", "{EMLIVE}"]

[[case]]
name = "exempt-mapping-is-never-located-V"
args = ["-n", "-P", "-V", "-e", "{EMFS}", "-a", "-p", "{EM}", "{EMLIVE}"]

[[case]]
# ORed with `-p`, EM's rows print, and the path is still not located.
name = "exempt-mapping-or-p"
args = ["-n", "-P", "-e", "{EMFS}", "-p", "{EM}", "{EMLIVE}"]

[[case]]
# Nor does a file-system argument find an exempted row.
name = "exempt-rows-are-on-no-file-system"
args = ["-n", "-P", "-e", "{EMFS}", "-a", "-p", "{EM}", "{EMFS}"]

[[case]]
# The control: without `-e`, the mapping is found by its path.
name = "exempt-mapping-control-without-e"
args = ["-n", "-P", "-a", "-p", "{EM}", "{EMLIVE}"]

[[case]]
# Two `-e` paths that both cover a file: the C puts each new one at the head
# of its list, so NAME names the one given last. lsof-rs named the first.
name = "exempt-the-last-given-names-the-row"
args = ["-n", "-P", "-e", "/", "-e", "{EMFS}", "-a", "-d", "mem,DEL,3", "-p", "{EM}"]

[[case]]
# ...and a repeated path keeps its first place: `/dev/shm` given again after
# `/` is dropped, and `/` names the rows.
name = "exempt-a-repeat-keeps-its-first-place"
args = ["-n", "-P", "-e", "{EMFS}", "-e", "/", "-e", "{EMFS}", "-a", "-d", "mem,DEL,3", "-p", "{EM}"]

[[case]]
# An `-e` that is not a file system path is an error, an empty one too:
# lsof-rs had taken `-e ""` as a prefix of every path, and exempted them all.
name = "exempt-an-empty-path-is-an-error"
args = ["-n", "-P", "-e", "", "-a", "-d", "cwd", "-p", "{A}"]

# ------------------------------------------ paths that name another file (P)
# Fixture P maps three files whose paths the harness then covers, as root: a
# tmpfs over the directory of one, another tmpfs (with a file of the same
# name) over the directory of the next, and another file bound over the
# third. The C keeps each row, with the maps line's device and inode, and
# says why it could not describe more -- `(stat: No such file or directory)`,
# `(path dev=0,N, inode=M)`, `(path inode=N)` -- unless `-w`. lsof-rs
# dropped them (DIVERGENCES 95).

[[case]]
name = "path-notes"
args = ["-n", "-P", "-a", "-d", "mem", "-p", "{P}"]

[[case]]
name = "path-notes-minus-w"
args = ["-n", "-P", "-w", "-a", "-d", "mem", "-p", "{P}"]

[[case]]
name = "path-notes-plus-L"
args = ["-n", "-P", "+L", "-a", "-d", "mem", "-p", "{P}"]

[[case]]
name = "path-notes-fields"
args = ["-n", "-P", "-FfatDsikln", "-a", "-d", "mem", "-p", "{P}"]

# ------------------------------------------------- path spellings, as the C's
# A path argument, a `+d`/`+D` directory and a mount's source are spelt by the
# C's `Readlink()` (lib/misc.c), which replaces a path's symbolic links and
# nothing else: a relative path stays relative, `.`, `..` and doubled slashes
# stay, and a link is read as the text it holds. lsof-rs had used
# `canonicalize()` (DIVERGENCES 63, 65). Fixture R (`spell/`, see
# linux_diff.py) holds a file and the directory itself on /dev/shm, a pipe, an
# eventfd, an unlinked file and a socket on fixed fds, and directories of
# links and of names that are not UTF-8. `-F pf`: a row found through an
# argument is NAMEd for the argument in the C (DIVERGENCES 17); which rows are
# found is the question here. Each `+d`/`+D` case leaves one entry unlocated,
# so the order of `-V`'s lines (DIVERGENCES 52) is not.

[[case]]
# The control: the mount point as the mount table spells it is the file
# system, so R's file on it (fd 15) is found with the directory (fd 14).
name = "path-mount-point-as-the-mount-table-spells-it"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "{SHMMNT}"]

[[case]]
# `shm` from `/dev` is no mount point to the C, which compares the spelling:
# the directory alone. lsof-rs had resolved it to `/dev/shm` and listed every
# file on the file system.
name = "path-mount-point-relative-is-a-directory"
cwd = "{SHMDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "{SHMBASE}"]

[[case]]
name = "path-mount-point-dot-relative-is-a-directory"
cwd = "{SHMDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "./{SHMBASE}"]

[[case]]
# `lsof .` from inside the mount point.
name = "path-mount-point-dot-from-inside-is-a-directory"
cwd = "{SHMMNT}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "."]

[[case]]
name = "path-mount-point-with-a-trailing-dot-is-a-directory"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "{SHMMNT}/."]

[[case]]
name = "path-mount-point-with-a-doubled-slash-is-a-directory"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "{SHMDIR}//{SHMBASE}"]

[[case]]
# A relative link to it, through `..`: `spell/../../../dev/shm`.
name = "path-mount-point-through-a-relative-link-is-a-directory"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "{SHMREL}"]

[[case]]
# `+f` insists on a file system and the relative spelling names none: `not a
# file system: shm`, the argument dropped, and with none left the run ends.
name = "path-mount-point-relative-under-plus-f-is-none"
cwd = "{SHMDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+f", "--", "{SHMBASE}"]

[[case]]
name = "path-mount-point-trailing-dot-under-plus-f-is-none"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+f", "--", "{SHMMNT}/."]

[[case]]
# A `/proc/PID/fd/N` link is the text it holds. For a file that text is its
# path, so the control finds fd 10.
name = "path-proc-fd-of-a-file-is-the-file"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "/proc/{R}/fd/10"]

[[case]]
name = "path-proc-cwd-is-the-directory"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "/proc/{R}/cwd"]

[[case]]
# For a pipe it is `pipe:[N]`, which `Readlink()` appends to `/proc/R/fd`:
# `status error on /proc/R/fd/pipe:[N]`, nothing to search for, exit 1.
# lsof-rs had followed the link and found both ends of the pipe.
name = "path-proc-fd-of-a-pipe-is-its-links-text"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "/proc/{R}/fd/16"]

[[case]]
# lsof-rs had found the eventfd, and on a host every `anon_inode` fd.
name = "path-proc-fd-of-an-eventfd-is-its-links-text"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "/proc/{R}/fd/18"]

[[case]]
# `<spell>/gone (deleted)` names nothing.
name = "path-proc-fd-of-a-deleted-file-is-its-links-text"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "/proc/{R}/fd/19"]

[[case]]
# lsof-rs had found nothing either, and reported it not located.
name = "path-proc-fd-of-a-socket-is-its-links-text"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "/proc/{R}/fd/20"]

[[case]]
# A `+d` entry whose name is not UTF-8 is found by its own bytes, and `-V`
# names the one left (`nu/\xfe`). lsof-rs had made both names lossy, found
# neither, and reported two U+FFFD lines.
name = "path-plus-d-entries-that-are-not-utf8"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+d", "{RDIR}/nu"]

[[case]]
name = "path-plus-D-entries-that-are-not-utf8"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+D", "nu"]

[[case]]
# `+d`/`+D` name their entries from the directory's `Readlink()`: `rel/y`,
# where lsof-rs reported `rel-link/y`.
name = "path-plus-d-through-a-relative-link"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+d", "rel-link"]

[[case]]
name = "path-plus-d-through-an-absolute-link"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+d", "{RDIR}/abs-link"]

[[case]]
# `deep/a/b/../../../rel/y`, `..` and all.
name = "path-plus-d-through-a-link-with-dotdot"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+d", "deep/a/b/up"]

[[case]]
# `+D` had resolved its directory to an absolute path: `$PWD/rel/y`.
name = "path-plus-D-relative-stays-relative"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+D", "rel"]

[[case]]
name = "path-plus-D-doubled-slash-is-kept"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+D", "rel//"]

[[case]]
name = "path-plus-D-dot-slash-is-kept"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+D", "./rel"]

[[case]]
name = "path-plus-D-dot"
cwd = "{RDIR}/rel"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+D", "."]

[[case]]
name = "path-plus-D-through-a-relative-link"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+D", "rel-link"]

[[case]]
# An argument the C drops is no search item (DIVERGENCES 62): `status error`
# on stderr, the rest listed, no `-V` line for it, exit 1.
name = "path-unstatable-is-no-search-item"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "{RDIR}/nosuch", "rel/x"]

[[case]]
name = "path-dangling-link-is-no-search-item"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "dangle", "rel/x"]

[[case]]
# `Readlink()` gives up on a loop: `too many (> 20) symbolic links`.
name = "path-link-loop-is-no-search-item"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "loop1", "rel/x"]

[[case]]
name = "path-link-loop-under-dash-Q"
cwd = "{RDIR}"
args = ["-F", "pf", "-Q", "-a", "-p", "{R}", "loop1", "rel/x"]

# The messages themselves, with stderr compared (`with_stderr`): the status
# error names the path `Readlink()` made, and `+f` names the argument as
# typed. `-w` mutes the C's warnings about the host -- a mount it cannot
# `stat` as a user who is not root -- and neither of these.

[[case]]
name = "path-stderr-status-error-names-the-path"
cwd = "{RDIR}"
args = ["-w", "-F", "pf", "-a", "-p", "{R}", "{RDIR}/nosuch", "rel/x"]
with_stderr = true

[[case]]
# `status error on <spell>/nosuch/f`, the link's target.
name = "path-stderr-status-error-names-a-links-target"
cwd = "{RDIR}"
args = ["-w", "-F", "pf", "-a", "-p", "{R}", "dangle", "rel/x"]
with_stderr = true

[[case]]
# `status error on /proc/R/fd/pipe:[N]`.
name = "path-stderr-status-error-names-a-pipes-link-text"
args = ["-w", "-F", "pf", "-a", "-p", "{R}", "/proc/{R}/fd/16", "{RDIR}/rel/x"]
with_stderr = true

[[case]]
# `status error on <spell>/gone (deleted)`.
name = "path-stderr-status-error-names-a-deleted-files-link-text"
args = ["-w", "-F", "pf", "-a", "-p", "{R}", "/proc/{R}/fd/19", "{RDIR}/rel/x"]
with_stderr = true

[[case]]
name = "path-stderr-not-a-file-system-names-the-argument-as-typed"
cwd = "{RDIR}"
args = ["-w", "-F", "pf", "-a", "-p", "{R}", "+f", "--", "{SHMMNT}", "rel"]
with_stderr = true

[[case]]
name = "path-stderr-not-a-file-system-for-a-relative-mount-point"
cwd = "{SHMDIR}"
args = ["-w", "-F", "pf", "-a", "-p", "{R}", "+f", "--", "{SHMBASE}"]
with_stderr = true

[[case]]
# A `+d`/`+D` the C cannot use ends the run as it parses: usage, exit 1,
# nothing listed (DIVERGENCES 74). lsof-rs had warned and listed the rest.
name = "path-plus-d-unstatable-ends-the-run"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+d", "dangle", "rel/x"]

[[case]]
name = "path-plus-d-not-a-directory-ends-the-run"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+d", "rel/x"]

[[case]]
name = "path-plus-D-link-loop-ends-the-run"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+D", "loop1", "rel/x"]

[[case]]
name = "path-plus-d-ends-the-run-under-dash-Q"
cwd = "{RDIR}"
args = ["-F", "pf", "-Q", "-a", "-p", "{R}", "+d", "dangle", "rel/x"]

[[case]]
# Before `-h` is acted on: lsof-rs had printed the help and exited 0.
name = "path-plus-d-ends-the-run-before-dash-h"
cwd = "{RDIR}"
args = ["+d", "dangle", "-h"]

[[case]]
name = "path-plus-d-with-an-empty-value-ends-the-run"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+d", ""]

[[case]]
# The C takes `-x` as `+d`'s value, and refuses it.
name = "path-plus-d-followed-by-an-option-ends-the-run"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+d", "-x", "rel"]

[[case]]
# The C expands `+d` as it parses, so a `-x` after it does not reach it: the
# link in `xd` is skipped, and only the directory is found (DIVERGENCES 75).
name = "path-plus-d-dash-x-after-it-does-not-reach-it"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+d", "xd", "-x"]

[[case]]
name = "path-plus-d-dash-x-before-it-does"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "-x", "+d", "xd"]

[[case]]
# The file-system half: `/dev/shm` is an entry of `/dev` on a file system of
# its own, so `+d /dev` skips it unless `-x f` came first -- R's fd 14, the
# directory itself, is found only then. No `-V`: most of `/dev` is unlocated,
# and the order of those lines is DIVERGENCES 52.
name = "path-plus-d-dash-x-f-after-it-does-not-reach-it"
args = ["-F", "pf", "-a", "-p", "{R}", "+d", "{SHMDIR}", "-x", "f"]

[[case]]
name = "path-plus-d-dash-x-f-before-it-does"
args = ["-F", "pf", "-a", "-p", "{R}", "-x", "f", "+d", "{SHMDIR}"]

[[case]]
# Under `+f`, an argument that is no file system is dropped like a status
# error: the rest is listed, and the run exits 1 (DIVERGENCES 76). lsof-rs had
# listed nothing.
name = "path-plus-f-drops-what-is-no-file-system"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+f", "--", "{SHMMNT}", "rel"]

[[case]]
# ...and under `-Q` quietly, exit 0: lsof-rs had exited 1.
name = "path-plus-f-drops-it-quietly-under-dash-Q"
cwd = "{RDIR}"
args = ["-F", "pf", "-Q", "-a", "-p", "{R}", "+f", "--", "rel"]

[[case]]
# A mount's source that is a name (`tmpfs`) is no path, and `readmnt()` never
# reads it as one; the argument is a path, and `Readlink()` turns it, here,
# into `elsewhere`. So the two differ, and `+f` finds no file system.
name = "path-plus-f-a-source-that-is-a-name-is-not-read-as-a-path"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+f", "--", "{SHMSRC}"]

[[case]]
# `Readlink()` drops the loop before `+f` asks whether it is a file system.
name = "path-plus-f-a-link-loop-is-dropped-first"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+f", "--", "loop1", "{SHMMNT}"]

[[case]]
# With every bare argument dropped the run ends, though a `+d` was entered
# (DIVERGENCES 77): lsof-rs had listed the `+d` files.
name = "path-every-bare-argument-dropped-ends-the-run"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "+d", "rel", "{RDIR}/nosuch"]

[[case]]
# Under `-x l` the C follows a link and stacks a directory by the `stat` that
# followed it, so `+D` descends through `xl/lnk` into `rel`: fd 10 is found as
# `xl/lnk/x`, and `xl/lnk/y` is reported (DIVERGENCES 78).
name = "path-plus-D-descends-through-a-link-under-dash-x-l"
cwd = "{RDIR}"
args = ["-F", "pf", "-V", "-a", "-p", "{R}", "-x", "l", "+D", "xl"]

# ----------------------------------------------------------- anonymous inodes
[[case]]
# Fds with no filesystem identity: the kernel names them `anon_inode:<kind>`
# and lsof types them `a_inode`, drops the prefix and prints the kind. Three
# kinds carry an identity in fdinfo that the C substitutes in — an eventpoll's
# watched fds (sorted, and fdinfo lists them most-recent-first), an eventfd's
# `eventfd-id` (not its count, and not the fd number), and a pidfd's target
# pid. `inotify` is the control: no identity, so it prints bare.
name = "anon-inode-kinds"
args = ["-n", "-P", "-a", "-d", "^mem", "-p", "{G}"]

# ------------------------------------------------------------------- locks
[[case]]
# The lock character lsof appends to the FD cell: `3uW` for a whole-file write
# lock, `4uw` for a partial one, and `R`/`r` for the read equivalents. Fixture
# F holds one of each, which is every character /proc/locks can produce (it
# reports only shared-vs-exclusive and the byte range). And the locks the C
# shows where lsof-rs showed none: `cwd-R` and `txt-R`, on its cwd and
# executable; `W` on every /dev/null fd, its stdio included, for the flock on
# /dev/null's devtmpfs inode, which lsof-rs looked up by the device the node
# names; and `r` on the file with three ranges, the latest kind new to it.
name = "locks-fd-suffix"
args = ["-n", "-P", "-a", "-d", "^mem", "-p", "{F}"]

[[case]]
# The same locks in `-F l`.
name = "locks-fields-l"
args = ["-n", "-P", "-Ffatl", "-a", "-d", "^mem", "-p", "{F}"]

# ---------------------------------------------------------- hostile COMMANDs
# A process names itself, and until DIVERGENCES.md #10 was closed lsof-rs
# printed the name raw — a comm holding ESC [2J cleared the screen of whoever
# ran it. The C escapes COMMAND with safestrprtn(…, 2): control characters,
# DEL and the backslash in visible form, the space as \x20 (so the column
# still splits on whitespace) and every non-ASCII byte as \xNN.

[[case]]
# +c 0 lifts the C's default 9-column COMMAND cap (DIVERGENCES.md #3), so the
# whole escaped comm is compared: `h^[[2J\r\x20\\\x7f\t^Az`.
name = "hostile-comm-table"
args = ["-n", "-P", "+c", "0", "-a", "-d", "^mem", "-p", "{C}"]

[[case]]
# -F c goes through safestrprt(…, 0): same escapes, the space kept.
name = "hostile-comm-fields-Ffc"
args = ["-n", "-P", "-a", "-Ffc", "-d", "^mem", "-p", "{C}"]

[[case]]
# LEDGERED — the C's defect, not the port's, and deliberately not reproduced
# (porting-kit CLAUDE.md: the C is a specification that may be buggy).
# safestrlen() sizes the column by comparing each `char` with 0x20; `char` is
# signed on x86-64, so every byte >= 0x80 is counted as a 2-column escape when
# safestrprtn() will print 4 (`\xc3`), and the printer then cuts the command
# to the undersized width — here `\xc2\x9bz` is silently dropped even with
# +c 0. lsof-rs sizes and prints the same text. `-Ffc` on the same comm below
# MATCHes: the width bug is the table's alone.
name = "hostile-comm-utf8-table"
args = ["-n", "-P", "+c", "0", "-a", "-d", "^mem", "-p", "{D}"]

[[case]]
# é passes through (printable, UTF-8 locale); U+009B, which iswprint()
# rejects, is `\xc2\x9b`.
name = "hostile-comm-utf8-fields-Ffc"
args = ["-n", "-P", "-a", "-Ffc", "-d", "^mem", "-p", "{D}"]

# ------------------------------------------------------------- tasks (-K, I)
# THREAD LISTING. lsof models a Linux task as a process of its own: `-K` adds
# one entry per thread that repeats the WHOLE file set, because `CLONE_FS` and
# `CLONE_FILES` are optional and a thread can hold its own cwd, root and fd
# table. The entry carries the thread's tid and its own `comm`, which the table
# shows in two extra columns (TID, TASKCMD) and `-F` in the `K` and `M` fields.
# Fixture I is the only fixture with a second thread, which is why deleting the
# feature left the rest of the suite green (LESSONS: a gate that cannot fail).
# Its thread names are lopsided on purpose -- `taskname-long-1` (15 bytes, the
# kernel's `comm` ceiling) and `t2` -- because TASKCMD has its OWN column width
# in `print.c` and a port that reused COMMAND's would cut a thread name against
# `python3`. Two 7-character names, the first draft, hid that exactly.
#
# The columns are the gate as much as the rows are: the runner collapses runs
# of spaces, so a process row reads `python3 PID root cwd ...` and a task row
# `python3 PID TID worker1 root cwd ...` -- two extra fields that no normalizer
# can hide.

[[case]]
# Three entries (the process and its two threads), each repeating all seven
# non-mem rows. TASKCMD is `worker1`/`worker2` from prctl(PR_SET_NAME) and
# differs from COMMAND, so a column that echoed the command would still fail.
name = "tasks-dash-K"
args = ["-n", "-P", "-K", "-a", "-d", "^mem", "-p", "{I}"]

[[case]]
# mem rows repeat per task too -- the task is a whole process entry, not a
# TID appended to the process's rows.
name = "tasks-dash-K-repeats-mem-rows"
args = ["-n", "-P", "-K", "-a", "-p", "{I}"]

[[case]]
# TASKCMD is sized and cut by its own width, not COMMAND's: `TaskCmdColW`
# starts at `strlen("TASKCMD")` and grows over the task names, each capped by
# `+c` (`TaskCmdLim`, which `+c` sets alongside `CmdLim`). Here that is 9 by
# default against COMMAND's 7, so `taskname-long-1` prints nine characters.
name = "tasks-taskcmd-has-its-own-column-width"
args = ["-n", "-P", "-K", "-a", "-d", "cwd", "-p", "{I}"]

[[case]]
# `+c 0` lifts the cap on both columns, so the whole 15-character name prints.
name = "tasks-taskcmd-width-plus-c-zero"
args = ["-n", "-P", "-K", "+c", "0", "-a", "-d", "cwd", "-p", "{I}"]

[[case]]
# A `+c` between the two: TASKCMD takes 12 while COMMAND stays at its header.
name = "tasks-taskcmd-width-plus-c-twelve"
args = ["-n", "-P", "-K", "+c", "12", "-a", "-d", "cwd", "-p", "{I}"]

[[case]]
# `+c` BELOW the header, the TASKCMD twin of `command-width-plus-c-below-header`
# and the only case that can see the column's seed: `+c` caps each name's
# CONTRIBUTION, and the width still starts at `strlen("TASKCMD")`, so `+c 3`
# prints seven characters of the long name rather than three. Seeding the width
# from 0 instead is invisible to every other case here, because the longest
# name exceeds seven whatever the cap.
name = "tasks-taskcmd-width-plus-c-below-header"
args = ["-n", "-P", "-K", "+c", "3", "-a", "-d", "cwd", "-p", "{I}"]

[[case]]
# THE DEFAULT. `-K` is not needed to see tasks -- the C lists them whenever
# NOTHING selects (main.c leaves Selflags == SelAll). Give it any selector and
# they go away, columns included. This is the case that pins the suppression:
# same fixture, same fds, no TID/TASKCMD and one entry instead of three.
name = "tasks-suppressed-by-a-selector"
args = ["-n", "-P", "-a", "-d", "^mem", "-p", "{I}"]

[[case]]
# `-K i` turns listing off explicitly. Same output as the case above, reached
# the other way -- so a `-K` that ignored its argument would fail here.
name = "tasks-dash-K-i-separated"
args = ["-n", "-P", "-K", "i", "-a", "-d", "^mem", "-p", "{I}"]

[[case]]
# The attached spelling of the same thing. The C's getopt entry for K takes an
# optional argument, so both forms are legal and mean one flag, not two.
name = "tasks-dash-K-i-attached"
args = ["-n", "-P", "-Ki", "-a", "-d", "^mem", "-p", "{I}"]

[[case]]
# `i` is the ONLY argument `-K` accepts. Anything else is a usage error: exit
# 1, nothing on stdout (the message and the usage banner go to stderr, which
# the runner does not compare -- the exit code is the contract).
name = "tasks-dash-K-rejects-other-arguments"
args = ["-n", "-P", "-K", "x", "-a", "-p", "{I}"]

[[case]]
# `strcasecmp`, not `strcmp`: the C accepts `-K I` as `-K i`. lsof-rs compared
# the byte exactly and rejected it.
name = "tasks-dash-K-i-is-case-insensitive"
args = ["-n", "-P", "-K", "I", "-a", "-d", "^mem", "-p", "{I}"]

[[case]]
# `-K` takes the next word WHATEVER it is unless that word opens an option
# (main.c pushes back only on a leading `-` or `+`), so a path after `-K` is a
# usage error, not a name to look up. Consuming only a literal `i` turned
# `lsof -K /some/file` into a whole-host task listing where the C exits 1 —
# which the `-K x` case above could not see, because `x` matches nothing and
# the accidental exit 1 looked like the right answer.
name = "tasks-dash-K-consumes-a-path-argument"
args = ["-n", "-P", "-K", "{FILE}"]

[[case]]
# The field form: `K` is the tid and `M` the task's command, both emitted
# right after `p` in the process set, and both absent from the process's own
# entry. `f` keeps the file set small enough to read.
name = "tasks-dash-K-fields"
args = ["-n", "-P", "-K", "-a", "-d", "^mem", "-FpKMcf", "-p", "{I}"]

# ---------------------------------------- tasks under -a, and -K's search item
# DIVERGENCES 33. Under `-a` the C enters a process as a task only when it has
# a task of its own (`dproc.c`: `Fand && ht && pidts`); otherwise the process
# fails the AND. So `-K -a -p` lists a multi-threaded process (fixture I) with
# its tasks, and a single-threaded one (fixture A, a `sleep`) not at all.
# `-K` is also a search item: if no row of a task is kept, printed or not, the
# run exits 1 and `-V` says `no tasks located`. lsof-rs had dropped the task
# kind from `-a` and had no such item, so it listed A and exited 0.

[[case]]
name = "tasks-dash-K-and-a-single-threaded-lists-nothing"
args = ["-n", "-P", "-K", "-a", "-p", "{A}"]

[[case]]
# The item's line, after any PID line, on stdout.
name = "tasks-dash-K-and-a-V-says-no-tasks-located"
args = ["-n", "-P", "-V", "-K", "-a", "-p", "{A}"]

[[case]]
# Under `-a` the C compares `-c` only once the task test has passed, so a
# process that is not a task leaves its command unlocated too.
name = "tasks-dash-K-and-a-does-not-compare-the-command"
args = ["-n", "-P", "-V", "-K", "-a", "-c", "sle", "-p", "{A}"]

[[case]]
# Both processes asked for; only the one with tasks is listed.
name = "tasks-dash-K-and-a-lists-only-the-multi-threaded"
args = ["-n", "-P", "-K", "-a", "-d", "cwd", "-p", "{A},{I}"]

[[case]]
# Located means KEPT, printed or not: I's rows are kept, then `-d 999` drops
# them all at the AND, and the run still exits 0.
name = "tasks-dash-K-located-by-a-row-printed-or-not"
args = ["-n", "-P", "-V", "-K", "-a", "-d", "999", "-p", "{I}"]

[[case]]
# ...where A, which has no task to keep, exits 1.
name = "tasks-dash-K-not-located-without-a-task"
args = ["-n", "-P", "-V", "-K", "-a", "-d", "999", "-p", "{A}"]

[[case]]
# `-t` reads the tasks' rows under `-K`: lsof-rs's fast path built no task
# entries and printed both PIDs.
name = "tasks-dash-K-terse-lists-only-the-multi-threaded"
args = ["-K", "-t", "-a", "-p", "{A},{I}"]

[[case]]
name = "tasks-dash-K-terse-single-threaded-exits-1"
args = ["-K", "-t", "-a", "-p", "{A}"]

[[case]]
# The last of `-K` and `-K i` decides, the item with it.
name = "tasks-dash-K-i-then-K-is-K"
args = ["-n", "-P", "-K", "i", "-K", "-a", "-p", "{A}"]

[[case]]
name = "tasks-dash-K-then-K-i-is-not-a-search-item"
args = ["-n", "-P", "-K", "-K", "i", "-a", "-d", "cwd", "-p", "{A}"]

# Under -a a network selecter (-i, -U) makes the C build a process's socket
# rows and nothing else -- `Ckscko` in dproc.c, set when `Fand ||
# !(Selflags & ~SELNW)` -- and the rows that say what could not be read,
# which it builds before asking. So only those can locate -K. Fixture I holds
# no socket; S and U each run an idle second thread. lsof-rs had built every
# row, so a socketless task was located and `-U` exited 0 (DIVERGENCES 33).

[[case]]
name = "tasks-dash-K-and-a-U-socketless-task-not-located"
args = ["-n", "-P", "-V", "-K", "-a", "-p", "{I}", "-U"]

[[case]]
name = "tasks-dash-K-and-a-i-socketless-task-not-located"
args = ["-n", "-P", "-V", "-K", "-a", "-p", "{I}", "-i"]

[[case]]
name = "tasks-dash-K-and-a-U-terse-socketless-task-exits-1"
args = ["-t", "-K", "-a", "-p", "{I}", "-U"]

[[case]]
name = "tasks-dash-K-and-a-U-lists-the-task-sockets"
args = ["-n", "-P", "-V", "-K", "-a", "-p", "{S}", "-U"]

[[case]]
# Port 1 names no socket of S, so nothing prints -- but S's sockets are still
# built, and a socket of a task locates -K printed or not: only `Internet
# address not located` stays.
name = "tasks-dash-K-and-a-unprinted-socket-locates-the-task"
args = ["-n", "-P", "-V", "-K", "-a", "-p", "{S}", "-iTCP:1"]

[[case]]
# {IT2DIR} is the cwd of fixture I's thread t2 alone, so only that task's
# row is selected.
name = "tasks-dash-K-and-a-a-row-only-a-task-holds"
args = ["-n", "-P", "-V", "-K", "-a", "-p", "{I}", "{IT2DIR}"]

[[case]]
# LEDGERED (C-DEFECT, DIVERGENCES 57). The case above lists a row of I's, so
# -t prints I's PID in lsof-rs. The C prints nothing and exits 0: under -t,
# print.c marks the PID printed before it looks for a selected file, and
# the process's own entry, which has none, sorts first.
name = "tasks-dash-K-terse-a-row-only-a-task-holds-in-lsof-rs"
args = ["-K", "-t", "-a", "-p", "{I}", "{IT2DIR}"]

[[case]]
# Run as a user who cannot read U: the NOFD row is built whatever the C is
# checking, and it locates -K.
name = "unreadable-dash-K-and-a-U-located-by-the-nofd-row"
args = ["-n", "-P", "-V", "-K", "-a", "-p", "{U}", "-U"]
env = { LSOF_DIFF_UNPRIVILEGED = "1" }

# ------------------------------------------- sockets in another namespace (J)
# `/proc/net/*` shows the CALLING process's network namespace, so a socket
# inside a container is an inode no local table explains. The C answers it from
# the `system.sockprotoname` extended attribute (`dsock.c`) and prints the
# PROTOCOL with no address: `sock  0,9  0t0  <inode>  protocol: TCP`. Three
# cells differ from an ordinary socket row -- a lowercase `sock` TYPE, the
# OFFSET rather than a size, and that NAME.
#
# lsof-rs reaches the same answer by reading the owning process's own
# `/proc/<pid>/net/*`, cached per namespace. It could print the address it
# learns on the way; it deliberately does not, because matching the C is the
# contract. See the ledger entry on AF_VSOCK for the families this cannot name
# and the xattr can.
#
# SKIPPED, not failed, on a runner without CAP_SYS_ADMIN for `unshare --net`.

[[case]]
# The whole row for the namespaced listener, socket cell included.
name = "netns-socket-shows-protocol-only"
args = ["-n", "-P", "-a", "-d", "^mem", "-p", "{J}"]

[[case]]
# The same row through `-F`: `t` is the TYPE and `n` the NAME, so this pins
# the two cells the table case could only show positionally.
name = "netns-socket-fields"
args = ["-n", "-P", "-a", "-d", "^mem", "-Ftn", "-p", "{J}"]

[[case]]
# `-i` selects internet sockets by protocol and state. An unresolved socket
# has neither, so it must NOT be selected -- the C leaves it out, and a port
# that resolved the address from the namespace table would wrongly include it.
name = "netns-socket-is-not-selected-by-dash-i"
args = ["-n", "-P", "-a", "-i", "-p", "{J}"]

# ------------------------------------------- P4's small options
# Each was measured against the oracle before being written, and each was
# larger than the L2 plan sized it.

[[case]]
# `-X` does NOT skip TCP and UDP files, whatever the man page says: the rows
# stay and lose their identity — `sock … can't identify protocol (-X
# specified)`. Fixture B holds a TCP listener, a UDP socket and an AF_UNIX
# socket, and only the first two degrade.
name = "opt-X-degrades-inet-rows-rather-than-skipping-them"
args = ["-n", "-P", "-a", "-d", "^mem", "-X", "-p", "{B}"]

[[case]]
# `-X` with `-i` is refused outright rather than silently selecting nothing.
name = "opt-X-with-dash-i-is-fatal"
args = ["-n", "-P", "-X", "-i", "-p", "{B}"]

[[case]]
# `-X` TOGGLES (`main.c`: `Fxopt = Fxopt ? 0 : 1`): a second one turns the
# lookup back on, and B's TCP and UDP rows are whole again. lsof-rs set it on
# however many times it was given (DIVERGENCES 45).
name = "opt-X-twice-is-off"
args = ["-n", "-P", "-a", "-d", "^mem", "-X", "-X", "-p", "{B}"]

[[case]]
# The conflict with `-i` is judged on the final value, so this lists B's
# Internet files where lsof-rs refused the pair.
name = "opt-X-toggled-off-around-dash-i-is-no-conflict"
args = ["-n", "-P", "-X", "-a", "-i", "-X", "-p", "{B}"]

[[case]]
# `+X` toggles too: the C's case never looks at the prefix.
name = "opt-plus-X-toggles-as-dash-X-does"
args = ["-n", "-P", "-a", "-d", "^mem", "+X", "-p", "{B}"]

[[case]]
# The `+d` symlink rule, on a directory whose ONLY entry is a link pointing out
# of it at a file the fixture holds open under its real name. The C skips the
# link, so this prints nothing; lsof-rs followed every link and printed the
# target's row. `{ADIR}` cannot show this — there the link's target is already
# in the expansion under its own name, so following it changes no selection.
name = "opt-x-plus-d-skips-symlinks-by-default"
args = ["-n", "-P", "-a", "-d", "^mem", "+d", "{AXDIR}", "-p", "{A}"]

[[case]]
# `-x` alone is a usage error, and an unknown cross-over letter names itself.
name = "opt-x-without-plus-d-is-fatal"
args = ["-n", "-P", "-x", "-p", "{A}"]

[[case]]
name = "opt-x-unknown-letter-is-fatal"
args = ["-n", "-P", "-xq", "+d", "{ADIR}", "-p", "{A}"]

[[case]]
# `-e` means DO NOT STAT: every cell stat would have supplied disappears and
# NAME gains ` (-e /)`. `/` exempts the whole fixture.
name = "opt-e-exempts-a-mount-from-stat"
args = ["-n", "-P", "-a", "-d", "^mem", "-e", "/", "-p", "{A}"]

[[case]]
# The same row through `-F`, which is the only way to see that the access
# letter goes blank and that size, inode and link count are absent rather than
# empty.
name = "opt-e-exempted-row-fields"
args = ["-n", "-P", "-a", "-d", "3", "-e", "/", "-Ftadsin", "-p", "{A}"]

[[case]]
name = "opt-e-non-mount-argument-is-fatal"
args = ["-n", "-P", "-e", "/nosuch", "-p", "{A}"]

[[case]]
# `-N` is a SEARCH ITEM like `-i`: with no NFS mount it selects nothing and
# exits 1, and without `-a` it still lists what the other selecter matched.
name = "opt-N-ors-with-another-selecter-and-still-exits-1"
args = ["-n", "-P", "-N", "-p", "{A}"]

[[case]]
name = "opt-N-with-dash-a-selects-nothing"
args = ["-n", "-P", "-a", "-N", "-p", "{A}"]

[[case]]
# WHOLE HOST, no process selecter — the only shape that shows whether `-N` is
# in the mask that drops a process with no surviving rows. With `-p` present
# the process has files and the bug is invisible; without it, a port that
# forgot the mask prints a bare `unk unknown` line per process. Output is
# empty on a host with no NFS mount, so this is race-free despite naming no
# pid: both binaries print nothing and exit 1.
name = "opt-N-whole-host-selects-nothing-and-exits-1"
args = ["-n", "-P", "-N"]

[[case]]
# `-Z` where SELinux is not enabled. The check is a MOUNTED-selinuxfs test, not
# a `/sys/fs/selinux` presence test — this host has the directory and not the
# mount, so the two answers differ here.
name = "opt-Z-without-selinux-is-fatal"
args = ["-n", "-P", "-Z", "-p", "{A}"]

# ----------------------------------------------------- AF_PACKET sockets
# The `pack` row. lsof spends its cells differently here than for any other
# family (dsock.c:3622): the INODE goes in DEVICE, the ETHERNET PROTOCOL in
# NODE, and NAME is only `type=SOCK_RAW` -- a packet socket has no address.
#
# The NODE cell has three branches and fixture K holds one socket for each:
# a named protocol, one whose name is longer than the 7 bytes `Lf->iproto`
# holds (ETH_P_LOOPBACK -> `LOOPBAC`), and one the C does not name, which it
# prints as a decimal number.
#
# SKIPPED, not failed, on a runner without CAP_NET_RAW.

[[case]]
# The whole row, positionally: TYPE, DEVICE, SIZE/OFF, NODE and NAME at once.
name = "packet-socket-row"
args = ["-n", "-P", "-a", "-d", "^mem", "-p", "{K}"]

[[case]]
# The same cells through `-F`, which names them: `d` DEVICE, `o` SIZE/OFF and
# `P` the protocol. `P` and not `i` is the point -- the C picks between those
# two on `Lf->inp_ty`, and for a packet row it sets 2, so there is no `i`.
name = "packet-socket-fields"
args = ["-n", "-P", "-a", "-d", "^mem", "-FtdoPin", "-p", "{K}"]

[[case]]
# `-i` selects INTERNET files. A packet socket is not one, and the C does not
# select it -- so this must print nothing and exit 1, from both binaries.
name = "packet-socket-is-not-selected-by-dash-i"
args = ["-n", "-P", "-a", "-i", "-p", "{K}"]

# ------------------------------------- the kernel's name for a foreign socket
# Fixture L holds a packet socket and two AF_UNIX sockets inside a user+net
# namespace, so `/proc/net/*` misses all three and each binary has to fall
# back: the C to the `system.sockprotoname` xattr, this port to the owning
# process's own tables.
#
# That name is the kernel's, and for these families it is NOT the one either
# program uses elsewhere -- `PACKET` where the table row says `pack` and NODE
# says `ALL`, and `UNIX-STREAM`/`UNIX` where the table row says `unix`. The
# stream/dgram split is the kernel's `struct proto` name, which is also why a
# SOCK_SEQPACKET socket reports `UNIX`.
#
# This is the only case in the harness that reaches that code without needing
# a privilege the runner may not have.

[[case]]
name = "userns-sockets-show-the-kernels-protocol-name"
args = ["-n", "-P", "-a", "-d", "^mem", "-p", "{L}"]

[[case]]
name = "userns-sockets-kernel-protocol-name-fields"
args = ["-n", "-P", "-a", "-d", "^mem", "-Ftn", "-p", "{L}"]

[[case]]
# A socket no table here knows has the socket file system for its device,
# which the C records, so `-F` prints it as `D0x9`; lsof-rs printed `d0,9`.
name = "userns-unidentified-socket-device-is-D"
args = ["-n", "-P", "-a", "-d", "^mem", "-FtDdn", "-p", "{L}"]

[[case]]
# L's packet ring, mapped in a mount namespace of its own. As root, the C
# reaches it through `map_files`, finds a socket no table here knows, and
# names it from `getxattr()` of `socket:[N]`, which is no path: `can't
# identify protocol`. lsof-rs printed `protocol: PACKET`, the fd's name. As
# anyone else every mapping of L reads `(stat: Operation not permitted)`.
name = "userns-mapped-socket-cannot-be-named"
args = ["-n", "-P", "-a", "-d", "mem", "-p", "{L}"]

# ----------------------------------------------- the search-item contract
# WHAT COUNTS AS A SEARCH ITEM, and what happens when one is not located.
# Two different failures that look alike from the outside:
#
#   * an argument that **cannot be stat'ed**. `ck_file_arg` reports the errno
#     and DROPS it, and if no argument survived it returns non-zero, which
#     `main.c` answers with `Error()` -- an exit BEFORE the listing runs. So
#     another selector never gets its turn.
#   * an argument that resolves but is **never located** among the rows. The
#     listing prints normally and only the exit status records it.
#
# `-Q` mutes both, status included; `-V` narrates them, on STDOUT, because
# every "not located" line in `main.c` is a `printf`.
#
# None of this was covered: 69 cases and neither `-V` nor `-Q` appeared in any
# of them.

[[case]]
# THE FATAL CASE. A selector that would have matched plenty, and one path that
# cannot be stat'ed: the C prints NOTHING. lsof-rs used to print the -p rows.
name = "search-unstattable-path-is-fatal"
args = ["-n", "-P", "-p", "{A}", "{NOPE}"]

[[case]]
# ... but only when NOTHING survived. One good path alongside the bad one and
# the listing runs as usual, with exit 1 recording the failure.
name = "search-one-good-path-survives-a-bad-one"
args = ["-n", "-P", "{ADIR}", "{NOPE}"]

[[case]]
# Argument order does not change it.
name = "search-bad-path-before-good"
args = ["-n", "-P", "{NOPE}", "{ADIR}"]

[[case]]
# TWO bad arguments alongside a selector that would have matched. Written this
# way on purpose: with no selector, "every path is bad" prints nothing whether
# or not the run aborts, so the obvious spelling of this case cannot fail. The
# `-p` gives it something to lose, and the second bad path is what a mutant
# that only records the FIRST failure gets wrong.
name = "search-all-paths-unstattable"
args = ["-n", "-P", "-p", "{A}", "{NOPE}", "{NOPE}x"]

[[case]]
# `-a` does not save it -- argument processing has already given up.
name = "search-unstattable-path-fatal-under-dash-a"
args = ["-n", "-P", "-a", "-p", "{A}", "{NOPE}"]

[[case]]
# RESOLVES but is not located: exit 1, and nothing printed without `-V`.
name = "search-unlocated-path-exits-1"
args = ["-n", "-P", "{UNOPENED}"]

[[case]]
# `-V` narrates it, on STDOUT: `lsof: no file use located: <path>`. lsof-rs
# wrote a differently-worded line to stderr, so a consumer redirecting stdout
# saw the table and none of the explanation.
name = "search-dash-V-reports-an-unlocated-path"
args = ["-n", "-P", "-V", "{UNOPENED}"]

[[case]]
# The same for a PID: `lsof: process ID not located: <pid>`, stdout.
name = "search-dash-V-reports-an-unlocated-pid"
args = ["-n", "-P", "-V", "-p", "999999999"]

[[case]]
# `-V` on the unstattable path: the errno line is stderr (not compared), the
# exit is still 1, and stdout stays empty.
name = "search-dash-V-with-an-unstattable-path"
args = ["-n", "-P", "-V", "{NOPE}"]

[[case]]
# `-Q` mutes the STATUS, not just the message: exit 0 where the same run
# without it exits 1. This is the half scripts branch on, and lsof-rs had
# muted the message alone.
name = "search-dash-Q-mutes-the-unlocated-status"
args = ["-n", "-P", "-Q", "{UNOPENED}"]

[[case]]
# `-Q` also makes an all-unstattable argument set non-fatal.
name = "search-dash-Q-makes-a-bad-path-non-fatal"
args = ["-n", "-P", "-Q", "{NOPE}"]

[[case]]
# ... and then the other selector DOES get its turn, exiting 0.
name = "search-dash-Q-lets-another-selector-run"
args = ["-n", "-P", "-Q", "-a", "-d", "cwd", "-p", "{A}", "{NOPE}"]

[[case]]
# `-Q` on a PID that does not exist: exit 0, where plain exits 1.
name = "search-dash-Q-mutes-an-unlocated-pid"
args = ["-n", "-P", "-Q", "-p", "999999999"]

[[case]]
# A `+d` or `+D` the C cannot use ends the run while it parses: `enter_dir()`
# fails, and `main.c` answers with `usage()`. Exit 1, empty stdout. This case
# was first read as "a warning, and the run continues", which a run with
# nothing else to list cannot tell apart; `path-plus-d-unstatable-ends-the-run`
# has something to list (DIVERGENCES 74).
name = "search-plus-d-unstattable-ends-the-run"
args = ["-n", "-P", "+d", "{NOPE}"]

[[case]]
# A `+d` is no surviving PATH argument: with every bare path dropped the run
# ends, `+d` or not (DIVERGENCES 77). `+d` comes first so that it is an option
# to the C too. This case first put the bare path first, where the C's options
# end (DIVERGENCES 12): `+d` and `sub` were two more paths to it, and `sub`
# survived as a plain directory -- which read as a `+d` keeping the run alive,
# and as the C losing the expansion's entries (item 20, re-diagnosed).
name = "search-plus-d-is-no-surviving-bare-path"
args = ["-n", "-P", "+d", "{ASUB}", "{NOPE}"]

# ------------------------------------------------ the -o digit limit (item 6)
# Fixture O holds fd 3 at offset 123456789 and fd 4 at 12. The C prints an
# offset in hex once its decimal form has more than `OffDecDig` digits -- 8
# by default, `-o <digits>` otherwise, 0 for no limit -- in the table and in
# `-F`'s `o` field alike.

[[case]]
name = "offsets-past-eight-digits-print-in-hex"
args = ["-n", "-P", "-o", "-a", "-d", "3,4", "-p", "{O}"]

[[case]]
# `-o -o 1`: the first `-o` is bare (its next word opens an option), the
# second sets the limit to 1 digit, so even `0t12` becomes `0xc`.
name = "offsets-a-digit-limit-hexes-a-short-offset"
args = ["-n", "-P", "-o", "-o", "1", "-a", "-d", "3,4", "-p", "{O}"]

[[case]]
name = "offsets-a-zero-limit-is-no-limit"
args = ["-n", "-P", "-o0", "-o", "-a", "-d", "3,4", "-p", "{O}"]

[[case]]
# A digit limit alone does NOT switch the OFFSET column on, and its digits are
# its value -- not a file called `1`. lsof-rs had said `status error on 1`.
name = "offsets-a-limit-alone-keeps-size-off"
args = ["-n", "-P", "-o", "1", "-a", "-d", "3,4", "-p", "{O}"]

[[case]]
name = "offsets-hex-in-the-o-field"
args = ["-n", "-P", "-Ffo", "-a", "-d", "3,4", "-p", "{O}"]

[[case]]
name = "offsets-the-limit-applies-to-the-o-field"
args = ["-n", "-P", "-Ffo", "-o1", "-a", "-d", "3,4", "-p", "{O}"]

[[case]]
# What follows the digits is options again: `-o 1t` is `-o1 -t`.
name = "offsets-letters-after-the-digits-are-options"
args = ["-n", "-P", "-o", "1t", "-a", "-d", "3", "-p", "{O}"]

[[case]]
# main.c:1091 -- in either order, and `-Fo` counts as `-o`.
name = "opt-o-and-s-are-mutually-exclusive"
args = ["-n", "-P", "-o", "-s", "-p", "{A}"]

[[case]]
name = "opt-s-and-o-are-mutually-exclusive"
args = ["-n", "-P", "-s", "-o", "-p", "{A}"]

[[case]]
name = "opt-F-o-counts-as-o-against-s"
args = ["-n", "-P", "-Ffo", "-s", "-p", "{A}"]

# -------------------------------------------------------- zombies (item 31)
# Fixture Z: a main thread that has exited while another thread (`zombie-live`)
# runs on, and {ZC}, a child that exited and is never reaped. The C lists
# neither -- a process in state Z is skipped before selection -- so naming
# one is a search item not located. It still walks a zombie's tasks, so the
# live thread is listed under -K, WITH its mapped files, which only the
# task's own `maps` still has. lsof-rs printed a bare `unk unknown` row for
# each zombie and exited 0.

[[case]]
name = "zombie-is-not-listed"
args = ["-n", "-P", "-p", "{ZC}"]

[[case]]
name = "zombie-dash-V-says-not-located"
args = ["-n", "-P", "-V", "-p", "{ZC}"]

[[case]]
name = "zombie-leader-is-not-listed"
args = ["-n", "-P", "-p", "{Z}"]

[[case]]
name = "zombie-terse"
args = ["-t", "-p", "{Z},{ZC}"]

[[case]]
name = "zombie-leader-lists-its-live-task"
args = ["-n", "-P", "-K", "-a", "-p", "{Z}"]

[[case]]
name = "zombie-leader-live-task-terse"
args = ["-t", "-K", "-a", "-p", "{Z}"]

# ----------------------------------------------- bytes that are not UTF-8
# Fixture X names itself, binds a unix socket and maps a file with bytes that
# are not UTF-8. Each hid something from lsof-rs, which dropped a whole kernel
# table when one byte in it failed to decode. These compare what does not
# depend on how the byte is shown (the C `\xff`, lsof-rs U+FFFD -- ledgered).

[[case]]
# lsof-rs said the process did not exist.
name = "nonutf8-name-does-not-hide-the-process"
args = ["-t", "-p", "{X}"]

[[case]]
# X's socket makes /proc/net/unix undecodable as a whole; lsof-rs then
# resolved NO unix socket anywhere, so B's four vanished from `-U`.
name = "nonutf8-socket-path-does-not-blind-dash-U"
args = ["-n", "-P", "-a", "-p", "{B}", "-U"]

[[case]]
# X's mapped file made its `maps` undecodable, and every `mem` row went.
# Fields without the name, which is where the display differs.
name = "nonutf8-mapped-file-keeps-the-mem-rows"
args = ["-n", "-P", "-a", "-p", "{X}", "-d", "mem", "-Ffi"]

[[case]]
# Fixture T maps `tab<TAB>here`. The C ends a maps path at the TAB and reads
# `tab`, a name that is no file here -- `(stat: No such file or directory)`,
# no size -- and that would be another file's if one were there. lsof-rs
# keeps the whole name and describes the file. C-DEFECT 103, not reproduced;
# ledgered. No path argument: the C would print the argument's name (item
# 17), and the cut would not show.
name = "mapped-name-with-a-tab-kept-whole-in-lsof-rs"
args = ["-n", "-P", "-a", "-d", "mem", "-p", "{T}"]

# ------------------------------------------------ a mapping named by no path
# Fixture RN maps an io_uring ring, which the kernel names
# `anon_inode:[io_uring]`. The C `stat`s that name relative to its own
# working directory; from `plant/`, which holds a file of that name, it
# describes the planted file in the ring's place. lsof-rs never `stat`s a
# name that is no path (C-DEFECT 102, not reproduced).

[[case]]
name = "mapping-named-by-no-path-not-stated-in-lsof-rs"
cwd = "{RNPLANT}"
args = ["-n", "-P", "-a", "-d", "mem", "-p", "{RN}"]

[[case]]
# The control: where nothing is planted, both say what the C says.
name = "mapping-named-by-no-path-where-nothing-is-planted"
args = ["-n", "-P", "-a", "-d", "mem", "-p", "{RN}"]

# ------------------------------------------ search items: -c, -u, -g, -p (item 21)
# Fixture H's command, `abcdefghijklmno`, is the only one on the host with
# that prefix, and H is its own process group, so `-c` and `-g` can name it
# and nothing else.

[[case]]
name = "search-c-unlocated-exits-1"
args = ["-n", "-P", "-c", "zzznosuchcmd"]

[[case]]
name = "search-dash-V-reports-an-unlocated-command"
args = ["-n", "-P", "-V", "-c", "zzznosuchcmd"]

[[case]]
# The C prepends each -c to its list, so it reports them last-given first.
name = "search-dash-V-reports-commands-last-given-first"
args = ["-n", "-P", "-V", "-c", "zzzfirst", "-c", "zzzsecond"]

[[case]]
# A prefix of the command...
name = "search-c-is-a-prefix"
args = ["-n", "-P", "-a", "-c", "abcdefghij", "-d", "0"]

[[case]]
# ...compared case-sensitively (lsof-rs matched case-insensitively)...
name = "search-c-is-case-sensitive"
args = ["-n", "-P", "-a", "-c", "ABCDEFGHIJ", "-d", "0"]

[[case]]
# ...and only at the start (lsof-rs matched substrings too).
name = "search-c-a-substring-does-not-match"
args = ["-n", "-P", "-a", "-c", "bcdefghijklmno", "-d", "0"]

[[case]]
# `comm` holds 15 bytes; a 16-byte -c could never match, and the C refuses it.
# Every "fatal" case in this block carries -V, and that is what lets it fail:
# a fatal error and a merely unlocated item both print nothing and exit 1, and
# only -V -- the fatal run never gets to report anything -- tells them apart.
name = "search-c-longer-than-comm-is-fatal"
args = ["-n", "-P", "-V", "-c", "abcdefghijklmnop"]

[[case]]
name = "search-c-selected-and-excluded-is-fatal"
args = ["-n", "-P", "-V", "-c", "abc", "-c", "^abc"]

[[case]]
# Under -a a command is located only by a process that got past the -p test
# (`is_proc_excl() || is_cmd_excl()`): H matches the -c but is not {A}, and A
# is {A} but not the command -- so neither locates it, nothing is listed, and
# the exit is 1. Found by a mutant that let any matching process locate it.
name = "search-c-under-a-is-located-only-past-the-other-kinds"
args = ["-n", "-P", "-a", "-p", "{A}", "-c", "abcdefghij", "-d", "0"]

[[case]]
# LEDGERED (C-DEFECT, DIVERGENCES 13). H matches both values; the C marks only
# the first one in its list and reports the other as not located, exit 1.
name = "search-c-first-match-only-in-the-c"
args = ["-n", "-P", "-a", "-c", "abcde", "-c", "abcdefgh", "-d", "0"]

[[case]]
# LEDGERED (C-DEFECT, DIVERGENCES 13). A `-c ^` value is a search item to the
# C that nothing can ever mark, so every run that uses one exits 1.
name = "search-c-negated-is-a-search-item-in-the-c"
args = ["-n", "-P", "-a", "-p", "{A}", "-c", "^zzznosuchcmd", "-d", "3"]

[[case]]
name = "search-u-numeric-uid-selects"
args = ["-n", "-P", "-a", "-p", "{A}", "-u", "{UID}", "-d", "3"]

[[case]]
name = "search-u-login-name-selects"
args = ["-n", "-P", "-a", "-p", "{A}", "-u", "{USER}", "-d", "3"]

[[case]]
name = "search-u-negation-excludes"
args = ["-n", "-P", "-a", "-p", "{A}", "-u", "^{UID}", "-d", "3"]

[[case]]
# The C resolves a login name while it parses; one it cannot is fatal.
name = "search-u-unknown-login-is-fatal"
args = ["-n", "-P", "-V", "-u", "zzznosuchuser"]

[[case]]
name = "search-dash-V-reports-an-unlocated-uid"
args = ["-n", "-P", "-V", "-u", "4000000001"]

[[case]]
name = "search-u-selected-and-excluded-is-fatal"
args = ["-n", "-P", "-V", "-u", "{UID},^{UID}"]

[[case]]
# LEDGERED (C-DEFECT). The C accumulates the digits in a uid_t and never
# checks for overflow: 4294967296 is UID 0, and it selects root's processes.
# lsof-rs refuses the value (no account has that name).
name = "search-u-overflow-wraps-to-root-in-the-c"
args = ["-n", "-P", "-a", "-p", "{A}", "-u", "4294967296", "-d", "3"]

[[case]]
# -g is the process GROUP. lsof-rs had read it as a parent PID.
name = "search-g-selects-a-process-group"
args = ["-n", "-P", "-a", "-g", "{H}", "-d", "0"]

[[case]]
# A bare -g is the PGID column (lsof-rs refused it).
name = "search-g-alone-adds-the-pgid-column"
args = ["-n", "-P", "-g", "-a", "-p", "{H}", "-d", "0"]

[[case]]
# PPID first, then PGID, as print.c orders them.
name = "search-g-with-dash-R"
args = ["-n", "-P", "-R", "-g", "{H}", "-a", "-d", "0"]

[[case]]
name = "search-g-negation-excludes"
args = ["-n", "-P", "-a", "-p", "{H}", "-g", "^{H}"]

[[case]]
name = "search-dash-V-reports-an-unlocated-pgid"
args = ["-n", "-P", "-V", "-g", "999999999"]

[[case]]
name = "search-g-fields"
args = ["-n", "-P", "-Fpg", "-a", "-g", "{H}", "-d", "0"]

[[case]]
# -p ^N excludes (lsof-rs refused the `^`); the only process -c names is
# then gone, so the command is not located either.
name = "search-p-negation-excludes"
args = ["-n", "-P", "-a", "-p", "^{H}", "-c", "abcdefghij", "-d", "0"]

[[case]]
name = "search-p-selected-and-excluded-is-fatal"
args = ["-n", "-P", "-V", "-p", "{A},^{A}"]

[[case]]
# An empty item in a -p list is PID 0, the digits of nothing (`enter_id()`),
# and no process has it (DIVERGENCES 49). lsof-rs had dropped the item, so
# `-p ,` listed the whole host and exited 0.
name = "search-p-empty-item-is-pid-0"
args = ["-t", "-p", ","]

[[case]]
name = "search-p-empty-item-beside-a-pid"
args = ["-t", "-p", ",{A}"]

[[case]]
# ...and -V names it: `process ID not located: 0`.
name = "search-p-dash-V-reports-pid-0"
args = ["-n", "-P", "-V", "-t", "-p", "{A},,{A}"]

[[case]]
# A trailing comma ends the list: no PID 0 there.
name = "search-p-trailing-comma-ends-the-list"
args = ["-t", "-p", "{A},"]

[[case]]
# A `^` alone excludes PID 0 (lsof-rs refused it).
name = "search-p-caret-alone-excludes-pid-0"
args = ["-t", "-p", "^", "-p", "{A}"]

[[case]]
name = "search-p-zero-included-and-excluded-is-fatal"
args = ["-t", "-p", ",^"]

[[case]]
# Only a comma separates: a space makes the whole argument illegal
# (`illegal process ID: …`). lsof-rs had split on spaces too.
name = "search-p-space-is-illegal"
args = ["-t", "-p", "{A} {B}"]

[[case]]
# LEDGERED (C-DEFECT). The C sums the digits in an `int`, so 4294967296 wraps
# to PID 0, which -V reports. lsof-rs refuses an ID that does not fit.
name = "search-p-overflow-wraps-in-the-c"
args = ["-n", "-P", "-V", "-t", "-p", "4294967296"]

[[case]]
# -g reads the same list: an empty item is PGID 0, which the kernel's own
# threads hold wherever /proc shows them; -a then leaves A out.
name = "search-g-empty-item-is-pgid-0"
args = ["-t", "-a", "-g", ",", "-p", "{A}"]

[[case]]
name = "search-g-caret-alone-excludes-pgid-0"
args = ["-t", "-a", "-g", "^", "-p", "{A}"]

[[case]]
# -u reads it too (DIVERGENCES 69): `-u ,` is UID 0, and so is `-u ,^`.
name = "search-u-zero-included-and-excluded-is-fatal"
args = ["-t", "-u", ",^"]

[[case]]
# The C finds that conflict while it parses -u, so before it acts on -h: no
# help, and exit 1. lsof-rs had printed the help and exited 0.
name = "search-u-conflict-beats-help"
args = ["-u", ",^", "-h"]

[[case]]
# The same for -p, which lsof-rs already checked while it parsed.
name = "search-p-conflict-beats-help"
args = ["-p", "{A},^{A}", "-h"]

[[case]]
# A -u item longer than a login name can be, 32 bytes (`LOGINML`), is refused
# whatever it holds; lsof-rs read these 33 digits as UID 0.
name = "search-u-33-characters-are-refused"
args = ["-t", "-a", "-u", "000000000000000000000000000000000", "-p", "{A}"]

# ------------------------------------------------------------- -d lists
# `enter_fd()` adds every -d to one list, of one kind (DIVERGENCES 51).
# lsof-rs kept only the last -d, and took a list of both kinds.

[[case]]
name = "fd-lists-add-up"
args = ["-n", "-P", "-a", "-p", "{A}", "-d", "3", "-d", "5"]

[[case]]
name = "fd-exclusions-add-up"
args = ["-n", "-P", "-a", "-p", "{A}", "-d", "^cwd", "-d", "^rtd", "-d", "^txt", "-d", "^mem", "-d", "^0-2"]

[[case]]
# A list of both kinds is refused, and the run never starts...
name = "fd-mixed-list-is-fatal"
args = ["-n", "-P", "-a", "-p", "{A}", "-d", "3,^4"]

[[case]]
# ...across two -d as well...
name = "fd-mixed-across-options-is-fatal"
args = ["-n", "-P", "-a", "-p", "{A}", "-d", "^4", "-d", "3"]

[[case]]
# ...and under -t, which mutes the message but not the refusal.
name = "fd-mixed-list-is-fatal-under-t"
args = ["-t", "-a", "-p", "{A}", "-d", "3,^4"]

[[case]]
# An empty item enters nothing: `-d ,` is no list at all.
name = "fd-empty-items-enter-nothing"
args = ["-n", "-P", "-a", "-p", "{A}", "-d", ","]

[[case]]
name = "fd-caret-alone-enters-nothing"
args = ["-n", "-P", "-a", "-p", "{A}", "-d", "^"]

[[case]]
name = "fd-empty-value-is-fatal"
args = ["-n", "-P", "-a", "-p", "{A}", "-d", ""]

[[case]]
# `fd` is the C's name for every numbered descriptor (lsof-rs refused it).
name = "fd-name-fd-is-every-number"
args = ["-n", "-P", "-a", "-p", "{A}", "-d", "fd"]

[[case]]
name = "fd-name-fd-excluded"
args = ["-n", "-P", "-a", "-p", "{A}", "-d", "^fd,^mem"]

[[case]]
# Another dialect's FD name is no error, and nothing here carries one.
name = "fd-other-dialect-name-selects-nothing"
args = ["-n", "-P", "-a", "-p", "{A}", "-d", "ltx"]

[[case]]
name = "fd-unknown-name-is-fatal"
args = ["-n", "-P", "-a", "-p", "{A}", "-d", "foo"]

[[case]]
# A range's low end must be below its high: lsof-rs took 3-3 as fd 3.
name = "fd-range-low-not-below-high-is-fatal"
args = ["-n", "-P", "-a", "-p", "{A}", "-d", "3-3"]

[[case]]
# A range past INT_MAX ends the run in both: the C's `int` wraps the high
# end below the low one, and lsof-rs refuses a number it cannot hold.
name = "fd-range-past-int-max-is-fatal"
args = ["-n", "-P", "-a", "-p", "{A}", "-d", "0-2147483648"]

[[case]]
# LEDGERED (C-DEFECT). The C's `int` wraps 4294967299 to fd 3, and lists it.
# lsof-rs refuses a -d number past INT_MAX.
name = "fd-number-over-int-max-wraps-in-the-c"
args = ["-n", "-P", "-a", "-p", "{A}", "-d", "4294967299"]

# -------------------------------------------------- -a with nothing to AND
# `main.c` refuses -a when no selection flag is set: nothing on stdout, exit
# 1 (DIVERGENCES 50). lsof-rs listed the whole host.

[[case]]
name = "and-with-nothing-is-fatal"
args = ["-a"]

[[case]]
# Exclusions select nothing.
name = "and-with-only-exclusions-is-fatal"
args = ["-a", "-p", "^{A}", "-u", "^{UID}"]

[[case]]
# `-K i` selects nothing, where `-K` would.
name = "and-with-dash-K-i-is-fatal"
args = ["-a", "-K", "i"]

[[case]]
# -s filters socket states; it selects nothing.
name = "and-with-only-a-state-filter-is-fatal"
args = ["-a", "-s", "TCP:LISTEN"]

[[case]]
name = "and-with-an-empty-fd-list-is-fatal"
args = ["-a", "-d", ","]

[[case]]
# An exclusion-only -d does select: every row it does not exclude. Excluding
# every kind there is leaves none, so nothing prints and the run exits 0.
name = "and-with-an-fd-exclusion-list-runs"
args = ["-t", "-a", "-d", "^fd,^cwd,^rtd,^txt,^mem,^DEL,^NOFD,^unk"]

[[case]]
# So does `+L0`, though nothing has fewer than 0 links.
name = "and-with-plus-L-zero-runs"
args = ["-t", "-a", "+L0"]

[[case]]
name = "search-dash-V-reports-a-repeated-pid-once"
args = ["-n", "-P", "-V", "-p", "999999999,999999999"]

[[case]]
# Every kind at once, none located: `-V` in the C's order -- commands, files,
# Internet addresses, PIDs, process groups, users.
name = "search-dash-V-follows-the-cs-order"
args = ["-n", "-P", "-V", "-c", "zzznosuchcmd", "-p", "999999999", "-g", "999999998", "-u", "4000000001", "-i:9", "{UNOPENED}"]

[[case]]
# ...and after the listing, not before it: every line is a printf to stdout
# at the end of main.c. No case printed both until this one.
name = "search-dash-V-follows-the-listing"
args = ["-n", "-P", "-V", "-a", "-p", "{A},999999999", "-d", "3"]

[[case]]
# A file-system argument has its own wording: `no file system use located`.
name = "search-dash-V-file-system-wording"
args = ["-n", "-P", "-V", "-a", "-p", "{A}", "/proc"]

# ----------------------------------------------- -i specifications (item 21)
# Each -i address is its own search item, and they are ORed; a bare -i is
# another. lsof-rs kept only the LAST -i, so `-i :80 -i :443` lost :80.

[[case]]
name = "inet-every-spec-is-ored"
args = ["-n", "-P", "-a", "-p", "{B}", "-i:{PORT}", "-i:9"]

[[case]]
name = "inet-dash-V-names-each-spec-last-given-first"
args = ["-n", "-P", "-V", "-a", "-p", "{B}", "-i:9", "-i:10"]

[[case]]
name = "inet-dash-V-address-not-located"
args = ["-n", "-P", "-V", "-a", "-p", "{B}", "-i:9"]

[[case]]
# `-i :PORT` -- lsof-rs had read `:PORT` as a file name.
name = "inet-spec-may-be-the-next-word"
args = ["-n", "-P", "-a", "-p", "{B}", "-i", ":{PORT}"]

[[case]]
# Under -a a bare -i and a spec are two requirements (SELNET and SELNA).
name = "inet-bare-and-spec-are-both-required-under-a"
args = ["-n", "-P", "-a", "-p", "{B}", "-i", "-i:9"]

[[case]]
name = "inet-port-range"
args = ["-n", "-P", "-a", "-p", "{B}", "-iTCP:1-65535"]

[[case]]
# lsof-rs ignored a range and matched every Internet file.
name = "inet-port-range-that-misses"
args = ["-n", "-P", "-a", "-p", "{B}", "-i:1-2"]

[[case]]
name = "inet-port-list"
args = ["-n", "-P", "-a", "-p", "{B}", "-iTCP:9,{PORT}"]

[[case]]
# The bare -i is located by a socket B keeps even though `-d 0` hides it:
# Fnet is set when the file is linked, -a is applied at print time. Nothing
# is listed, and the exit is 0.
name = "inet-bare-located-by-a-hidden-row"
args = ["-n", "-P", "-a", "-p", "{B}", "-i", "-d", "0"]

[[case]]
# LEDGERED (C-DEFECT, DIVERGENCES 13). B's listener matches both specs; the
# C marks only the first in its list and reports the other, exit 1.
name = "inet-first-match-only-in-the-c"
args = ["-n", "-P", "-a", "-p", "{B}", "-iTCP:{PORT}", "-iTCP"]

# ------------------------------------------------------- unreadable fixture
# Fixture U made itself unreadable (PR_SET_DUMPABLE 0), and every case here
# runs as a user who cannot read it (LSOF_DIFF_UNPRIVILEGED; see
# linux_diff.py). The C does not drop what it cannot read: each of cwd, rtd
# and txt is a row ending `(readlink: Permission denied)`, and the fd table a
# `NOFD` row ending `(opendir: Permission denied)` -- TYPE `0000`, and no `t`
# field under -F. lsof-rs printed one bare `unk unknown` line. Under -w, and
# under -t (which sets it), the C makes none of those rows, so U is not
# listed at all -- but it was found: -p exits 0 and -V says nothing.
# DIVERGENCES 37 and "Inaccessible files".

[[case]]
name = "unreadable-rows-say-what-could-not-be-read"
args = ["-n", "-P", "-p", "{U}"]
env = { LSOF_DIFF_UNPRIVILEGED = "1" }

[[case]]
name = "unreadable-rows-as-fields"
args = ["-n", "-P", "-F", "-p", "{U}"]
env = { LSOF_DIFF_UNPRIVILEGED = "1" }

[[case]]
name = "unreadable-offset-column-is-blank"
args = ["-n", "-P", "-o", "-p", "{U}"]
env = { LSOF_DIFF_UNPRIVILEGED = "1" }

[[case]]
# Nothing listed, exit 0, and -V silent: the pid was located.
name = "unreadable-dash-w-makes-no-rows"
args = ["-n", "-P", "-V", "-w", "-p", "{U}"]
env = { LSOF_DIFF_UNPRIVILEGED = "1" }

[[case]]
# -t sets -w: no row, so no pid. lsof-rs printed the pid, from a fast path
# that never looked at the files.
name = "unreadable-dash-t-prints-no-pid"
args = ["-t", "-p", "{U}"]
env = { LSOF_DIFF_UNPRIVILEGED = "1" }

[[case]]
# +w after -t clears it again, and the rows -- so the pid -- come back.
name = "unreadable-dash-t-then-plus-w-prints-the-pid"
args = ["-t", "+w", "-p", "{U}"]
env = { LSOF_DIFF_UNPRIVILEGED = "1" }

[[case]]
name = "unreadable-plus-w-then-dash-t-prints-no-pid"
args = ["+w", "-t", "-p", "{U}"]
env = { LSOF_DIFF_UNPRIVILEGED = "1" }

[[case]]
# The C takes any FD name in -d, so NOFD selects the row that carries it.
name = "unreadable-dash-d-nofd"
args = ["-n", "-P", "-a", "-d", "NOFD", "-p", "{U}"]
env = { LSOF_DIFF_UNPRIVILEGED = "1" }

[[case]]
name = "unreadable-dash-d-cwd"
args = ["-n", "-P", "-a", "-d", "cwd", "-p", "{U}"]
env = { LSOF_DIFF_UNPRIVILEGED = "1" }

[[case]]
# A socket-only run: the rows for what could not be read are not sockets, so
# nothing is listed and the bare -i is not located.
name = "unreadable-socket-only-run"
args = ["-n", "-P", "-V", "-a", "-p", "{U}", "-i"]
env = { LSOF_DIFF_UNPRIVILEGED = "1" }

# ---------------------------------------------------------------- owner (W)
# A process's owner is its effective uid: the C takes the owner of
# /proc/<pid>/, which the kernel sets to the effective uid. Fixture W runs
# with real uid 0 and effective 65534, WR the other way round, so every view
# of the owner reads differently from the real uid lsof-rs had shown
# (DIVERGENCES 55). They need root to exist, so the fixture runs through
# `sudo -n` on a runner that is not root, and is skipped where it cannot; run
# as a user who cannot read them, their rows say so, the same in both.

[[case]]
name = "owner-is-the-effective-uid-fields"
args = ["-F", "pcuL", "-p", "{W},{WR}"]

[[case]]
name = "owner-is-the-effective-uid-table"
args = ["-n", "-P", "-a", "-d", "cwd", "-p", "{W},{WR}"]

[[case]]
name = "owner-is-the-effective-uid-numeric"
args = ["-n", "-P", "-l", "-a", "-d", "cwd", "-p", "{W},{WR}"]

[[case]]
name = "owner-dash-u-name-selects-the-effective-uid"
args = ["-n", "-P", "-V", "-u", "nobody", "-a", "-d", "cwd", "-p", "{W},{WR}"]

[[case]]
name = "owner-dash-u-number-selects-the-effective-uid"
args = ["-n", "-P", "-V", "-u", "0", "-a", "-d", "cwd", "-p", "{W},{WR}"]

[[case]]
name = "owner-dash-u-negated-excludes-the-effective-uid"
args = ["-n", "-P", "-V", "-u", "^nobody", "-a", "-d", "cwd", "-p", "{W},{WR}"]

[[case]]
# An empty -u item is UID 0 (DIVERGENCES 69): WR, root by its effective UID.
# lsof-rs had dropped the item and listed both.
name = "owner-dash-u-empty-item-is-uid-0"
args = ["-t", "-a", "-u", ",", "-p", "{W},{WR}"]

[[case]]
name = "owner-dash-u-empty-item-beside-a-uid"
args = ["-t", "-a", "-u", ",65534", "-p", "{W},{WR}"]

[[case]]
# A `^` alone excludes UID 0: W alone, and WR's PID is not located.
name = "owner-dash-u-caret-alone-excludes-uid-0"
args = ["-t", "-a", "-u", "^", "-p", "{W},{WR}"]

[[case]]
# 32 bytes are a name the C takes, digits and all: nobody, so W.
name = "owner-dash-u-32-characters-are-taken"
args = ["-t", "-a", "-u", "00000000000000000000000000065534", "-p", "{W},{WR}"]

# ----------------------------------------------------------- states fixture
# Fixture S: a TCP listener, an established TCP pair, an unconnected and a
# connected UDP socket, a unix socket and a file. On Linux the C tests every
# socket in the TCP and UDP tables against the -s TCP lists, by the kernel's
# number, and the kernel gives UDP TCP's numbers: 7 (CLOSE) unconnected, 1
# (ESTABLISHED) connected. Nothing else is touched. lsof-rs applied a TCP
# list to TCP sockets alone and DROPPED every other socket -- the unix one
# included -- took any text as a state, and kept only the last -s.
# DIVERGENCES 32.

[[case]]
name = "states-listen-keeps-every-other-file"
args = ["-n", "-P", "-a", "-p", "{S}", "-sTCP:LISTEN"]

[[case]]
name = "states-exclusion"
args = ["-n", "-P", "-a", "-p", "{S}", "-sTCP:^LISTEN"]

[[case]]
# The unconnected UDP socket is CLOSE, though it prints no state.
name = "states-close-is-the-unconnected-udp-socket"
args = ["-n", "-P", "-a", "-p", "{S}", "-sTCP:CLOSE"]

[[case]]
name = "states-established-includes-connected-udp"
args = ["-n", "-P", "-a", "-p", "{S}", "-sTCP:ESTABLISHED"]

[[case]]
name = "states-excluding-close-drops-unconnected-udp"
args = ["-n", "-P", "-a", "-p", "{S}", "-sTCP:^CLOSE"]

[[case]]
name = "states-inclusion-and-exclusion-with-dash-i"
args = ["-n", "-P", "-a", "-p", "{S}", "-i", "-sTCP:LISTEN,^ESTABLISHED"]

[[case]]
# The C's tables are global: two -s make one list.
name = "states-accumulate-across-options"
args = ["-n", "-P", "-a", "-p", "{S}", "-sTCP:LISTEN", "-sTCP:CLOSE"]

[[case]]
name = "states-names-ignore-case"
args = ["-n", "-P", "-a", "-p", "{S}", "-stcp:listen,Established"]

[[case]]
name = "states-value-as-its-own-word"
args = ["-n", "-P", "-a", "-p", "{S}", "-s", "TCP:LISTEN"]

[[case]]
# Each included state is a search item. -d 99 lists nothing, yet LISTEN is
# located -- the C marks a state while it reads the socket -- and the other
# two are reported in the C's TABLE order, CLOSED before SYN_SENT.
name = "states-not-located-in-table-order"
args = ["-n", "-P", "-V", "-a", "-p", "{S}", "-d", "99", "-sTCP:SYN_SENT,CLOSED,LISTEN"]

[[case]]
# A has no socket, and -p alone reads A alone.
name = "states-located-only-in-the-processes-read"
args = ["-n", "-P", "-V", "-p", "{A}", "-sTCP:LISTEN"]

[[case]]
# Two process selecters and no -a: the C reads EVERY process, so B's and S's
# listeners locate LISTEN and -V names only the command.
name = "states-two-process-selecters-read-everything"
args = ["-n", "-P", "-V", "-p", "{A}", "-c", "nosuchcmd", "-sTCP:LISTEN"]

[[case]]
name = "states-terse"
args = ["-V", "-t", "-p", "{S}", "-sTCP:LISTEN,SYN_SENT"]

[[case]]
name = "states-fields"
args = ["-n", "-P", "-a", "-p", "{S}", "-F", "-sTCP:ESTABLISHED"]

# Fatal -s errors: each prints nothing and exits 1. They carry -V so a run
# that ACCEPTED the value -- and listed S -- could not match.

[[case]]
name = "states-unknown-name-is-fatal"
args = ["-n", "-P", "-V", "-a", "-p", "{S}", "-sTCP:NOPE"]

[[case]]
# Windows' spelling; the Linux C's table says SYN_RECV.
name = "states-windows-name-is-unknown-here"
args = ["-n", "-P", "-V", "-a", "-p", "{S}", "-sTCP:SYN_RCVD"]

[[case]]
name = "states-duplicate-is-fatal"
args = ["-n", "-P", "-V", "-a", "-p", "{S}", "-sTCP:LISTEN,listen"]

[[case]]
name = "states-included-and-excluded-is-fatal"
args = ["-n", "-P", "-V", "-a", "-p", "{S}", "-sTCP:LISTEN", "-sTCP:^LISTEN"]

[[case]]
name = "states-empty-list-is-fatal"
args = ["-n", "-P", "-V", "-a", "-p", "{S}", "-sTCP:"]

[[case]]
name = "states-empty-name-is-fatal"
args = ["-n", "-P", "-V", "-a", "-p", "{S}", "-sTCP:LISTEN,,CLOSE"]

[[case]]
name = "states-unknown-protocol-is-fatal"
args = ["-n", "-P", "-V", "-a", "-p", "{S}", "-sXYZ:LISTEN"]

[[case]]
name = "states-no-protocol-is-fatal"
args = ["-n", "-P", "-V", "-a", "-p", "{S}", "-s", "LISTEN"]

[[case]]
name = "states-empty-udp-list-is-fatal"
args = ["-n", "-P", "-V", "-a", "-p", "{S}", "-sUDP:"]

[[case]]
# LEDGERED (C-DEFECT, DIVERGENCES 32): every -s UDP:<state> is a segfault in
# the C, which strcasecmp()s the NULL first slot of its UDP state table.
# lsof-rs refuses it with the man page's words for a protocol whose state
# names are unavailable, and exits 1.
name = "states-udp-names-crash-the-c"
args = ["-n", "-P", "-V", "-a", "-p", "{S}", "-sUDP:Idle"]

# ------------------------------------------------------------- argument order

[[case]]
# LEDGERED (DECISION, DIVERGENCES 12). The C stops reading options at the
# first file name, so `-a -p A` after {FILE} are three more names that do not
# exist: it lists A's row for the file and exits 1. lsof-rs reads them as
# options, lists the same row, and exits 0.
name = "options-after-a-name-are-still-options-in-lsof-rs"
args = ["-n", "-P", "{FILE}", "-a", "-p", "{A}"]

# ------------------------------------------------------------------- layout
# Every case compares its whitespace (linux_diff.py), so every case checks the
# table's layout: each column right-aligned but COMMAND, FD the descriptor
# right-aligned with its access and lock characters after it, and the `FD`
# title overrunning a one-character field (every `-d 3` case). These add the
# one shape nothing else reaches: USER as a number (DIVERGENCES 35, 36).

[[case]]
# `-l`: the C prints the UID with printuid()'s "%*lu", eight wide, so the
# column is too. lsof-rs printed a bare `0`, left-aligned.
name = "layout-numeric-user-is-eight-wide"
args = ["-n", "-P", "-l", "-a", "-d", "cwd,3", "-p", "{A}"]

[[case]]
# ...and writes no `L` field for a number, where lsof-rs wrote `L0`.
name = "fields-no-login-field-for-a-number"
args = ["-n", "-P", "-l", "-FpuL", "-p", "{A}"]

# ------------------------------- access letters and file flags (DIVERGENCES 44, 46)
# Fixture Q holds an fd for each open flag the C names, an O_PATH file, an
# O_PATH directory and an access-mode-3 fd. And, for DIVERGENCES 9, a directory
# opened by glibc's opendir(), which both print as `r`: the `u` item 9 recorded
# was an O_PATH directory fd.

[[case]]
# The C reads the access letter off the fd link's mode, which grants neither
# read nor write to O_PATH or to access mode 3, and prints neither as `u`.
# lsof-rs printed an O_PATH fd as `r`, and access mode 3 as nothing.
name = "access-of-O_PATH-and-mode-3-is-u"
args = ["-n", "-P", "-a", "-d", "^mem", "-p", "{Q}"]

[[case]]
name = "access-of-O_PATH-and-mode-3-in-the-a-field"
args = ["-n", "-P", "-Ffa", "-a", "-d", "^mem", "-p", "{Q}"]

[[case]]
# `+f g`: a FILE-FLAG column after TYPE, the flags named from `Pff_tab[]` in
# its order. lsof-rs refused the option.
name = "fflags-by-name"
args = ["-n", "-P", "+fg", "-a", "-d", "^mem", "-p", "{Q}"]

[[case]]
# `+f G`: the same column in hex, with the empty `;0x0` of the per-open flags.
name = "fflags-in-hex"
args = ["-n", "-P", "+fG", "-a", "-d", "^mem", "-p", "{Q}"]

[[case]]
# The letters may be the next word...
name = "fflags-letters-as-the-next-word"
args = ["-n", "-P", "+f", "g", "-a", "-d", "^mem", "-p", "{Q}"]

[[case]]
# ...and the last of `g` and `G` decides.
name = "fflags-the-last-letter-decides"
args = ["-n", "-P", "+fGg", "-a", "-d", "^mem", "-p", "{Q}"]

[[case]]
# `-F` shows the flags in hex; a `+f g` after it asks for names in the field...
name = "fflags-by-name-in-the-G-field"
args = ["-n", "-P", "-F", "+fg", "-a", "-d", "^mem", "-p", "{Q}"]

[[case]]
# ...and a `-F` after `+f g` asks for hex again...
name = "fflags-dash-F-after-names-is-hex"
args = ["-n", "-P", "+fg", "-F", "-a", "-d", "^mem", "-p", "{Q}"]

[[case]]
# ...and `-f G` after `-F` hides them: no `G` field at all.
name = "fflags-dash-f-letters-hide-them"
args = ["-n", "-P", "-F", "-fG", "-a", "-d", "^mem", "-p", "{Q}"]

[[case]]
# Linux compiles the other file-structure letters out: fatal, exit 1.
name = "fflags-unknown-letter-is-fatal"
args = ["-n", "-P", "+fgx", "-p", "{Q}"]

# ------------------------------------------- the raw device number (DIVERGENCES 47)
# Fixture V holds device nodes of four majors. The C prints `r0x<hex>` for a
# character or block special only, and leaves `r` out of the default set.

[[case]]
# `r` on every device row and no other, after `D`. lsof-rs printed none.
name = "fields-raw-device-on-device-nodes"
args = ["-n", "-P", "-FfrDt", "-a", "-p", "{V}"]

[[case]]
# A bare `-F` leaves the raw device number out, "for compatibility"...
name = "fields-default-set-leaves-raw-device-out"
args = ["-n", "-P", "-F", "-a", "-d", "^mem", "-p", "{V}"]

[[case]]
# ...and `-F -Fr` is the default set with it.
name = "fields-default-set-plus-raw-device"
args = ["-n", "-P", "-F", "-Fr", "-a", "-d", "^mem", "-p", "{V}"]

[[case]]
# The same rows as a table: DEVICE is the major and minor the node names.
name = "devices-table"
args = ["-n", "-P", "-a", "-d", "^mem", "-p", "{V}"]

# ------------------------------------------------ link counts (DIVERGENCES 41, 42)
# Fixture N holds a deleted file (no links), a file with one name and one with
# two, a socket pair and a pipe. `+L` shows the NLINK column and `-L` hides it,
# and `+L n` selects a file whose link count `stat` recorded and found below n,
# which a socket never has: the C hands it to `process_proc_sock()` first.

[[case]]
# `-L` is the default, no column. lsof-rs had read it as "show".
name = "links-dash-L-hides-the-column"
args = ["-n", "-P", "-L", "-a", "-d", "^mem", "-p", "{N}"]

[[case]]
# `+L` alone shows it, blank on the socket rows. lsof-rs refused a bare `+L`.
name = "links-plus-L-shows-the-column"
args = ["-n", "-P", "+L", "-a", "-d", "^mem", "-p", "{N}"]

[[case]]
# `+L1` is the deleted file alone. lsof-rs added both sockets of the pair,
# whose count it never read.
name = "links-plus-L1-is-the-deleted-file"
args = ["-n", "-P", "+L1", "-a", "-p", "{N}"]

[[case]]
# The count as its own word: the one-name files, the pipe and stdio, and still
# no socket however high the count goes.
name = "links-plus-L-count-as-the-next-word"
args = ["-n", "-P", "+L", "2", "-a", "-d", "^mem", "-p", "{N}"]

[[case]]
# The letters after the count are options again, so `+L1a` is `+L1 -a`.
name = "links-plus-L-count-then-options"
args = ["-n", "-P", "+L1a", "-p", "{N}"]

[[case]]
# Only `+` takes a count: exit 1, and nothing on stdout.
name = "links-dash-L-refuses-a-count"
args = ["-n", "-P", "-L", "1", "-p", "{N}"]

[[case]]
# A count-less `-L` after `+L1` sets the count to 0 and keeps the selection,
# so it selects nothing at all: no output, and exit 0, as N was found.
name = "links-count-less-dash-L-selects-nothing"
args = ["-n", "-P", "+L1", "-L", "-a", "-p", "{N}"]

[[case]]
# The count through `-F k`, which prints only a count that was recorded.
name = "links-fields-k"
args = ["-n", "-P", "+L3", "-Ffkn", "-a", "-d", "^mem", "-p", "{N}"]

[[case]]
# `-t` has to read the files when a file selecter needs them. It skipped them
# unless `-i`, `-d`, a path or `-s` was given, so `-t +L1` printed no PID at
# all where the C prints N's.
name = "links-terse-reads-the-files"
args = ["-t", "+L1", "-a", "-p", "{N}"]

[[case]]
# ...and `-U` is a file selecter too: `-t -U` printed nothing either.
name = "terse-dash-U-reads-the-files"
args = ["-t", "-U", "-a", "-p", "{B}"]

[[case]]
# A `+` word is a cluster, as a `-` word is, and `a` means the same under either
# prefix: `+wa` is `+w -a`, so this is fd 3 alone. lsof-rs read one letter per
# `+` word and dropped the rest, and ORed.
name = "plus-word-is-a-cluster"
args = ["-n", "-P", "+wa", "-d", "3", "-p", "{A}"]

# ------------------------------------- optional values as the next word (DIVERGENCES 43)
# The C's GetOpt offers every option whose rule letter carries `:` the next
# word as its value, and each such option gives back a word that opens an
# option. lsof-rs honoured that for `-i`, `-s`, `-g`, `-K`, `-Z`, `-T` and
# `-o`, and not for `-F`, `-L`, `-f`, `-r` or `-x`. (`-r` never exits, so its
# spellings are pinned by unit tests instead.)

[[case]]
# `-F pfn`, the list as its own word. lsof-rs looked for a file called `pfn`.
name = "fields-list-as-the-next-word"
args = ["-n", "-P", "-F", "pfn", "-a", "-d", "3", "-p", "{A}"]

[[case]]
# Every `-F` adds to one choice, as the C's `FieldSel[].st` flags do: this is
# `p`, `f` and `n`, where lsof-rs kept the last `-F` alone.
name = "fields-accumulate-across-options"
args = ["-n", "-P", "-Fp", "-Ff", "-Fn", "-a", "-d", "3", "-p", "{A}"]

[[case]]
# A `0` anywhere keeps NUL terminators, and a bare or `0`-only `-F` anywhere
# keeps the default set.
name = "fields-nul-then-letters-keeps-the-default-set"
args = ["-n", "-P", "-F0", "-Fn", "-a", "-d", "3", "-p", "{A}"]

[[case]]
# `T`'s side effect (the TCP state and queues) belongs to the `-F` that names
# it: `-T q` after `-FT` narrows it to the queues, and a later `-Fn` must not
# widen it back. Measured: queues only, no `TST=`.
name = "fields-T-effect-belongs-to-its-own-dash-F"
args = ["-n", "-P", "-FT", "-Tq", "-Fn", "-a", "-i", "-p", "{B}"]

[[case]]
# `00` is two terminators and no letter: `p` alone, NUL-terminated. lsof-rs
# read an empty letter list as the default set.
name = "fields-zero-zero-is-the-pid-alone"
args = ["-n", "-P", "-F00", "-a", "-d", "3", "-p", "{A}"]

[[case]]
# A letter the C's table lacks is fatal: exit 1, nothing on stdout. lsof-rs
# printed `-Fpx` as `-Fp`.
name = "fields-unknown-letter-is-fatal"
args = ["-n", "-P", "-Fpx", "-p", "{A}"]

[[case]]
# `-F ?` lists the letters, on stderr, and exits 0.
name = "fields-help"
args = ["-F", "?"]

[[case]]
# `-f` reads the next word too, and `/` is no file-structure letter: the C's
# error, not a bare `-f` and a file name.
name = "opt-f-value-as-the-next-word"
args = ["-n", "-P", "-f", "{FILE}"]

[[case]]
# `-x f`, the file-system half, with its letter as its own word. lsof-rs took
# a bare `-x` and then failed to stat a file called `f`. `{ASUB}` and not
# `{ADIR}`: `sub` is empty and A holds it, so every search item is located and
# the C exits 0. Under `{ADIR}` nobody holds `xdir`, the C exits 1, and so did
# the port that read `f` as a file, for its own reason: the case could not
# fail (the mutation sweep found it).
name = "opt-x-letters-as-the-next-word"
args = ["-n", "-P", "-a", "-d", "^mem", "+d", "{ASUB}", "-x", "f", "-p", "{A}"]

[[case]]
# ...and a word of the wrong letters is the C's error.
name = "opt-x-word-of-unknown-letters-is-fatal"
args = ["-n", "-P", "+d", "{ADIR}", "-x", "{ADIR}", "-p", "{A}"]

# ------------------------------------------------- the -V report (DIVERGENCES 52-54)
# `vord/` holds `a`, `b` and `sub/c`, which nothing has open, so each is a
# search item `-V` reports. The C PREPENDS each one to the list it reports
# from (`ck_file_arg()`), and expands `+d`/`+D` as it parses, before any bare
# path: so bare paths come last given first, then each expansion backwards,
# its entries before the directory, the latest option first. lsof-rs had
# reported them in the order given.

[[case]]
name = "verbose-files-last-given-first"
cwd = "{RDIR}"
args = ["-V", "vord/a", "vord/b", "vord/sub/c"]

[[case]]
# The entries in reverse readdir order, then `vord` itself.
name = "verbose-plus-d-entries-backwards-then-the-directory"
cwd = "{RDIR}"
args = ["-V", "+d", "vord"]

[[case]]
# `+D` walks as a stack (the last subdirectory found is read first); the
# report is that walk backwards.
name = "verbose-plus-D-the-walk-backwards"
cwd = "{RDIR}"
args = ["-V", "+D", "vord"]

[[case]]
# The bare paths first, though given after `+d`: the C entered `+d`'s items
# while it parsed. `vord/a` is an item twice, and reported twice.
name = "verbose-plus-d-is-entered-before-the-bare-paths"
cwd = "{RDIR}"
args = ["-V", "+d", "vord", "rel/y", "vord/a"]

[[case]]
name = "verbose-the-latest-plus-d-first"
cwd = "{RDIR}"
args = ["-V", "+d", "vord", "+d", "vord/sub"]

[[case]]
# `-Q` changes only the exit status (`FsearchErr`): the lines still print,
# and the run exits 0. lsof-rs had muted them (DIVERGENCES 53).
name = "verbose-under-minus-q-still-reports"
cwd = "{RDIR}"
args = ["-V", "-Q", "vord/b", "vord/a"]

[[case]]
name = "verbose-under-minus-q-a-pid-too"
args = ["-V", "-Q", "-p", "999999999"]

# (DIVERGENCES 54, no report under `-r`, needs a signal to end the run, which
# a case cannot send; lsof-cli/tests/arguments.rs pins it.)

# ---------------------------------------------- bounded calls: -b, -S, -O
# The C's `statsafely()`, `lstatsafely()` and `Readlink()`, and the options
# that govern them (DIVERGENCES 94). `-S`'s value is `-o`'s shape: only
# leading digits, the next word when it opens with one, 15 when there is
# none; below 2 it is raised to 2 with a warning printed while the options
# are read, which neither -w nor -t mutes. stderr is compared wherever the
# case alone fixes the C's; under -b without -w the C names every mount it
# avoids, so those cases follow the host's table, the same for both.

[[case]]
name = "opt-S-alone-is-the-default"
args = ["-S", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
name = "opt-S-seconds-as-the-next-word"
args = ["-S", "2", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
name = "opt-S-seconds-attached"
args = ["-S2", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
name = "opt-plus-S-is-dash-S"
args = ["+S", "7", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
# A bare -S after a value is the default again; the last one wins.
name = "opt-S-the-last-wins"
args = ["-S", "3", "-S", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
name = "opt-S-zero-warns"
args = ["-S", "0", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
name = "opt-S-one-warns-under-w"
args = ["-w", "-S", "1", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
name = "opt-S-warns-under-t"
args = ["-t", "-S", "0", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
name = "opt-S-warns-once-per-option"
args = ["-S", "1", "-S", "0", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
# The C stops at INT_MAX's own spelling without a wrap: 2147483647 seconds.
name = "opt-S-int-max-is-taken"
args = ["-S", "2147483647", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
# What follows the digits is option letters again, under the same prefix.
name = "opt-S-digits-then-terse"
args = ["-S", "3t", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
name = "opt-S-attached-digits-then-terse"
args = ["-S3t", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
# Attached, a letter is an option: `-x` with no +d, a usage error. stdout and
# the status alone: the usage text is lsof-rs's own (DIVERGENCES 114). The
# parse is pinned by args.rs, dash_s_upper_takes_its_seconds_as_the_c_does.
name = "opt-S-attached-letter-is-an-option"
args = ["-Sx", "-p", "{A}"]

[[case]]
# Before a word with no digits -S is bare, and the word is a name: here
# the last argument, so no option comes after it (DIVERGENCES 12).
name = "opt-S-word-without-digits-is-a-name"
args = ["-n", "-P", "-a", "-d", "cwd", "-p", "{A}", "-S", "{NOPE}"]
with_stderr = true

[[case]]
name = "opt-S-before-double-dash"
args = ["-S", "--", "{NOPE}"]
with_stderr = true

[[case]]
# `-1` opens an option, so it is no value, and `1` is no option letter. The
# parse is pinned by args.rs, dash_s_upper_takes_its_seconds_as_the_c_does.
name = "opt-S-minus-one-is-no-value"
args = ["-S", "-1", "-p", "{A}"]

[[case]]
# The warning comes out while the options are read, before the error; the
# order is pinned by tests/arguments.rs, what_the_parse_says_comes_in_the_cs_order
# (the usage after it is lsof-rs's own).
name = "opt-S-zero-then-a-letter"
args = ["-S", "0x", "-p", "{A}"]

[[case]]
# LEDGERED (C-DEFECT, DIVERGENCES 121): the C sums the digits in an int,
# so 4294967295 is -1 and warns `(-1) changed to 2`; lsof-rs stops at
# INT_MAX and says nothing.
name = "opt-S-wraps-negative-in-the-c"
args = ["-S", "4294967295", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
# LEDGERED (C-DEFECT, DIVERGENCES 121): ...and 4294967297 is 1.
name = "opt-S-wraps-to-one-in-the-c"
args = ["-S", "4294967297", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
# Twenty digits: the C's sum wraps to 1661992959, no warning; lsof-rs's stops
# at INT_MAX, no warning, and computes no deadline that could overflow.
name = "opt-S-twenty-digits-run-as-any-other"
args = ["-S", "99999999999999999999", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
# -b and -w: no call, nothing said, the listing unchanged.
name = "opt-b-under-w-lists-as-without"
args = ["-b", "-w", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
name = "opt-plus-b-is-dash-b"
args = ["+b", "-w", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
# -t sets the C's Fwarn, which mutes -b's lines too.
name = "opt-b-under-t-says-nothing"
args = ["-b", "-t", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
# LEDGERED (DEBT, DIVERGENCES 110 next): per mount the C says
# `avoiding readlink(DIR)`, `avoiding stat(DIR)` and the two lines of its
# `can't stat()` warning; lsof-rs reads no mount directory's link yet and
# has no such warning (87), so it says `avoiding stat(DIR)` alone.
name = "opt-b-names-every-mount-it-avoids"
args = ["-b", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
# A path argument under -b is a status error that -w does not mute.
name = "opt-b-path-argument-is-a-status-error"
args = ["-b", "-w", "{FILE}"]
with_stderr = true

[[case]]
# Under -b the table is empty, so a mount point is no file system.
name = "opt-b-mount-point-is-no-file-system"
args = ["-b", "-w", "/"]
with_stderr = true

[[case]]
# LEDGERED (DEBT, DIVERGENCES 110 next): the C reads the argument's links
# (`avoiding readlink(ARG)`) before it reads its table, lsof-rs after.
name = "opt-b-path-argument-says-what-it-avoided"
args = ["-b", "{FILE}"]
with_stderr = true

[[case]]
# -b beats -O, in either order.
name = "opt-b-beats-O"
args = ["-bO", "-w", "{FILE}"]
with_stderr = true

[[case]]
name = "opt-O-then-b-avoids"
args = ["-Ob", "-w", "{FILE}"]
with_stderr = true

[[case]]
# A +d after -b is fatal: its directory cannot be stat()ed. Its lines and
# their order are pinned by tests/arguments.rs,
# what_the_parse_says_comes_in_the_cs_order, and args.rs,
# a_plus_d_is_examined_under_the_options_before_it.
name = "opt-b-before-plus-d-ends-the-run"
args = ["-b", "-w", "+d", "{ADIR}"]

[[case]]
# ...and a -b after it changes nothing for it, nor for the mount table the
# C reads there: nothing is said.
name = "opt-plus-d-before-b-is-not-avoided"
args = ["+d", "{ADIR}", "-b", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
# With nothing in its table the C checks no -e: `-b -e /nosuch` runs.
name = "opt-b-e-is-not-checked-against-an-empty-table"
args = ["-b", "-w", "-e", "/nosuch", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
# LEDGERED (DEBT, DIVERGENCES 110 next): the C enters an -e mount without
# stat()ing it, so under -b its table holds /dev/shm and it checks /nosuch;
# lsof-rs stat()s every mount, so its table is empty and it checks nothing.
name = "opt-b-e-mounted-and-not"
args = ["-b", "-w", "-e", "{SHMMNT}", "-e", "/nosuch", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]

[[case]]
name = "opt-b-i-alone-under-w"
args = ["-b", "-w", "-n", "-P", "-i", "TCP@127.0.0.1:{PORT}"]
with_stderr = true

[[case]]
# LEDGERED (DEBT, DIVERGENCES 110 next): under -i alone the C reads no
# mount table, so -b has nothing to avoid; lsof-rs reads it.
name = "opt-b-i-alone-reads-no-mount-table"
args = ["-b", "-n", "-P", "-i", "TCP@127.0.0.1:{PORT}"]
with_stderr = true

[[case]]
# LEDGERED (DEBT, DIVERGENCES 110 next): under -i alone the C reads no
# mount table and so starts no child; lsof-rs reads it, through a helper
# whose pipes a limit of seven descriptors leaves no room for: `can't open
# pipes`, exit 1, where the C lists.
name = "opt-i-alone-under-a-descriptor-limit"
args = ["-n", "-P", "-i", "TCP@127.0.0.1:{PORT}"]
env = { LSOF_DIFF_NOFILE = "7" }
with_stderr = true

[[case]]
# -O: the calls in lsof itself. The same listing on a file system that
# answers, as lsof-rs gave before item 94, when -O was a no-op: where the
# call is made is pinned by lsof-core's safefs.rs,
# the_options_choose_where_a_call_is_made, and the spellings by args.rs,
# dash_b_and_dash_o_upper_set_the_mode_as_the_c_does.
name = "opt-O-makes-the-calls-in-lsof"
args = ["-O", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
# As the case above, and pinned by the same tests.
name = "opt-plus-O-undoes-dash-O"
args = ["-O", "+O", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
with_stderr = true

[[case]]
# As the cases above, and pinned by the same tests.
name = "opt-O-path-argument"
args = ["-O", "-n", "-P", "{FILE}"]
with_stderr = true

[[case]]
# LEDGERED (C-DEFECT, DIVERGENCES 89): the C reads links in its child, so
# `/proc/self` is the child and this is a status error on its pipe. lsof-rs
# reads them in a helper too since DIVERGENCES 94, and the helper names
# lsof's `/proc/PID` for its own: lsof's stdin, which the runner makes
# /dev/null, which is A's fd 0.
name = "path-proc-self-is-lsof-in-lsof-rs"
args = ["-n", "-P", "-a", "-p", "{A}", "-d", "0", "/proc/self/fd/0"]

[[case]]
# LEDGERED (C-DEFECT, DIVERGENCES 89): the same through `/dev/stdin`, a link
# to `/proc/self/fd/0` that `Readlink()` reads as typed.
name = "path-dev-stdin-is-lsof-in-lsof-rs"
args = ["-n", "-P", "-a", "-p", "{A}", "-d", "0", "/dev/stdin"]

[[case]]
# LEDGERED (C-DEFECT, DIVERGENCES 89): the same spelt `/proc//self`, which
# the helper had read as its own (item 94's review); every other spelling is
# tests/arguments.rs, a_path_through_proc_self_is_lsof_however_it_is_spelt.
name = "path-proc-doubled-slash-self-is-lsof-in-lsof-rs"
args = ["-n", "-P", "-a", "-p", "{A}", "-d", "0", "/proc//self/fd/0"]

# ------------------------------------------------- bounded calls: fixture FH
# A FUSE root that does not answer `stat` (fuse_hang.py), mounted at {FUSE}
# in a mount namespace of each run's own. Only what the C finishes: under
# `--mode hold` it hangs wherever it stat()s the root (its child waits and
# its alarm cannot end that, DIVERGENCES 118), so the hold cases are those
# it never stat()s it in; `--mode delay` answers after a delay, which the C
# does finish. LSOF_DIFF_FUSE is the server's mode.

[[case]]
name = "fh-hold-b-under-w"
args = ["-b", "-w", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
env = { LSOF_DIFF_FUSE = "--mode hold" }
with_stderr = true

[[case]]
name = "fh-hold-b-path-argument"
args = ["-b", "-w", "{FUSE}"]
env = { LSOF_DIFF_FUSE = "--mode hold" }
with_stderr = true

[[case]]
# The usage after it is lsof-rs's own; the lines before it are pinned by
# tests/arguments.rs, what_the_parse_says_comes_in_the_cs_order.
name = "fh-hold-b-plus-D-ends-the-run"
args = ["-b", "-w", "+D", "{FUSE}"]
env = { LSOF_DIFF_FUSE = "--mode hold" }

[[case]]
# The C reads no table under -i alone; lsof-rs gives the hung mount its
# two seconds and drops it. The same sockets, and nothing said.
name = "fh-hold-i-alone"
args = ["-S", "2", "-n", "-P", "-i", "TCP@127.0.0.1:{PORT}"]
env = { LSOF_DIFF_FUSE = "--mode hold" }
with_stderr = true
timeout = 30

[[case]]
# LEDGERED (DEBT, DIVERGENCES 110 next): the C never stat()s an -e mount;
# lsof-rs stat()s it, drops it when it times out, and then refuses the -e.
name = "fh-hold-e-mount-is-never-stated-in-the-c"
args = ["-S", "2", "-e", "{FUSE}", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
env = { LSOF_DIFF_FUSE = "--mode hold" }
with_stderr = true
timeout = 30

[[case]]
# The mount's stat outlives -S 2: the C gives up when it returns, lsof-rs
# at two seconds; under -w both say nothing and list the rest.
name = "fh-delay-S2-under-w"
args = ["-w", "-S", "2", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
env = { LSOF_DIFF_FUSE = "--mode delay --delay 3" }
with_stderr = true
timeout = 30

[[case]]
# LEDGERED (DEBT, DIVERGENCES 110 next): the C warns `can't stat() fuse.hang
# file system DIR` and `Output information may be incomplete.` (87).
name = "fh-delay-S2-warns-in-the-c"
args = ["-S", "2", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
env = { LSOF_DIFF_FUSE = "--mode delay --delay 3" }
with_stderr = true
timeout = 30

[[case]]
# An answer within the limit is taken, and nothing is said.
name = "fh-delay-answers-in-time"
args = ["-S", "3", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
env = { LSOF_DIFF_FUSE = "--mode delay --delay 1" }
with_stderr = true
timeout = 30

[[case]]
# The mount's stat answered, the argument's timed out: `Connection timed
# out`, which -w does not mute either.
name = "fh-delay-path-argument-times-out"
args = ["-S", "2", "{FUSE}/."]
env = { LSOF_DIFF_FUSE = "--mode delay --delay 3 --answer-first 1" }
with_stderr = true
timeout = 30

[[case]]
# A +D whose directory times out ends the run. stdout and the status alone:
# the usage after the warning is lsof-rs's own. Where the directory never
# answers, tests/bounded_calls.rs pins the warning.
name = "fh-delay-plus-D-times-out"
args = ["-S", "2", "+D", "{FUSE}"]
env = { LSOF_DIFF_FUSE = "--mode delay --delay 3" }
timeout = 30

[[case]]
# A +D over the mount point's parent: the table's stat of the mount is
# answered, the walk's lstat of it outlives -S 2, and both say `can't
# lstat(...)` in the C's words and walk on; nothing there is open.
name = "fh-delay-plus-D-walk-times-out"
args = ["-S", "2", "+D", "{FUSEDIR}"]
env = { LSOF_DIFF_FUSE = "--mode delay --delay 3 --answer-first 1" }
with_stderr = true
timeout = 30

[[case]]
# LEDGERED (C-DEFECT, DIVERGENCES 118): after its first timeout the C's
# SIGALRM stays blocked, so the argument's stat is waited out and succeeds;
# lsof-rs bounds it too, and says `Connection timed out`.
name = "fh-delay-second-stat-unbounded-in-the-c"
args = ["-w", "-S", "2", "{FUSE}/."]
env = { LSOF_DIFF_FUSE = "--mode delay --delay 3" }
with_stderr = true
timeout = 30

[[case]]
# -O waits for the file system, in both, as lsof-rs did before item 94; the
# limit -O ignores is pinned by tests/bounded_calls.rs,
# an_answer_in_time_is_taken_and_dash_o_has_no_limit.
name = "fh-delay-O-waits"
args = ["-O", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
env = { LSOF_DIFF_FUSE = "--mode delay --delay 3" }
with_stderr = true
timeout = 30

[[case]]
# LEDGERED (C-DEFECT, DIVERGENCES 119): under -O the C's alarm cannot end
# the wait, and when the stat returns its handler longjmps to a jmp_buf no
# setjmp filled: SIGSEGV, exit 139. lsof-rs waits and lists.
name = "fh-delay-O-crashes-in-the-c"
args = ["-O", "-S", "2", "-n", "-P", "-a", "-d", "cwd", "-p", "{A}"]
env = { LSOF_DIFF_FUSE = "--mode delay --delay 3" }
with_stderr = true
timeout = 30

[[case]]
# LEDGERED (C-DEFECT, DIVERGENCES 120): a timed-out readlink is a one-byte
# link to the C, read from a buffer nothing filled, and the argument becomes
# another path; lsof-rs keeps the component, and the stat of it times out.
name = "fh-delay-readlink-timeout-in-the-c"
args = ["-V", "-S", "2", "{FUSE}/lnk"]
env = { LSOF_DIFF_FUSE = "--mode delay --delay 3 --symlink lnk=/etc --hang-op readlink" }
with_stderr = true
timeout = 30

# ------------------------------------------------------------- exit contract

[[case]]
# No such process: both print nothing and exit 1. Exit-code fidelity was a real
# lsof-rs bug once (LESSONS #4); the kit runner diffs the code, not just stdout.
name = "no-match-exit-code"
args = ["-n", "-P", "-a", "-p", "999999999"]
