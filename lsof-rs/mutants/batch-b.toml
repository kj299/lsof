# Mutants for Batch B (2026-11-01): DIVERGENCES 83 (every error the C's
# option loop finds is printed and the parse reads on after it; the two the
# C's `Error()` ends the run at are fatal, with no usage) and 82 (a `+d`/`+D`
# is walked where its option stands, its warnings among the parse's lines).
# One per rule, each a plausible way to get it wrong. The kill table is this
# file, run (porting-kit LESSONS #083):
#
#   cd lsof-rs && python3 ../porting-kit/harnesses/port-mutation/mutate_port.py --first-kill mutants/batch-b.toml
#
# It needs the C oracle built at ../lsof (README: Building) and root, or
# passwordless sudo, for the differential's fixtures (fixture MT's `{MTWL}`
# for the walk's cases). CI runs only --apply-only.
#
# Rules with no mutant here:
# * Row 85 (the mount table's first row per directory): resolved by item 110,
#   whose mutants are mounts.toml's.
# * `-T`'s and `-f`'s letters each named: the same `early.letter` arm as
#   `-x`'s, which `cross-over-first-letter-only` breaks; the unit test names
#   each of `-f qz` and `-x qz`.
# * A `-s` list that ends in a comma: no plausible one-line way back to the
#   old `split(',')` reading; pinned by `every_error_the_c_reads_past_is_read_past`
#   and the differential's `dash-s-list-ending-in-a-comma`.
#
# Run 2026-11-01, as root, --first-kill: 22 of 23 KILLED (20 by the unit gate,
# `fatal-prints-the-usage` and `walked-entries-dropped` by the differential).
# The survivor, `walk-at-the-parse-ignores-dash-w` as first written (the
# parse's walk viewed through `fs.with(dir.blocking, true)`), was equivalent:
# the walk asks `dir.warn` itself before each warning, and under `-b`, the one
# case where the layer's own flag speaks, `enter_dir()` refuses the directory
# before any walk. It was replaced by the mutant below, which breaks the
# `-w` the walk is given, and rerun alone: KILLED.
#
# Run again in full 2026-11-01, after the reviews' fixes (the section at the
# end), as root, --first-kill: 34 of 34 KILLED, 32 by the unit gate and
# `fatal-prints-the-usage` and `walked-entries-dropped` by the differential.
# Not here: a mutant on the Windows `-g` message, which a Linux gate cannot
# reach; the unit case expects `illegal -g ppid:` under cfg!(windows).

[run]
dir = ".."
build = [["cargo", "build", "--release", "--bin", "lsof"]]

[[run.gate]]
name = "unit"
cmd = ["cargo", "test", "-p", "lsof-core", "-p", "lsof-cli", "-p", "lsof-backend-linux"]
timeout = 1200

[[run.gate]]
name = "differential"
cmd = ["unshare", "-m", "--propagation", "private", "python3", "differential/linux_diff.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]
timeout = 2400

# -------------------------------------------------------------------- 83

[[mutant]]
name = "plus-d-refusal-ends-the-parse"
rule = "a +d/+D the C refuses is an error the parse reads on after (83)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''                        Err(e) => {
                            early.fail(&e);
                            j = chars.len();
                            continue;
                        }'''
new = '''                        Err(e) => return Err(e),'''

[[mutant]]
name = "plus-c-value-not-given-back"
rule = "+c gives a value with no width back, to be read again (83)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''                            if attached {
                                j += 1;
                            } else {
                                i = i.saturating_sub(1);
                                j = chars.len();
                            }'''
new = '''                            let _ = attached;
                            j = chars.len();'''

