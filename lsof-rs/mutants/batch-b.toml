# ------------------------------------------------- the reviews' findings (83)
# Added 2026-11-01 for the safety and fidelity reviews: the bound inside one
# word, a spill that empties the store, constant-time ID entry, four read-on
# decisions no test had pinned, the ByName UID conflict's fatality, and the
# `-s UDP:` term loop.

