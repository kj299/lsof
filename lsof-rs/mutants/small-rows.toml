# Mutants for the smaller Linux rows (2026-11-02): DIVERGENCES 56 (-E/+E
# name a pipe's and a local connection's other ends, and the C reads every
# process under them), 70 (login names by glibc's `files` rules, 32 bytes,
# re-read under -r), 72 (a zombie leader's tasks locate -p/-g/-u under -K
# -a), 92 (a path argument that is not UTF-8 is a path) and 126 (an O_PATH
# descriptor on a socket file is `sock`, `0t0`, `can't identify protocol`).
# One per rule. The kill table is this file, run (porting-kit LESSONS #083):
#
#   cd lsof-rs && python3 ../porting-kit/harnesses/port-mutation/mutate_port.py --first-kill mutants/small-rows.toml
#
# It needs the C oracle built at ../lsof (README: Building) and root, or
# passwordless sudo: fixture W and the differential's LSOF_DIFF_MT=passwd
# mode bind a password file over /etc/passwd in a mount namespace of each
# run's own. CI runs only --apply-only.
#
# Run 2026-11-02 as root with --first-kill, after the reviews' fixes, in
# three batches (--only; one run of all 72 outlived the session's 2-hour
# limit): 71 of 71 killed, 66 by the unit gate and 5 by the differential
# alone (zombie-leader-tasks-not-entered, endpoints-not-left-to-the-core,
# gather-scoped-under-E, raw-comm-dropped, fields-before-login-dropped).
# One mutant, zombie-tasks-listed, was found EQUIVALENT and is recorded
# below instead. Mutants of other files re-anchored on the code this batch
# changed (batch-a unknown-login-no-error; batch-b e-value-given-back and
# long-login-ends-the-list; inet-grammar c-length-not-flags-2 and
# u-long-name-utf8-raw; json-schema base-name-keeps-the-joining-space;
# row124 sockets-only-per-run, sockets-only-for-a-selected-process and
# sockets-only-under-endpoints; and, before the reviews, batch-b
# e-value-given-back, mapped-rows exempt-relative-accepted and
# unidentified-socket-device-as-d, path-identity
# an-unresolved-socket-is-a-file, safefs path-argument-readlink-unbounded)
# were rerun alone: all killed. vopt.toml, whose letters this batch reads
# as bytes now, was rerun whole: 19 of 19 killed.
#
# Rules with no mutant here, each pinned elsewhere:
# * The `can't stat(/etc/passwd)` of a -r cycle (main.rs, 70): pinned since
#   the review by `repeat-ends-where-passwd-cannot-be-stated*` (the
#   differential's `LSOF_DIFF_MT=noetc`) and the unit tests below.
# * The -r re-read itself (users.rs `new_cycle`): pinned by the unit test
#   `a_new_cycle_forgets_the_snapshot_and_keeps_found_names` (mutant
#   new-cycle-keeps-names below) and measured by hand against the C.
# * The O_PATH socket row's access letter from `info.access()` rather than
#   the `lstat`'s, and its `(lstat: …)` addition (files.rs, 126): EQUIVALENT
#   outside a race. The row is made only where the `stat` succeeded, and the
#   `lstat` is made only with an NFS mount listed; an `lstat` that fails
#   where the `stat` of the same link then succeeds is a file replaced in
#   between, under NFS. No gate can hold that instant, so no mutant here.
# * A zombie leader's tasks entered with `unlisted = false` (backend.rs,
#   72; the safety review's B3): EQUIVALENT. That branch is reached only
#   for a leader the process selecters leave out (`restrict`), and its tasks
#   carry the leader's PID, owner, group and command, so they fail
#   `proc_selected` as it did (the task kind is no `SelKinds::PROC`): a task
#   with no row is never a bare line either way. What `unlisted` adds is
#   that the gather reads no fd table for them, which the unit test
#   `dash_k_and_a_reads_only_the_selected_tasks` asserts whenever the host
#   has such a zombie (it is not a mutant gate: no host is sure to have one).
# * The `-r` runs that never end (`-t`, `-l`, `-J` with no row, under a
#   missing /etc/passwd): the differential runs each case to its end, so
#   they are pinned by the unit test `a_login_is_looked_up_where_one_is_printed`
#   (mutants logins-looked-up-under-t and logins-looked-up-for-empty-json),
#   and the ones that end by `repeat-ends-where-passwd-cannot-be-stated*`.

[run]
dir = ".."
build = [["cargo", "build", "--release", "--bin", "lsof"]]

[[run.gate]]
name = "unit"
cmd = ["cargo", "test", "-p", "lsof-core", "-p", "lsof-cli", "-p", "lsof-backend-linux"]
timeout = 1200

[[run.gate]]
name = "differential"
cmd = ["unshare", "-m", "--propagation", "private", "python3", "differential/linux_diff.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]
timeout = 2400

