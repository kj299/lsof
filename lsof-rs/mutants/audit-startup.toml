[[mutant.edit]]
file = "crates/lsof-backend-linux/src/mounts.rs"
old = '''    readable(path).map_err(|e| access(&e))?;'''
new = '''    let _ = readable;'''

[[mutant]]
name = "supplement-access-always-passes"
rule = "access() is asked, of the path (172)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/mounts.rs"
old = '''    rustix::fs::access(path, rustix::fs::Access::READ_OK).map_err(std::io::Error::from)'''
new = '''    let _ = path;
    Ok(())'''

[[mutant]]
name = "supplement-asked-of-the-effective-user"
rule = "the question is access(2)'s, the real user's rights, not an open's (172)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/mounts.rs"
old = '''    rustix::fs::access(path, rustix::fs::Access::READ_OK).map_err(std::io::Error::from)'''
new = '''    std::fs::File::open(path).map(drop)'''

[[mutant]]
name = "supplement-stat-failure-called-access"
rule = "past access(), a file that is not there is `can't open` (172)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/mounts.rs"
old = '''    let meta = std::fs::metadata(path).map_err(|e| open(&e))?;'''
new = '''    let meta = std::fs::metadata(path).map_err(|e| access(&e))?;'''

