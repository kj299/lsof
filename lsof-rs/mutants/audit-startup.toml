new = '''        if close_listed(sys, low) || sys.close_from(low) {'''

[[mutant]]
name = "no-listing-fallback"
rule = "without close_range(), the descriptors /proc/self/fd lists are closed (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''        if sys.close_from(low) || close_listed(sys, low) {'''
new = '''        if sys.close_from(low) {'''

[[mutant]]
name = "no-sweep-fallback"
rule = "with neither, every number from 3 up to 1,048,576 is closed (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''        sweep(sys, low, SWEEP_MAX);'''
new = '''        let _ = (&sys, low);'''

[[mutant]]
name = "sweep-stops-at-the-soft-limit"
rule = "the sweep runs past a lowered soft limit, whatever it is (170; the review's LOW-3)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''        sweep(sys, low, SWEEP_MAX);'''
new = '''        sweep(sys, low, 1024);'''

[[mutant]]
name = "sweep-bound-raised"
rule = "the sweep closes the numbers below 1,048,576 and no more (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
