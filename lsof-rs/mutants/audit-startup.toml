old = '''        sys.close(dir);
        true'''
new = '''        true'''

[[mutant]]
name = "listing-read-once"
rule = "the walk reads the directory to its end (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''            listed(records, &mut |fd| {
                if fd >= low && fd != dir {
                    sys.close(fd);
                }
            });
        }'''
new = '''            listed(records, &mut |fd| {
                if fd >= low && fd != dir {
                    sys.close(fd);
                }
