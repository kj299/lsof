# Mutants for the start-up and options audit (2026-11-21): DIVERGENCES 170
# (every descriptor from 3 up closed as lsof starts), 171 (/dev/null on a
# closed 0, 1 or 2, and a silent exit 1 without it), 172 (`+m m` asked of
# access(2) first), 173 (the -d mixture's item cut at 254 bytes), 174 (a
# letter of several bytes a line a byte) and 175 (no /proc: the mount
# table's line, not `can't fork`). One per rule, bound and branch the fixes
# added, each a plausible way to get it wrong. The kill table is this file,
# run (porting-kit LESSONS #083):
#
#   cd lsof-rs && python3 ../porting-kit/harnesses/port-mutation/mutate_port.py --first-kill mutants/audit-startup.toml
#
# It needs root (or a user who may make a user namespace), `setpriv` and an
# `strace` that can inject an error, for four of the gate's cases:
# `tests/startup.rs` skips its mount-namespace, change-of-user and injected
# cases elsewhere, and `no-helper-says-cant-fork`,
# `supplement-asked-of-the-effective-user` and `close-range-result-unread`
# then survive. CI runs only --apply-only.
#
# Run 2026-11-21 as root, --first-kill: 48 mutants, 48 killed (unit-sigpipe
# 23, unit-cli 12, startup 10, unit-linux 3; the gates run in that order,
# so the backend's unit tests are asked last).
#
# The differential sees the rules too, and is no gate here for its cost:
# of its 29 cases about them (`startup-*`, `plus-m-file-the-*-user-may-not-
# read`, `fd-mixture-*`, `letters-multibyte-*`), 28 DIVERGE on the tree
# before the fixes (measured 2026-11-21).
#
# Rules with no mutant here, and why:
# * `O_LARGEFILE` on the constructor's `/dev/null`: 0 on every 64-bit glibc
#   target, where the kernel sets the flag itself, so no test on such a
#   host can see it gone; `+f g` shows `RW,LG` either way.
# * The constructor's `cfg!(miri)` return, and its FreeBSD half
#   (`closefrom(3)`): no gate here runs miri, or FreeBSD.
# * `/proc/self/fd` as the directory the fallback lists: any other
#   directory of numbers this process has (`/proc/self/fdinfo`) lists the
#   same ones.
# * `Access::READ_OK` against the other rights (`F_OK`, `W_OK`): root has
#   them all, and for the user the gate's case runs as the directories
#   above the file may refuse first, with the same words.
# * The four errors a `fork()` fails of, one by one: `fork-errors-are-the-
#   pipes-alone` drops the two that are `fork()`'s own.
# * An open that fails past access() being `can't open`, whatever its
#   error: plus4.toml's `socket-says-access`, re-anchored on this code.
# * A directory entry that says it has no length ending the reading: a
#   mutant without the check reads on, to no effect, for as many turns as
#   there are bytes (the loop is bounded by them), and ends the same.

[run]
dir = ".."
build = [["cargo", "build", "-p", "lsof-sigpipe", "-p", "lsof-backend-linux", "-p", "lsof-cli"]]

[[run.gate]]
name = "unit-sigpipe"
cmd = ["cargo", "test", "-p", "lsof-sigpipe", "--lib"]
timeout = 600

[[run.gate]]
name = "unit-cli"
cmd = ["cargo", "test", "-p", "lsof-cli", "--lib"]
timeout = 900

[[run.gate]]
name = "startup"
cmd = ["cargo", "test", "-p", "lsof-cli", "--test", "startup", "--test", "arguments"]
timeout = 1200

[[run.gate]]
name = "unit-linux"
cmd = ["cargo", "test", "-p", "lsof-backend-linux", "--lib"]
timeout = 900

# ------------------------------------------- 170: the descriptors handed down

[[mutant]]
name = "startup-not-run"
rule = "the constructor takes the C's first two steps (170, 171)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''    startup::start_up(&mut kernel);
}'''
new = '''    if false {
        startup::start_up(&mut kernel);
    }
}'''

[[mutant]]
name = "close-from-not-called"
rule = "every descriptor from 3 up is closed (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''        close_from(sys, FIRST_CLOSED);
        open_standard(sys);'''
new = '''        open_standard(sys);'''

[[mutant]]
name = "dev-null-before-the-close"
rule = "the close comes before /dev/null is opened, as in the C (170, 171)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''        close_from(sys, FIRST_CLOSED);
        open_standard(sys);'''
new = '''        open_standard(sys);
        close_from(sys, FIRST_CLOSED);'''

[[mutant]]
name = "first-closed-is-four"
rule = "the first descriptor closed is 3 (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''    pub(crate) const FIRST_CLOSED: c_int = 3;'''
new = '''    pub(crate) const FIRST_CLOSED: c_int = 4;'''

[[mutant]]
name = "close-range-closes-one"
rule = "close_range() runs from 3 to the last number there is (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''            let (last, flags): (libc::c_uint, libc::c_uint) = (libc::c_uint::MAX, 0);'''
new = '''            let (last, flags): (libc::c_uint, libc::c_uint) = (first, 0);'''

[[mutant]]
name = "close-range-result-unread"
rule = "where close_range() failed, nothing was closed, and the fallback runs (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''            let rc = unsafe { libc::syscall(libc::SYS_close_range, first, last, flags) };
            rc == 0'''
new = '''            let rc = unsafe { libc::syscall(libc::SYS_close_range, first, last, flags) };
            rc == 0 || rc == -1'''

[[mutant]]
name = "listing-before-the-one-call"
rule = "where close_range() is there, it is all that is called (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''        if sys.close_from(low) || close_listed(sys, low) {'''
new = '''        if close_listed(sys, low) || sys.close_from(low) {'''

[[mutant]]
name = "no-listing-fallback"
rule = "without close_range(), the descriptors /proc/self/fd lists are closed (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''        if sys.close_from(low) || close_listed(sys, low) {'''
new = '''        if sys.close_from(low) {'''

[[mutant]]
name = "no-sweep-fallback"
rule = "with neither, every number below the limit is closed (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''        for fd in low..sweep_end(sys.table_size()) {'''
new = '''        for fd in low..low.min(sweep_end(sys.table_size())) {'''

[[mutant]]
name = "sweep-stops-at-a-low-limit"
rule = "the sweep runs to 53 at least, the C's MaxFd (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''        table_size.clamp(SWEEP_MIN, SWEEP_MAX)'''
new = '''        table_size.clamp(FIRST_CLOSED, SWEEP_MAX)'''

[[mutant]]
name = "sweep-unbounded"
rule = "the sweep closes 1,048,576 numbers at most (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''        table_size.clamp(SWEEP_MIN, SWEEP_MAX)'''
new = '''        table_size.max(SWEEP_MIN)'''

[[mutant]]
name = "listing-closes-below-three"
rule = "the walk closes the numbers from 3 up alone (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''                if fd >= low && fd != dir {'''
new = '''                if fd != dir {'''

[[mutant]]
name = "listing-closes-itself"
rule = "the walk does not close the descriptor it is read through (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''                if fd >= low && fd != dir {'''
new = '''                if fd >= low {'''

[[mutant]]
name = "listing-left-open"
rule = "the walk's own descriptor is closed when it ends (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''        sys.close(dir);
        true'''
new = '''        true'''

[[mutant]]
name = "listing-read-once"
rule = "the walk reads the directory to its end (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''            listed(records, &mut |fd| {
                if fd >= low && fd != dir {
                    sys.close(fd);
                }
            });
        }'''
new = '''            listed(records, &mut |fd| {
                if fd >= low && fd != dir {
                    sys.close(fd);
                }
            });
            break;
        }'''

[[mutant]]
name = "dirent-name-a-byte-early"
rule = "a directory entry's name begins at byte 19 (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''    pub(crate) const DIRENT_NAME: usize = 19;'''
new = '''    pub(crate) const DIRENT_NAME: usize = 18;'''

[[mutant]]
name = "dirent-length-misplaced"
rule = "a directory entry's length is its bytes 16 and 17 (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''    pub(crate) const DIRENT_RECLEN: std::ops::Range<usize> = 16..18;'''
new = '''    pub(crate) const DIRENT_RECLEN: std::ops::Range<usize> = 8..10;'''

[[mutant]]
name = "dirent-stops-at-the-first-entry"
rule = "every entry a read gave is looked at (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''            records = records.get(len..).unwrap_or_default();'''
new = '''            records = records.get(records.len()..).unwrap_or_default();'''

[[mutant]]
name = "fd-name-not-digits"
rule = "a descriptor's name is digits and nothing else (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''            if !b.is_ascii_digit() {
                return None;
            }'''
new = '''            if !b.is_ascii_digit() {
                continue;
            }'''

[[mutant]]
name = "fd-name-empty-is-zero"
rule = "an empty name is no descriptor (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''        if name.is_empty() {
            return None;
        }
        let mut fd: c_int = 0;'''
new = '''        let mut fd: c_int = 0;'''

[[mutant]]
name = "fd-name-int-max-taken"
rule = "a descriptor's number is below INT_MAX, as the C's (170)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
