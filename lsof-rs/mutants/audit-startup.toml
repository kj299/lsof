# ----------------------------------------- 175: no /proc, and the mount table

[[mutant]]
name = "no-helper-says-cant-fork"
rule = "where no helper can start and the table cannot be opened, the table's line is said (175)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/safefs.rs"
old = '''                let line = no_helper(e, crate::mounts::unopenable);'''
new = '''                let line = no_helper(e, || None);'''

[[mutant]]
name = "no-helper-table-never-asked"
rule = "a failure a fork would not have had asks the table (175)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/safefs.rs"
old = '''    let unread = if a_fork_fails_too(e) { None } else { table() };'''
new = '''    let unread = if a_fork_fails_too(e) || e.raw_os_error().is_some() { None } else { table() };'''

[[mutant]]
name = "no-helper-table-always-asked"
rule = "the C's own failed pipe() or fork() is said of them, whatever the table (175)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/safefs.rs"
old = '''    let unread = if a_fork_fails_too(e) { None } else { table() };'''
new = '''    let unread = table();'''

[[mutant]]
name = "fork-errors-are-the-pipes-alone"
rule = "EAGAIN and ENOMEM are a fork()'s own, as EMFILE and ENFILE are the pipes' (175)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/safefs.rs"
old = '''    matches!(e.raw_os_error(), Some(11 | 12 | 23 | 24))'''
new = '''    matches!(e.raw_os_error(), Some(23 | 24))'''
