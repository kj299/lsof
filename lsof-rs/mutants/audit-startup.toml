# ------------------------------------------------------- 171: /dev/null

[[mutant]]
name = "no-dev-null-run-goes-on"
rule = "a run that cannot open /dev/null ends there (171)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''                sys.exit(NO_DEV_NULL);
                return;'''
new = '''                return;'''

[[mutant]]
name = "no-dev-null-exits-zero"
rule = "a run that cannot open /dev/null exits 1 (171)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''    pub(crate) const NO_DEV_NULL: c_int = 1;'''
new = '''    pub(crate) const NO_DEV_NULL: c_int = 0;'''

[[mutant]]
name = "kernel-exit-returns"
rule = "the exit is the kernel's: nothing runs after it (171)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''            unsafe { libc::_exit(status) }
        }
    }

    #[cfg(target_os = "freebsd")]'''
new = '''            let _ = status;
        }
    }

    #[cfg(target_os = "freebsd")]'''

[[mutant]]
name = "dev-null-loop-past-two"
rule = "a descriptor of 2 ends the loop and is kept (171)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''            if fd < 2 {
                continue;
            }'''
new = '''            if fd <= 2 {
                continue;
            }'''

[[mutant]]
name = "dev-null-opened-once"
rule = "/dev/null is opened until its descriptor is at least 2 (171)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''            if fd < 2 {
                continue;
            }'''
new = '''            if fd < 1 {
                continue;
            }'''

[[mutant]]
name = "dev-null-extra-kept"
rule = "the descriptor the loop got past 2 is closed again (171)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''            if fd > 2 {
                sys.close(fd);
            }'''
new = '''            if fd > 3 {
                sys.close(fd);
            }'''

[[mutant]]
name = "dev-null-read-only"
rule = "/dev/null is opened for reading and writing (171)"
[[mutant.edit]]
file = "crates/lsof-sigpipe/src/lib.rs"
old = '''libc::O_RDWR | libc::O_LARGEFILE'''
new = '''libc::O_RDONLY | libc::O_LARGEFILE'''

# ------------------------------------------------- 172: `+m m` and access(2)

[[mutant]]
name = "supplement-not-asked-of-access"
rule = "the supplement is asked of access() before it is opened (172)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/mounts.rs"
old = '''    readable(path).map_err(|e| access(&e))?;'''
new = '''    let _ = readable;'''

[[mutant]]
name = "supplement-access-always-passes"
rule = "access() is asked, of the path (172)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/mounts.rs"
old = '''    rustix::fs::access(path, rustix::fs::Access::READ_OK).map_err(std::io::Error::from)'''
new = '''    let _ = path;
    Ok(())'''

[[mutant]]
name = "supplement-asked-of-the-effective-user"
rule = "the question is access(2)'s, the real user's rights, not an open's (172)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/mounts.rs"
old = '''    rustix::fs::access(path, rustix::fs::Access::READ_OK).map_err(std::io::Error::from)'''
new = '''    std::fs::File::open(path).map(drop)'''

[[mutant]]
name = "supplement-stat-failure-called-access"
rule = "past access(), a file that is not there is `can't open` (172)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/mounts.rs"
old = '''    let meta = std::fs::metadata(path).map_err(|e| open(&e))?;'''
new = '''    let meta = std::fs::metadata(path).map_err(|e| access(&e))?;'''

# ---------------------------------------- 173: the -d mixture's item, 254 bytes

[[mutant]]
name = "fd-mixture-item-whole"
rule = "the -d mixture message quotes 254 bytes of its item (173)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''                    bytes.truncate(FD_MIXTURE_ITEM);'''
new = ''''''

[[mutant]]
name = "fd-mixture-item-255"
rule = "254 bytes, as snpf(buf, 255) keeps (173)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''const FD_MIXTURE_ITEM: usize = 254;'''
new = '''const FD_MIXTURE_ITEM: usize = 255;'''

[[mutant]]
name = "fd-mixture-caret-not-counted"
rule = "the `^` is one of the 254 bytes (173)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''                    let mut bytes = caret.as_bytes().to_vec();
                    bytes.extend_from_slice(&text_bytes(body));
                    bytes.truncate(FD_MIXTURE_ITEM);
                    shown_bytes(&bytes).into_owned()'''
new = '''                    let mut bytes = text_bytes(body).into_owned();
                    bytes.truncate(FD_MIXTURE_ITEM);
                    format!("{caret}{}", shown_bytes(&bytes))'''

[[mutant]]
name = "fd-mixture-cut-after-escaping"
rule = "the cut is of the bytes given, not of what is shown for them (173)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''                    bytes.truncate(FD_MIXTURE_ITEM);
                    shown_bytes(&bytes).into_owned()'''
new = '''                    let cut: String = shown_bytes(&bytes).chars().take(FD_MIXTURE_ITEM).collect();
                    cut'''

[[mutant]]
name = "fd-mixture-stand-ins-as-characters"
rule = "a byte that is no character counts one of the 254 (173)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''    if stand_ins && arg.chars().any(|c| byte_letter(c).is_some()) {
        return std::borrow::Cow::Owned(stand_in_bytes(arg));
    }'''
new = '''    let _ = stand_ins;'''

