# Mutants for the review of DIVERGENCES 152-154 (2026-11-14): one a rule,
# bound, branch or default the fixes of the 58 confirmed findings added or
# that had none. The kill table is this file, run (porting-kit LESSONS #083):
#
#   cd lsof-rs && python3 ../porting-kit/harnesses/port-mutation/mutate_port.py --first-kill mutants/plus4-fix.toml
#
# It needs the C oracle built at ../lsof (README: Building) and root, for the
# differential's fixtures and `names` modes and the resource gate's
# namespaces. CI runs only --apply-only.
#
# Run 2026-11-14 as root with --first-kill, in a copy of the tree, the unit
# gate split by crate (`cargo test -p lsof-core --lib`, `-p
# lsof-backend-linux --lib`, `-p lsof-cli`), the differential narrowed to
# the names-socket, repeat, plus-m, offset- and links-next cases (72), then
# the resource gate: 57 of 57 killed, 30 by lsof-core's tests, 7 by the
# backend's, 10 by the CLI's (`tests/names.rs` kills no-name-service), 7 by
# the differential alone (exempt-row-device-unknown, trim-env-ignored,
# name-kept-short, local-zone-ignores-tz, -tzdir, -always-secure,
# quiet-mutes-idle) and 3 by the resource gate's `names-reader-gone` alone
# (names-before-writing, stdout-buffer-64k, fields-written-at-the-end: the
# unit test's processes hold one socket each). subformat-depth-zero first
# set the depth to 1, which survived (one level is all the C locale's
# conversions need) and was changed to 0, then killed.
#
# Rules with no mutant here, and why:
# * The values of `RESOLV_LINE_LIMIT` (1 MiB a line) and `RESOLV_CONF_LIMIT`
#   (256 MiB): `resolv_conf_is_read_whole_or_not_at_all` pins both rules
#   through `resolv_conf_within` with small bounds (`resolv-line-past-bound-
#   read`, `resolv-file-past-bound-read`); a test of the values themselves
#   would write 256 MiB.
# * `read_zone_file`'s two regular-file looks and its non-blocking open:
#   each covers the others but in a race (a FIFO swapped in between the look
#   and the open), which no test can make without timing; the unit test
#   pins that a FIFO, a device, a directory and a socket are refused.
# * `holds_glibcs_reader` for a block device: no test can make one.
# * Net's `connect_timeout` and `set_write_timeout`: a loopback listener
#   accepts at once and takes a query whole, so neither can be made to wait
#   without a host that drops packets.
# * The host.conf path `RESOLV_HOST_CONF` names for `trim`: the same
#   `host_conf_path()` as `multi`'s, whose mutant is row38.toml's
#   `names-host-conf-environment-not-read`.
# * `interface_index`'s name checks: an IPv6 server's `%scope` needs IPv6,
#   which this project's test host has not.
# * `+m not supported` off Linux (`args.rs`): FreeBSD and Windows both build
#   the arm, and the args tests gated on them pin it there; no Linux gate
#   builds it.
# * `note_inherited_fds`'s exclusion of its own listing's descriptor: the
#   descriptor is closed before any supplement is read, so a mutant that
#   kept it would name a number no path can reach.

[run]
dir = ".."
build = [["cargo", "build", "--release", "--bin", "lsof"]]

[[run.gate]]
name = "unit"
cmd = ["cargo", "test", "-p", "lsof-core", "-p", "lsof-cli", "-p", "lsof-backend-linux"]
timeout = 1200

[[run.gate]]
name = "differential"
cmd = ["unshare", "-m", "--propagation", "private", "python3", "differential/linux_diff.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]
timeout = 2400

[[run.gate]]
name = "resource"
cmd = ["python3", "differential/resource_gate.py", "--oracle", "../lsof", "--rust", "target/release/lsof", "--warn-wall"]
timeout = 1800


