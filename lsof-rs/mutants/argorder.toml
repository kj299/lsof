# Mutants for DIVERGENCES 12, resolved 2026-11-19: the options end where the
# C's `GetOpt()` ends them (`src/main.c:1900-1915`): at a word that opens
# with neither `-` nor `+`, or is `-` or `+` alone, the first name; at `--`
# and `++`, taken; never inside a word an option gave back after its
# digits. Every word after is a name. One per rule. The kill table is this
# file, run (porting-kit LESSONS #083):
#
#   cd lsof-rs && python3 ../porting-kit/harnesses/port-mutation/mutate_port.py --first-kill mutants/argorder.toml
#
# It needs the C oracle built at ../lsof (README: Building) and root, or
# passwordless sudo, for the differential. CI runs only --apply-only.
#
# Run 2026-11-19 as root with --first-kill, in a copy of the tree: 8 of 8
# killed, all by the unit gate (`args.rs` `options_end_where_getopt_ends_them`,
# `a_next_word_read_on_after_its_digits_is_letters_not_a_word`). The two
# mutants this change moved were re-anchored and run again the same way,
# each killed by the unit gate: `plus4-fix.toml` resumed-word-ends-options
# and `small-rows.toml` bare-path-read-as-text. The differential's 15
# argument-order cases (`options-after-a-name-are-names` and the 14 after
# it) diverge on b761c96 and match after.

[run]
dir = ".."
build = [["cargo", "build", "--release", "--bin", "lsof"]]

[[run.gate]]
name = "unit"
cmd = ["cargo", "test", "-p", "lsof-core", "-p", "lsof-cli", "-p", "lsof-backend-linux"]
timeout = 1200

[[run.gate]]
name = "differential"
cmd = ["unshare", "-m", "--propagation", "private", "python3", "differential/linux_diff.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]
timeout = 2400


[[mutant]]
name = "double-dash-not-taken"
rule = "`--` ends the options and is taken, not a name (12)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''            let first_name = if tok == "--" || tok == "++" {
                Some(i + 1)'''
new = '''            let first_name = if tok == "--" || tok == "++" {
                Some(i)'''

[[mutant]]
name = "double-plus-no-stop"
rule = "`++` is GetOpt()'s `--`: it ends the options and is taken (12)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''            let first_name = if tok == "--" || tok == "++" {'''
new = '''            let first_name = if tok == "--" {'''

[[mutant]]
name = "bare-word-no-stop"
rule = "a word that opens with neither `-` nor `+` is the first name, and the options end there (12)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''            } else if !(tok.starts_with('-') || tok.starts_with('+')) || tok.len() == 1 {'''
new = '''            } else if tok.len() == 1 && (tok.starts_with('-') || tok.starts_with('+')) {'''

[[mutant]]
name = "lone-prefix-no-stop"
rule = "`-` or `+` alone is the first name, not an empty option word (12)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''            } else if !(tok.starts_with('-') || tok.starts_with('+')) || tok.len() == 1 {'''
new = '''            } else if !(tok.starts_with('-') || tok.starts_with('+')) {'''

[[mutant]]
name = "plus-word-a-name"
rule = "a word that opens with `+` is an option word, like one that opens with `-` (12)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''            } else if !(tok.starts_with('-') || tok.starts_with('+')) || tok.len() == 1 {'''
new = '''            } else if !tok.starts_with('-') || tok.len() == 1 {'''

[[mutant]]
name = "stop-inside-a-resumed-word"
rule = "a word given back after an option's digits is read on with no word-start test: `-r 1-` is the letter `-`, not `--` (12, 152)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''        if !resumed_here {
            let first_name ='''
new = '''        if true {
            let first_name ='''

[[mutant]]
name = "only-the-first-name"
rule = "every word after the first name is a name too (12)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''                sel.paths.extend(raw.iter().skip(start).cloned());
                break;
            }
        }'''
new = '''                sel.paths.extend(raw.get(start).cloned());
                break;
            }
        }'''

[[mutant]]
name = "names-after-the-stop-read-on"
rule = "the words after the first name are names, never options (12)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''                sel.paths.extend(raw.iter().skip(start).cloned());
                break;
            }
        }'''
new = '''                if let Some(name) = raw.get(start) {
                    sel.paths.push(name.clone());
                }
                i = start + 1;
                continue;
            }
        }'''
