# Mutants for DIVERGENCES 12, resolved 2026-11-19: the options end where the
# C's `GetOpt()` ends them (`src/main.c:1900-1915`): at a word that opens
# with neither `-` nor `+`, or is `-` or `+` alone, the first name; at `--`
# and `++`, taken; never inside a word an option gave back after its
# digits. Every word after is a name. One per rule. The kill table is this
# file, run (porting-kit LESSONS #083):
#
#   cd lsof-rs && python3 ../porting-kit/harnesses/port-mutation/mutate_port.py --first-kill mutants/argorder.toml
#
# It needs the C oracle built at ../lsof (README: Building) and root, or
# passwordless sudo, for the differential. CI runs only --apply-only.
#
# Run 2026-11-19 as root with --first-kill, in a copy of the tree: 8 of 8
# killed, all by the unit gate (`args.rs` `options_end_where_getopt_ends_them`,
# `a_next_word_read_on_after_its_digits_is_letters_not_a_word`). The two
# mutants this change moved were re-anchored and run again the same way,
# each killed by the unit gate: `plus4-fix.toml` resumed-word-ends-options
# and `small-rows.toml` bare-path-read-as-text. The differential's 15
# argument-order cases (`options-after-a-name-are-names` and the 14 after
# it) diverge on b761c96 and match after.
#
# Run again 2026-11-19 with the review's fixes, the same way: 19 of 19
# killed, 18 by the unit gate (`args.rs`
# `long_options_are_windows_words_where_an_option_stands`,
# `a_path_that_is_not_utf8_is_read_as_bytes` and the two above) and
# `long-options-everywhere` by the differential (`long-option-*`; the unit
# build reads the Windows parse through a test switch). Re-run with them,
# each killed by the unit gate: `small-rows.toml` option-0xff-names-from-
# next-word and option-0xff-reads-on (their anchor's neighbourhood
# changed), `plus4-fix.toml` resumed-word-ends-options. Not mutated: the
# restore of the given word under `if resumed_here` run for every word
# (equivalent: only a resumed word was rebuilt), and main.rs's console
# switch, Windows-only code no gate here runs.

[run]
dir = ".."
build = [["cargo", "build", "--release", "--bin", "lsof"]]

[[run.gate]]
name = "unit"
cmd = ["cargo", "test", "-p", "lsof-core", "-p", "lsof-cli", "-p", "lsof-backend-linux"]
timeout = 1200

[[run.gate]]
name = "differential"
cmd = ["unshare", "-m", "--propagation", "private", "python3", "differential/linux_diff.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]
timeout = 2400


[[mutant]]
name = "double-dash-not-taken"
rule = "`--` ends the options and is taken, not a name (12)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''            let first_name = if tok == "--" || tok == "++" {
                Some(i + 1)'''
new = '''            let first_name = if tok == "--" || tok == "++" {
                Some(i)'''

[[mutant]]
name = "double-plus-no-stop"
rule = "`++` is GetOpt()'s `--`: it ends the options and is taken (12)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''            let first_name = if tok == "--" || tok == "++" {'''
new = '''            let first_name = if tok == "--" {'''

[[mutant]]
name = "bare-word-no-stop"
rule = "a word that opens with neither `-` nor `+` is the first name, and the options end there (12)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''            } else if !(tok.starts_with('-') || tok.starts_with('+')) || tok.len() == 1 {'''
new = '''            } else if tok.len() == 1 && (tok.starts_with('-') || tok.starts_with('+')) {'''

[[mutant]]
name = "lone-prefix-no-stop"
rule = "`-` or `+` alone is the first name, not an empty option word (12)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''            } else if !(tok.starts_with('-') || tok.starts_with('+')) || tok.len() == 1 {'''
new = '''            } else if !(tok.starts_with('-') || tok.starts_with('+')) {'''

[[mutant]]
name = "plus-word-a-name"
rule = "a word that opens with `+` is an option word, like one that opens with `-` (12)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''            } else if !(tok.starts_with('-') || tok.starts_with('+')) || tok.len() == 1 {'''
new = '''            } else if !tok.starts_with('-') || tok.len() == 1 {'''

[[mutant]]
name = "stop-inside-a-resumed-word"
rule = "a word given back after an option's digits is read on with no word-start test: `-r 1-` is the letter `-`, not `--` (12, 152)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''        if !resumed_here {
            let first_name ='''
new = '''        if true {
            let first_name ='''

[[mutant]]
name = "only-the-first-name"
rule = "every word after the first name is a name too (12)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''                sel.paths.extend(raw.iter().skip(start).cloned());
                break;
            }
        }'''
new = '''                sel.paths.extend(raw.get(start).cloned());
                break;
            }
        }'''

[[mutant]]
name = "names-after-the-stop-read-on"
rule = "the words after the first name are names, never options (12)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''                sel.paths.extend(raw.iter().skip(start).cloned());
                break;
            }
        }'''
new = '''                if let Some(name) = raw.get(start) {
                    sel.paths.push(name.clone());
                }
                i = start + 1;
                continue;
            }
        }'''

# Added 2026-11-19 by the review fix: `--` and `++` each on their own, the
# name from inside a word given back after digits, and the long options.

[[mutant]]
name = "double-dash-no-stop"
rule = "`--` ends the options and is taken (12)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''            let first_name = if tok == "--" || tok == "++" {'''
new = '''            let first_name = if tok == "++" {'''

[[mutant]]
name = "double-plus-not-taken"
rule = "`++` is taken as `--` is, not left as the first name (12)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''            let first_name = if tok == "--" || tok == "++" {
                Some(i + 1)'''
new = '''            let first_name = if tok == "++" {
                Some(i)
            } else if tok == "--" {
                Some(i + 1)'''

[[mutant]]
name = "resumed-0xff-names-the-rebuilt-word"
rule = "a 0xff in a word given back after digits names that word as given, `1\\xfft`, not `-\\xfft` (12, 92)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''                    if resumed_here {
                        if let (Some(w), Some(whole))'''
new = '''                    if false {
                        if let (Some(w), Some(whole))'''

[[mutant]]
name = "long-options-everywhere"
rule = "`--etw`, `--unicode`, `--ascii` are the C's letters but on Windows (155)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''fn long_options_are_read() -> bool {
    cfg!(windows)
}'''
new = '''fn long_options_are_read() -> bool {
    true
}'''

[[mutant]]
name = "long-option-in-a-resumed-word"
rule = "no long option inside a word given back after digits: `-o 3-etw` is letters (155)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''    !resumed_here && !offered_word(last_letter, i)'''
new = '''    !offered_word(last_letter, i)'''

[[mutant]]
name = "long-option-given-back"
rule = "no long option in a whole word an option was offered and gave back: `-L --etw` is letters (155)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''    !resumed_here && !offered_word(last_letter, i)'''
new = '''    !resumed_here'''

[[mutant]]
name = "offered-not-at-the-end"
rule = "a letter is offered the next word only when it ends its word: `-cfoo --etw` (155)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''        at_end && word.checked_add(1) == Some(i) && VALUE_LETTERS.contains(c)'''
new = '''        word.checked_add(1) == Some(i) && VALUE_LETTERS.contains(c)'''

[[mutant]]
name = "offered-any-later-word"
rule = "only the very next word is offered (155)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''        at_end && word.checked_add(1) == Some(i) && VALUE_LETTERS.contains(c)'''
new = '''        at_end && word < i && VALUE_LETTERS.contains(c)'''

[[mutant]]
name = "offered-by-any-letter"
rule = "only a letter whose rule carries a `:` is offered the next word (155)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''        at_end && word.checked_add(1) == Some(i) && VALUE_LETTERS.contains(c)'''
new = '''        at_end && word.checked_add(1) == Some(i)'''

[[mutant]]
name = "value-letters-lose-L"
rule = "`-L` is offered the next word, as the C's mask says (155)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''const VALUE_LETTERS: &str = "cDdefFgiKLmoprsSTuxZ";'''
new = '''const VALUE_LETTERS: &str = "cDdefFgiKmoprsSTuxZ";'''

[[mutant]]
name = "last-letter-always-at-the-end"
rule = "whether the last letter ended its word is recorded as read: `-cfoo --etw` (155)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''            last_letter = Some((i, c, j + 1 == chars.len()));'''
new = '''            last_letter = Some((i, c, true));'''
