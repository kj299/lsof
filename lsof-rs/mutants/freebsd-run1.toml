# Mutants for the first FreeBSD run beside the C (2026-11-21, FreeBSD
# 14.5-RELEASE amd64): DIVERGENCES 141 (tasks), 148 (-D), 180 (the ends of an
# Internet socket), 181 (-s with -i), 182 (when the mount table is read), 183
# (FreeBSD's option letters), and readvfs()'s first pass. Every rule was
# measured against the C on FreeBSD; every gate is a unit suite that runs on
# Linux: the FreeBSD backend's pure modules (cfg(test) on any Unix),
# lsof-core's model, selection and renderers, lsof-cli's parser (whose
# FreeBSD option set a test turns on) and lsof's own unit tests. One per
# rule, bound and branch the change added.
#
#   cd lsof-rs && python3 ../porting-kit/harnesses/port-mutation/mutate_port.py --first-kill mutants/freebsd-run1.toml
#
# Not mutated, and why: the lines that compile on FreeBSD alone (the
# backend's gather: KERN_PROC_ALL under -K, the rows read once a process and
# given to each of its threads, the set of NFS devices; main.rs's -D ?
# report; kinfo_proc's measured ki_tid offsets, which no Linux test can
# check and the backend's live test on FreeBSD does:
# `under_dash_k_this_processs_threads_are_its_entries`, with
# crates/lsof-cli/tests/freebsd.rs for the binary).

[run]
dir = ".."
build = [["cargo", "build", "-p", "lsof-backend-freebsd", "-p", "lsof-core", "-p", "lsof-cli"]]

[[run.gate]]
name = "unit-bsd"
cmd = ["cargo", "test", "-p", "lsof-backend-freebsd", "--lib"]
timeout = 900

[[run.gate]]
name = "unit-cli"
cmd = ["cargo", "test", "-p", "lsof-cli", "--lib", "--bin", "lsof"]
timeout = 900

[[run.gate]]
name = "unit-core"
cmd = ["cargo", "test", "-p", "lsof-core", "--lib", "--test", "golden"]
timeout = 900

