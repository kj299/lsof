# Mutants for the -r parity round (2026-11-18, DIVERGENCES 36, 121, 152):
# one a rule, bound, branch or default it added. The kill table is this
# file, run (porting-kit LESSONS #083):
#
#   cd lsof-rs && python3 ../porting-kit/harnesses/port-mutation/mutate_port.py --first-kill mutants/r-parity.toml
#
# It needs the C oracle built at ../lsof (README: Building) and root, for
# the differential's `tz-*` and `wr-*` modes. CI runs only --apply-only.
#
# Run 2026-11-18 as root with --first-kill, in a copy of the tree: 34 of 38
# killed (core 19, cli 11, backend 3, the differential 1:
# zone-deadline-thirty, by `repeat-tz-fifo-with-no-writer-holds-the-c`'s
# limit). Four survived and each got a test: negative-delay-no-repeat and
# sleep-not-unsigned (repeat.rs's `a_wrapped_delay_and_count_act_as_the_cs_ints`,
# which an edit had dropped), mktime-stride-an-hour (a crafted zone,
# `tests/tzif/stride`, whose two days of +05 a stride of a day finds and
# glibc's 601200 s steps over: `tests/mktime_glibc.txt`'s last line, measured)
# and name-stops-at-charcnt (`tests/tzif/runon`, `ABC` and the footer's
# `XYZ5`: `ABCXYZ5`, measured); run again in the tree: 4 of 4 killed (cli 2,
# core 2). 38 of 38.
#
# Rules with no mutant here, and why:
# * `pr_count`'s wrap: a negative count is met only after 2^32 less its size
#   cycles, which no gate can run; the delay's and the count's reading as an
#   `int` are pinned (`c-int-digits-saturate`).
# * `!lsof_sigpipe::blocked()`: restoring `SIG_DFL` while the signal is
#   blocked leaves it pending and the write an `EPIPE`, the same run; the
#   test is the brief's, kept for the case a later unblock would deliver it.
# * `__tzfile_default()`'s zeroed key: the `posixrules` read follows a failed
#   read of the string's own name, which leaves `use_tzfile` 0, so the key
#   is never compared; it matters only where `TZ` names `posixrules` itself.
# * The stream's 64 MiB bound on version 1 data: a test would send 64 MiB
#   through a FIFO.
# * `Stdio::emit`'s `Ok(0)`: no file returns 0 for a write of more than 0.
# * The parse's marker kept for the loop (no second `localtime()`): the
#   output is the same; only a count of `stat()` calls tells.

[run]
dir = ".."
build = [["cargo", "build", "--release", "--bin", "lsof"]]

[[run.gate]]
name = "core"
cmd = ["cargo", "test", "-p", "lsof-core", "--lib", "timefmt"]
timeout = 900

[[run.gate]]
name = "cli"
cmd = ["cargo", "test", "-p", "lsof-cli"]
timeout = 1200

[[run.gate]]
name = "backend"
cmd = ["cargo", "test", "-p", "lsof-backend-linux", "--lib", "zonefile"]
timeout = 600

[[run.gate]]
name = "differential"
cmd = ["unshare", "-m", "--propagation", "private", "python3", "differential/linux_diff.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]
timeout = 2400


[[mutant]]
name = "c-int-digits-saturate"
rule = "-r's delay and count, and -o's count, wrap as the C's int does (121, 152)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''        n.wrapping_mul(10)
            .wrapping_add(i32::from(b.wrapping_sub(b'0')))'''
new = '''        n.saturating_mul(10)
            .saturating_add(i32::from(b.wrapping_sub(b'0')))'''

[[mutant]]
name = "negative-delay-no-repeat"
rule = "any delay but 0 repeats, a wrapped negative one too (152)"
[[mutant.edit]]
file = "crates/lsof-cli/src/repeat.rs"
old = '''        if delay != 0 {
            if repeat.until_idle {'''
new = '''        if delay > 0 {
            if repeat.until_idle {'''

[[mutant]]
name = "sleep-not-unsigned"
rule = "the sleep is the delay's unsigned int, as sleep(RptTm) takes it (152)"
[[mutant.edit]]
file = "crates/lsof-cli/src/repeat.rs"
old = '''            host.sleep(u32::from_ne_bytes(delay.to_ne_bytes()));'''
new = '''            host.sleep(u32::try_from(delay).unwrap_or(1));'''

[[mutant]]
name = "write-error-ends-the-loop"
rule = "a failed write does not end the repeat loop, as the C casts fflush()'s result away (36)"
[[mutant.edit]]
file = "crates/lsof-cli/src/repeat.rs"
old = '''            let _ = host.out().flush();'''
new = '''            if host.out().flush().is_err() {
                break;
            }'''

[[mutant]]
name = "no-flush-before-sleep"
rule = "stdout is flushed after the marker and before the sleep (152)"
[[mutant.edit]]
file = "crates/lsof-cli/src/repeat.rs"
old = '''            let _ = host.out().flush();'''
new = ''''''

[[mutant]]
