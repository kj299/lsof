# ------------------------------------------- the review's fixes (2026-11-19)
# The stdio calls (S1-S4) and the zone files (T1-T4) of the review of
# a46e03c; the gate `render` (lsof-core's whole suite) was added for them.
# Rules with no mutant here, and why:
# * The backends' `lsof_core::safefs::exit` (mounts.rs, safefs.rs): no run
#   measured has output in stdout's buffer where either ends it; the hook
#   itself is `exit-skips-the-flush`.
# * The table marker's `puts()` rather than two `printf()`s: they differ
#   only where the `fputs()` of the marker fails, which needs a full buffer
#   and a failing write at that call.
# * The 64 MiB bound on a version 1 file read past its `st_size`: a test
#   would read 64 MiB.

