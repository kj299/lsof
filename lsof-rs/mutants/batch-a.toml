[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''    if next.is_empty() {
        *i += 1;
        return None;
    }'''
new = '''    if next.is_empty() {
        return None;
    }'''

[[mutant]]
name = "plus-T-empty-is-plus-T"
rule = "+T '' selects no letters, not the default (116)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
