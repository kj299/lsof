# Mutants for Batch A (2026-10-30): DIVERGENCES 114, 116, 117, 58, 71, 36,
# 128, 109 and 22, one per rule. The kill table is this file, run (porting-kit
# LESSONS #083):
#
#   cd lsof-rs && python3 ../porting-kit/harnesses/port-mutation/mutate_port.py --first-kill mutants/batch-a.toml
#
# It needs the C oracle built at ../lsof (README: Building) and root, or
# passwordless sudo: the differential's fixtures W (WB, WJ, WA), MQ's mqueue
# mount and the passwd overlay need it. CI runs only --apply-only.
#
# Run 2026-10-30 as root with --first-kill: 27 of 27 killed, 23 by the unit
# gate and 4 by the differential alone (pwd-warnings-never, which mutates the
# call site the unit test does not reach; psxmq-device-not-handed-on,
# netlink-table-unread and netlink-table-gated-by-dash-X, which no unit test
# reads from the host).
#
# Batch A's review (2026-10-30) re-anchored help-on-stdout (the help now goes
# through lsof_core::safefs::write_stderr) and xattr-inode-unchecked (the
# identity check is now the pinned descriptor's /proc link, not an fstat),
# and added xattr-identity-by-fstat (killed only by net.rs's FUSE test, which
# needs root and /dev/fuse), xattr-buffer-shrunk, the stderr writer's two,
# the parse's six for -u, -Z, `--help` and the order of what it prints, and
# users-resolved-after-help in main.rs. Run again in full, 2026-10-31, as root
# with --first-kill: 38 of 38 killed, 34 by the unit gate and 4 by the
# differential alone (psxmq-device-not-handed-on, netlink-table-unread,
# netlink-table-gated-by-dash-X, and users-resolved-after-help, which mutates
# main.rs's call the unit tests do not reach); pwd-warnings-never is now
# killed by the unit gate, by tests/stdout_errors.rs's control run.
#
# Rules with no mutant here, each equivalent in what any run can show:
# * `socket_row` builds its unlisted row only for what `stat`s as a socket (a
#   `socket:[N]` link always does).
# * Safety only: `sock_proto_name` reads the attribute through the pinned
#   `/proc/self/fd/K`, not through the owner's link. Mutated to the link, every
#   run prints the same (both name the same socket unless its owner swaps the
#   descriptor in the microseconds between, which no run can arrange); the
#   guard is that the swapped-in file is never asked. The readlink identity
#   check, which xattr-identity-by-fstat and xattr-inode-unchecked pin, is
#   what keeps a FUSE daemon from being asked at all: a non-socket descriptor
#   is refused before any attribute is read.

[run]
dir = ".."
build = [["cargo", "build", "--release", "--bin", "lsof"]]

[[run.gate]]
name = "unit"
cmd = ["cargo", "test", "-p", "lsof-core", "-p", "lsof-cli", "-p", "lsof-backend-linux"]
timeout = 1200

[[run.gate]]
name = "differential"
cmd = ["unshare", "-m", "--propagation", "private", "python3", "differential/linux_diff.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]
timeout = 2400

# ------------------------------------------------------------------- 114

[[mutant]]
name = "help-on-stdout"
rule = "-h writes the help to stderr (114)"
[[mutant.edit]]
file = "crates/lsof-cli/src/main.rs"
old = '''            write_stderr(&usage());'''
new = '''            print!("{}", usage());'''

# ------------------------------------------------------------------- 116

[[mutant]]
name = "empty-word-given-back"
