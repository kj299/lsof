# Mutants for "build every mapping's row as the C does" (PR #121,
# DIVERGENCES 95, 48, 40 and 96-107): one per rule, each a plausible way to
# get that rule wrong. The kill table is this file, run (porting-kit LESSONS #083):
#
#   cd lsof-rs && sudo python3 ../porting-kit/harnesses/port-mutation/mutate_port.py mutants/mapped-rows.toml
#
# It needs the C oracle built at ../lsof (README: Building), and root: the
# differential runs in a mount namespace of its own (`unshare -m`), since
# fixtures P and DN mount in the run's namespace (run bare, they mounted on
# the host while it lasted), and root brings every fixture up. CI runs only
# --apply-only, which checks that each mutant still fits the code. Run
# 2026-10-04 against master: 30 of 30 killed, 17 by the differential alone, 12
# by it and a unit test, 1 (makedev-legacy) by unit tests alone. The PR had
# recorded 18, 11 and 1: a unit test added in its review catches one more.

[run]
dir = ".."
build = [["cargo", "build", "--release", "--bin", "lsof"]]

[[run.gate]]
name = "unit"
cmd = ["cargo", "test", "-p", "lsof-backend-linux", "-p", "lsof-core", "-p", "lsof-cli"]

[[run.gate]]
name = "differential"
cmd = ["unshare", "-m", "--propagation", "private", "python3", "differential/linux_diff.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]

[[mutant]]
name = "only-absolute-paths"
rule = "a maps path need not start with `/`: rings and relative names are rows (99)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/maps.rs"
old = '''        let Some((maj, min)) = std::str::from_utf8(dev).ok().and_then(parse_dev) else {'''
new = '''        if !path.starts_with(b"/") {
            continue;
        }
        let Some((maj, min)) = std::str::from_utf8(dev).ok().and_then(parse_dev) else {'''

[[mutant]]
name = "path-trimmed"
rule = "a maps path keeps trailing blanks and CR (99)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/maps.rs"
old = '''            Some(start) => &rest[start..],'''
new = '''            Some(start) => rest[start..].trim_ascii(),'''

[[mutant]]
name = "path-cut-at-tab"
rule = "a maps path keeps its TAB, unlike the C (103, C-DEFECT)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/maps.rs"
old = '''            Some(start) => &rest[start..],'''
new = '''            Some(start) => {
                let p = &rest[start..];
                &p[..p.iter().position(|&b| b == b'\t').unwrap_or(p.len())]
            }'''

[[mutant]]
name = "names-that-are-no-path-stated"
rule = "a name that is no path is never stat()ed (102, C-DEFECT)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/maps.rs"
old = '''        _ if !bytes.starts_with(b"/") => Err(std::io::Error::from_raw_os_error(ENOENT)),
'''
new = ''''''

