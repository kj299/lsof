rule = "an attached value opening with - or + is given back to be read as letters (GOx1 = GObk[0], 92)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''    if gives_back(chars, j) {
        return None;
    }'''
new = '''    if gives_back(chars, j) && j == usize::MAX {
        return None;
    }'''

[[mutant]]
name = "attached-dash-value-dropped"
rule = "the letters an option gave back are read again (92)"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''    if gives_back(chars, j) {
        j + 1
    } else {'''
new = '''    if gives_back(chars, j) {
        chars.len()
    } else {'''
