# Mutants for the rest of -E/+E on Linux and the rest of row 92
# (2026-11-06): DIVERGENCES 56 (a UNIX socket's peer and a listener's
# pending connection, from NETLINK_SOCK_DIAG; a pseudoterminal's other side;
# an eventfd's and a POSIX message queue's other rows) and 92 (an option
# value that is not UTF-8 says the C's own words). One per rule. The kill
# table is this file, run (porting-kit LESSONS #083):
#
#   cd lsof-rs && python3 ../porting-kit/harnesses/port-mutation/mutate_port.py --first-kill mutants/endpoints-rest.toml
#
# It needs the C oracle built at ../lsof (README: Building) and root: the
# differential's LSOF_DIFF_MT=mqueue mode mounts the mqueue file system in
# a mount namespace of each run's own. CI runs only --apply-only.
#
# Run 2026-11-07 as root with --first-kill, in two batches (--only): 26 of
# 26 killed, 22 by the unit gate and 4 by the differential alone
# (unix-tables-not-handed-to-the-core, unix-dump-not-asked,
# pty-index-not-read, mqueue-device-not-handed-to-the-core). Mutants of
# other files re-anchored on the code this batch changed (inet-grammar
# inet-spec-not-escaped; small-rows inet-holders-first-first and
# endpoint-text-escaped-twice) were rerun alone: 3 of 3 killed by the unit
# gate.
#
# Run 2026-11-07 as root with --first-kill (the reviews' fixes): the 24 new
# mutants and the 5 whose anchors moved (unix-dump-not-asked,
# diag-attributes-unaligned, text-option-K-refuses, diag-done-read-on,
# unix-pending-connection-not-named): 29 of 29 killed, 26 by the unit gate
# and 3 by the differential alone (unix-dump-not-asked,
# fd-10000-column-printed-whole, unix-question-not-asked-at-a-socket).
#
# Rules with no mutant here, each pinned elsewhere or equivalent:
# * The C's words when the request cannot be sent or the kernel answers
#   NLMSG_ERROR (`diag.rs` `unix_ends`): no gate can make the kernel refuse
#   one request of one process; measured by hand with strace's fault
#   injection (`-e inject=sendto:error=EPERM`, and the C's `sendmsg`), and
#   the parser's `Step::Error` is pinned by `an_error_reply_ends_the_dump`.
# * A netlink socket that cannot be made (`netlink socket error: …`, then
#   the C's `Error()`: exit 1, nothing listed, nothing more said; `files.rs`
#   `GatherCtx::stopped`, `backend.rs` `BackendError::Reported`): measured
#   with `-e inject=socket:error=EAFNOSUPPORT` (and `when=2+` under -r),
#   byte-identical to the C; no gate can refuse the socket.
# * The dump asked only under -E/+E (`backend.rs`): no output shows it, so
#   no gate. Measured with strace (no `socket(AF_NETLINK…)` without -E, nor
#   under -E in a PID namespace holding no socket, or only a bound netlink,
#   a packet or a raw socket); the resource gate's whole-host and
#   whole-host-E cases measure the cost. Where it is asked is pinned:
#   unix-question-* below.
# * Only the kernel's answer read (`diag.rs` `unix_ends`: `connect()` to
#   port 0, the sender's port checked, the whole-dump deadline): no output
#   shows any of them and no gate can forge a sender; measured with a root
#   process's unicast to the port (THREAT-MODEL §2). The sequence number
#   is pinned (diag-other-sequence-read, diag-sequence-0).
# * The backstop that leaves a record or attribute by at least its header's
#   length (`len.max(NLMSG_HDRLEN)`, `len.max(RTA_HDRLEN)`): EQUIVALENT
#   while the minimum-length checks hold, which
#   diag-*-shorter-than-its-header-read pin; with either check gone it is
#   what keeps the reader moving, so those mutants end in the unit gate's
#   assertion, not a hang.
# * The row-92 gate's call site (`if stand_ins && text_option`): EQUIVALENT
#   on Linux, where no option outside `reads_value_as_text` reads a value as
#   text (`-c`, `-u`, `+d`/`+D`, `-e`/`+e` read bytes; `-o`, `-r`, `-S`, `-L`
#   digits; measured over every letter, both prefixes); pinned on Windows,
#   where `-c` reads text, by
#   `an_option_outside_the_text_options_still_refuses_a_value_not_utf8`, and
#   the list itself by text-option-* and
#   `the_options_that_read_a_value_not_utf8_as_text`.
# * The checks of a record's and an attribute's length against what is left
#   (`len > rest.len()`, `len > attrs.len()` in `diag.rs`): EQUIVALENT for
#   any kernel output, defence in depth (a truncated record typed DONE or
#   ERROR would, without the record check, end the dump rather than the
#   buffer; the kernel never sends one). Every slice after them is taken with
#   `get()`, which answers `None` past the end, so without the check the
#   record or attribute is read as empty and the loop ends the same way;
#   the fuzz target `netlink_diag` holds the no-panic contract.
# * The 64 MiB and 5 s bounds of one dump: no host's table is near either.

[run]
dir = ".."
build = [["cargo", "build", "--release", "--bin", "lsof"]]

[[run.gate]]
name = "unit"
cmd = ["cargo", "test", "-p", "lsof-core", "-p", "lsof-cli", "-p", "lsof-backend-linux"]
timeout = 1200

[[run.gate]]
name = "differential"
cmd = ["unshare", "-m", "--propagation", "private", "python3", "differential/linux_diff.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]
timeout = 2400

