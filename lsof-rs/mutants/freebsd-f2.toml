# Mutants for DIVERGENCES 142-147 (FreeBSD F2, 2026-11-20): +f c/f/g/n,
# the bounded calls' helper, KQUEUE's DEVICE, the /dev table, -T f. Written
# from the C's FreeBSD dialect and FreeBSD 14.3/15.0's headers; no FreeBSD
# host runs them, so every gate is a unit suite that runs on Linux: the
# FreeBSD backend's pure modules and its helper (cfg(test) on any Unix),
# lsof-core's renderers and model, and lsof-cli's parser (whose c/f/n
# letters a test turns on off FreeBSD). One per rule, bound and branch the
# change added. The F2 review fixes (2026-11-20) rewrote the helper on the
# Linux helper's design and added the device cache, the shown NAME and the
# routing socket's queues; their mutants follow the first set.
#
#   cd lsof-rs && python3 ../porting-kit/harnesses/port-mutation/mutate_port.py --first-kill mutants/freebsd-f2.toml
#
# Run 2026-11-20 after the review fixes, --first-kill: 91 mutants, 91 killed
# (unit-bsd 69, unit-core 20, unit-cli 2).
#
# Not mutated, and why: the FreeBSD-only lines (main.rs's dispatch, the
# backend's start-of-run read of /dev and its exit, sys.rs's closefrom,
# lsof-core's FreeBSD errno numbers, FreeBSD's help words) compile on no
# Linux test; a directory whose read fails part way (map_while) needs a file
# system that fails one; a link past MAX_NAME from the helper's side needs a
# link no kernel makes.

[run]
dir = ".."
build = [["cargo", "build", "-p", "lsof-backend-freebsd", "-p", "lsof-core", "-p", "lsof-cli"]]

[[run.gate]]
name = "unit-bsd"
cmd = ["cargo", "test", "-p", "lsof-backend-freebsd", "--lib"]
timeout = 900

[[run.gate]]
name = "unit-core"
cmd = ["cargo", "test", "-p", "lsof-core", "--lib", "--test", "golden"]
timeout = 900

[[run.gate]]
name = "unit-cli"
cmd = ["cargo", "test", "-p", "lsof-cli", "--lib"]
timeout = 900

