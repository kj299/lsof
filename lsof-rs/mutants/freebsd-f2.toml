[[mutant.edit]]
file = "crates/lsof-backend-freebsd/src/rows.rs"
old = "node: xfile.map(|x| ka(if vnode { x.vnode } else { x.data })),"
new = "node: xfile.map(|x| ka(if vnode { x.data } else { x.vnode })),"

[[mutant]]
