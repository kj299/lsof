# Mutants for DIVERGENCES 142-147 (FreeBSD F2, 2026-11-20): +f c/f/g/n,
# the bounded calls' helper, KQUEUE's DEVICE, the /dev table, -T f. Written
# from the C's FreeBSD dialect and FreeBSD 14.3/15.0's headers; no FreeBSD
# host runs them, so every gate is a unit suite that runs on Linux: the
# FreeBSD backend's pure modules (cfg(test) on any Unix) and lsof-core's
# renderers. The parser's c/f/n letters are cfg(target_os = "freebsd") and
# have no mutant here (no Linux test can see them; they are type-checked by
# the freebsd-cross job). One per rule, bound and branch the change added.
#
#   cd lsof-rs && python3 ../porting-kit/harnesses/port-mutation/mutate_port.py --first-kill mutants/freebsd-f2.toml
#
# Run 2026-11-20 with --first-kill: 47 mutants, 46 killed (unit-bsd 28,
# unit-core 18); name-length-unbounded survived (no case had a length just
# past MAX_NAME), a case was added, and it was re-run alone: killed.

[run]
dir = ".."
build = [["cargo", "build", "-p", "lsof-backend-freebsd", "-p", "lsof-core"]]

[[run.gate]]
name = "unit-bsd"
cmd = ["cargo", "test", "-p", "lsof-backend-freebsd", "--lib"]
timeout = 900

[[run.gate]]
name = "unit-core"
cmd = ["cargo", "test", "-p", "lsof-core", "--lib", "--test", "golden"]
timeout = 900

[[mutant]]
name = "so-listening-never"
rule = "a listening socket shows its queue lengths, any other its buffers (DIVERGENCES 147)"
[[mutant.edit]]
file = "crates/lsof-core/src/render/sockopt.rs"
old = "let listening = options & SO_ACCEPTCONN != 0;"
new = "let listening = false;"

[[mutant]]
name = "so-linger-only-positive"
rule = "LINGER=%d of so_linger whenever it is not 0, a negative one too"
[[mutant.edit]]
file = "crates/lsof-core/src/render/sockopt.rs"
old = "if x.linger != 0 {"
new = "if x.linger > 0 {"

[[mutant]]
name = "so-options-not-sign-extended"
rule = "so_options is an int16_t the C widens with its sign"
[[mutant.edit]]
file = "crates/lsof-core/src/render/sockopt.rs"
old = "let options = i32::from(x.options) as u32;"
new = "let options = u32::from(x.options as u16);"

[[mutant]]
name = "ss-printed-for-buffer-state"
rule = "SS= only where so_state is not 0"
[[mutant.edit]]
file = "crates/lsof-core/src/render/sockopt.rs"
old = "if state != 0 {"
new = "if state != 0 || b.sbs_rcv != 0 {"

[[mutant]]
name = "unknown-without-0x"
rule = "UNKNOWN=%#x"
[[mutant.edit]]
file = "crates/lsof-core/src/render/sockopt.rs"
old = "self.item(&format!(\"UNKNOWN={left:#x}\"));"
new = "self.item(&format!(\"UNKNOWN={left:x}\"));"

[[mutant]]
name = "cantrcvmore-from-state"
rule = "CANTRCVMORE is the receive buffer's state (HASSBSTATE)"
[[mutant.edit]]
file = "crates/lsof-core/src/render/sockopt.rs"
old = "(From::Rcv, 0x20, \"CANTRCVMORE\"),"
new = "(From::State, 0x20, \"CANTRCVMORE\"),"

[[mutant]]
