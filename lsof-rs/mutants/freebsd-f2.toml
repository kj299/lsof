[[mutant.edit]]
file = "crates/lsof-backend-freebsd/src/rows.rs"
old = "let vnode = matches!(k.kind(), kf::TYPE_VNODE | kf::TYPE_FIFO);"
new = "let vnode = matches!(k.kind(), kf::TYPE_VNODE);"

[[mutant]]
