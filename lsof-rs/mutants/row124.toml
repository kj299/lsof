# Mutants for DIVERGENCES 124 (2026-11-02): with an NFS mount listed, every
# per-file call goes through the bounded layer, as the C's statsafely(), and
# the rows are the C's shapes under -b; with one recorded, a file on it is
# named by its source and is what -N selects. One per rule. The kill table
# is this file, run (porting-kit LESSONS #083):
#
#   cd lsof-rs && python3 ../porting-kit/harnesses/port-mutation/mutate_port.py --first-kill mutants/row124.toml
#
# It needs the C oracle built at ../lsof (README: Building) and root, or
# passwordless sudo: the differential's LSOF_DIFF_MT=nfs mode binds a table
# over /proc/mounts in a mount namespace of each run's own. CI runs only
# --apply-only.
#
# Run 2026-11-02 as root with --first-kill: 25 of 25 killed, 21 by the unit
# gate and 4 by the differential alone (table-read-from-self-mounts,
# has-nfs-not-handed-on, nfs-mounts-not-handed-on, socket-joined-without-a-
# stat, which mutate what only a run with a listed NFS mount reaches).
#
# Fix round, run 2026-11-02 as root with --first-kill, all 46 (the 25 above
# and 21 new): 46 of 46 killed, 42 by the unit gate (table-read-from-self-
# mounts now by `a_table_that_cannot_be_opened_is_the_cs_error`) and 4 by
# the differential alone: nfs-mounts-not-handed-on, socket-joined-without-
# a-stat, excluded-process-read-in-the-walk and gather-process-sockets-per-
# run (the last two by the nfs-listed-dash-b-* cases that compare stderr). maps-inproc was first written without
# its in-process arm and did not build; corrected and rerun alone: killed
# by the unit gate (`under_nfs_a_mapping_is_asked_of_the_layer_and_not_made_here`).
#
# Rules with no mutant here, each pinned elsewhere or equivalent in what a
# run can show:
# * A process's tasks are read before it (`backend.rs`): the order alone of
#   the -b lines, pinned by the differential's
#   nfs-listed-dash-b-K-tasks-first; no edit reorders it in one string.
# * The NFS mounts are handed on newest first (`main.rs`, `.rev()`): no
#   table here records two NFS mounts on one device that both prefix one
#   path; `Selection::nfs_mount_of`'s order is pinned by
#   `nfs_files_are_found_by_their_mount`.
# * A socket-only run keeps only what a `stat` said is a socket
#   (`files.rs`, `row`): a row kept otherwise is no socket, which `-U` and
#   `-i` then drop at selection, so the listing and the exit status are the
#   same (mutated 2026-11-02 to keep the failed rows: survived the full
#   differential, `nfs-listed-dash-b-U` included). Kept for the C's shape,
#   which builds none.
#
# The helper cap (`MAX_WAITING`, fix round) is reached only through helpers
# killed in state D: the unit gate's
# `many_files_on_a_mount_that_never_answers_cost_at_most_the_cap`
# (bounded_calls.rs, root and FUSE) holds 40 descriptors on a mount that
# never answers under `ulimit -n 30`, and the safefs unit test reaches the
# cap with processes not yet dead standing in for them.
#
# The mount_stat_audit gate (fix round): its per-file part is the only
# check that sees a call made in lsof's own process, by strace; a mutant
# that makes a mapping's stat() in lsof (maps-inproc) answers the same and
# lists the same, so neither the unit tests' answers nor the differential
# can tell, and the unit test with a recording layer pins it besides.

[run]
dir = ".."
build = [["cargo", "build", "--release", "--bin", "lsof"]]

[[run.gate]]
name = "unit"
cmd = ["cargo", "test", "-p", "lsof-core", "-p", "lsof-cli", "-p", "lsof-backend-linux"]
timeout = 1200

[[run.gate]]
name = "mount-audit"
cmd = ["python3", "differential/mount_stat_audit.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]
timeout = 900

[[run.gate]]
name = "differential"
cmd = ["unshare", "-m", "--propagation", "private", "python3", "differential/linux_diff.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]
timeout = 2400

