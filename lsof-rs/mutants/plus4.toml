# Mutants for DIVERGENCES 152-154 (2026-11-14): `+n`, `+P`, `+r` and `+m`,
# like the C. One a rule, bound, cap or default: the resolver's
# (`lsof-core/src/dns.rs`: MAXNS, timeout:, attempts:, the waits, rotate,
# edns0, which replies move on, TC, the answer's reading, the NSS statuses),
# the names' (`sockname.rs`: the 4096-byte NAME, PORTTABTHRESH, the failure
# list, the scan, port 0, TCP and UDP alone, the cache, the IPv4-mapped
# rule; `netnames.rs`'s files), the repeat loop's and its grammar's
# (`repeat.rs`, `args.rs`, `timefmt.rs`'s buffer and `%n` scan), and the
# supplement's (`mounts.rs`: its grammar, its messages, the C's stat buffer,
# the bounds). The kill table is this file, run (porting-kit LESSONS #083):
#
#   cd lsof-rs && python3 ../porting-kit/harnesses/port-mutation/mutate_port.py --first-kill mutants/plus4.toml
#
# It needs the C oracle built at ../lsof (README: Building) and root, or
# passwordless sudo, for the differential's fixtures and its `names` modes.
# CI runs only --apply-only.
#
# Run 2026-11-14 as root with --first-kill, in a copy of the tree, the unit
# gate split by crate (`cargo test -p lsof-core --lib`, `-p
# lsof-backend-linux --lib`, `-p lsof-cli`) and the differential narrowed to
# this round's 42 cases (`--matrix` over linux-matrix.toml from its "host and
# service names in NAME" section on): 87 of 94 killed, 45 by lsof-core's
# tests, 15 by the backend's, 23 by the CLI's, and 4 by the differential
# alone (linux-names-off, idle-error-not-in-status,
# plus-m-print-reads-nothing, plus-m-print-lists: main.rs and the default,
# which no unit test runs). The 7 that survived each had a rule no test
# asked (specials-not-escaped, short-datagram-taken, tcp-first-message-only,
# scan-last-entry-wins, helper-stat-not-zeroed, timeout-zeroes,
# j1-leap-day-counted); the tests were added (dns.rs, sockname.rs,
# mounts.rs, and 60 glibc vectors around February 29 in
# lsof-core/tests/timefmt_glibc.txt) and the 7 run again with the whole
# differential as the last gate: 7 of 7 killed, by the unit gates. No code
# changed between the runs, only tests.
#
# Rules with no mutant here, and why:
# * `RES_OPTIONS` ignored in secure-execution mode (`LinuxNames::resolver`):
#   no test runs set-uid; `at_secure` itself is row 38's, unit-tested.
# * A FIFO or device supplement never opened (`supplement_bytes`): with its
#   non-blocking open the refusal is said either way; without both, the
#   unit test waits on the FIFO for ever, which is what it pins.
# * The query's id and the rotate start from `RandomState` (backend's
#   `Net::random`): no output depends on them; `ids_differ` pins spread.
# * `+m not supported` off Linux (`args.rs`): the arm builds on FreeBSD and
#   on Windows, whose cfg-gated args tests pin it there; no Linux gate
#   builds it, and `plus_m_reads_its_file_as_the_c_does` pins Linux.
# * Bounds this file left without a mutant, each given one or a reason in
#   `mutants/plus4-fix.toml` (2026-11-14, the review): query_ptr's
#   65,535-byte buffer (`message-buffer-512`), NAME_KEPT (`name-kept-short`),
#   +m's closed-pipe exit (`plus-m-pipe-exit`), `-Q` and +r's status
#   (`quiet-mutes-idle`), TZIF_MAX_BYTES (`zone-file-max-unbounded`),
#   RESOLV_CONF_LIMIT (now a line's and a file's bound, see there); gone
#   since: SERVICES_KEPT (the scan streams), ZONE_NAME_MAX (names kept
#   whole), MAX_TCP_MESSAGES (the deadline ends the exchange).
#
# Amended 2026-11-14 by the review: `linux-names-off`, which only the
# differential (root) killed, is killed on the CI runner too by
# `crates/lsof-cli/tests/names.rs`; eight anchors moved with the fixes
# (maxns-not-kept, no-default-server, res-options-not-read,
# tcp-first-message-only, tryagain-walks-as-notfound, scan-protocol-case,
# scan-last-entry-wins, json-names-hosts) and were run again: 8 of 8 killed (7 by
# lsof-core's tests, 1 by the CLI's).

[run]
dir = ".."
build = [["cargo", "build", "--release", "--bin", "lsof"]]

[[run.gate]]
name = "unit"
cmd = ["cargo", "test", "-p", "lsof-core", "-p", "lsof-cli", "-p", "lsof-backend-linux"]
timeout = 1200

[[run.gate]]
name = "differential"
cmd = ["unshare", "-m", "--propagation", "private", "python3", "differential/linux_diff.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]
timeout = 2400


