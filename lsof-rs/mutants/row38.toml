new = '''        if count >= 2 {'''

[[mutant]]
name = "rx-does-not-select"
rule = "a command an expression matches is selected (SELCMD)"
[[mutant.edit]]
file = "crates/lsof-core/src/selection.rs"
old = '''                .any(|r| r.is_match(p.command_bytes()))'''
new = '''                .any(|_| false)'''

[[mutant]]
name = "rx-is-no-selector-kind"
