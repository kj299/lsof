[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''let Some(end) = rest.iter().position(|&b| b == b'/') else {'''
new = '''let Some(end) = rest.iter().rposition(|&b| b == b'/') else {'''

[[mutant]]
name = "rx-modifier-twice-said-each-time"
