[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''                self.back_reference = true;'''
new = '''                self.back_reference = false;'''

[[mutant]]
name = "rx-extended-leading-star-is-a-character"
rule = "extended: a repetition with nothing before it is REG_BADRPT"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''                if x {
                    return Err(RegexError::BadRepeat);
                }'''
new = '''                if x && lit.ascii().is_none() {
                    return Err(RegexError::BadRepeat);
                }'''

[[mutant]]
name = "rx-basic-double-repetition-taken"
rule = "basic: a repetition of a repetition is REG_BADRPT"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''            if !x && matches!(self.token.kind, Kind::Star | Kind::OpenDup) {'''
new = '''            if x && matches!(self.token.kind, Kind::Star | Kind::OpenDup) {'''

[[mutant]]
name = "rx-extended-unmatched-close-refused"
rule = "extended: a ) that closes nothing is itself; basic: REG_EPAREN"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''                if !x {
                    return Err(RegexError::Paren);
                }'''
new = '''                if x {
                    return Err(RegexError::Paren);
                }'''

[[mutant]]
name = "rx-caret-after-an-anchor-is-an-anchor"
rule = "basic: ^ after an anchor is a character (^^a matches ^a)"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''                self.fetch(false);
                return Ok(Some(atom(text)));'''
new = '''                self.fetch(true);
                return Ok(Some(atom(text)));'''

[[mutant]]
name = "rx-basic-caret-anchors-anywhere"
rule = "basic: ^ is an anchor only where an expression, group or alternative opens"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''            Some(b'^') if x || caret_here || pos == 0 => Kind::Anchor(r"\A", false),'''
