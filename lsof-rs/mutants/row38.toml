new = '''const RE_DUP_MAX: i64 = 0xffff;'''

[[mutant]]
name = "rx-interval-of-none-kept"
rule = "{0} is nothing at all (glibc's null tree)"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''        if start == 0 && end == 0 {
            return Ok(None);
        }'''
new = '''        if start == 0 && end == 0 && self.extended != self.extended {
            return Ok(None);
        }'''

[[mutant]]
name = "rx-list-trailing-dash-is-a-range"
rule = "a - before the ] is a character"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''                    if token2.kind == BrKind::Close {
                        // A `-` that ends the list is a character.'''
new = '''                    if token2.kind == BrKind::NonMatch {
                        // A `-` that ends the list is a character.'''

[[mutant]]
name = "rx-range-backwards-taken"
rule = "a range whose end is below its start is Invalid range end"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''        if lo > hi {
            return Err(RegexError::Range);
        }'''
new = '''        if lo > hi {
            return Err(RegexError::Collate);
        }'''

[[mutant]]
name = "rx-range-end-past-ascii-taken"
rule = "a range's end past ASCII is Invalid collation character (C.UTF-8)"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''        let (Some(lo), Some(hi)) = (seq(start), seq(end)) else {
            return Err(RegexError::Collate);
        };'''
new = '''        let (Some(lo), Some(hi)) = (seq(start), seq(end)) else {
            return Err(RegexError::Range);
        };'''

[[mutant]]
name = "rx-collating-name-past-ascii-taken"
rule = "[.x.] and [=x=] name a single byte alone"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''        [item @ Item::Char(c)] if c.is_ascii() => Some(*item),'''
new = '''        [item @ Item::Char(_)] => Some(*item),'''

[[mutant]]
name = "rx-icase-keeps-a-class-of-one-case"
rule = "REG_ICASE: [[:upper:]] and [[:lower:]] are [[:alpha:]]"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''        b"upper" | b"lower" if icase => b"alpha",'''
new = '''        b"upper" | b"lower" if icase && name.is_empty() => b"alpha",'''

[[mutant]]
name = "rx-icase-list-read-as-typed"
rule = "REG_ICASE: a list is read in upper case ([Z-a] is [Z-A], refused)"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''            Item::Char(c) if self.icase => Item::Char(c.to_ascii_uppercase()),'''
new = '''            Item::Char(c) if self.icase => Item::Char(c),'''

[[mutant]]
name = "rx-icase-escaped-letter-matches"
rule = "REG_ICASE: an escaped small letter matches nothing (glibc's defect, the C's answer)"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''                Some(b'a'..=b'z') if self.icase => Kind::Never,'''
new = '''                Some(b'a'..=b'z') if self.icase => Kind::Char,'''

[[mutant]]
name = "rx-alpha-takes-ascii-digits"
rule = "[[:alpha:]] takes a digit past ASCII, and no ASCII one"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''        b"alpha" => r"\p{Alphabetic}[\p{Nd}--[0-9]]".to_string(),'''
new = '''        b"alpha" => r"\p{Alphabetic}\p{Nd}".to_string(),'''

[[mutant]]
