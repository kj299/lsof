[[mutant]]
name = "rx-basic-dollar-anchors-anywhere"
rule = "basic: $ is an anchor only where one of those ends"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''                if ends {
                    Kind::Anchor(r"\z", false)'''
new = '''                if ends || !x {
                    Kind::Anchor(r"\z", false)'''

[[mutant]]
name = "rx-interval-open-start-is-one"
rule = "{,m} is {0,m}"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''                    // `{,m}` is `{0,m}`.
                    start = 0;'''
new = '''                    // `{,m}` is `{0,m}`.
                    start = 1;'''

[[mutant]]
name = "rx-interval-limit-raised"
rule = "an interval's count ends at RE_DUP_MAX, 32767"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
