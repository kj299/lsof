old = '''    for (r, hit) in sel.command_regexes.iter().zip(&located.command_regexes) {'''
new = '''    for (r, hit) in sel.command_regexes.iter().zip(&located.command_regexes).rev() {'''

[[mutant]]
name = "rx-search-item-not-escaped"
