# Mutants for DIVERGENCES 38 and 39 (2026-11-11): `-c /regex/[bix]` read as
# glibc's regcomp() reads it and run by the `regex` crate; `-i @name` and
# `-i :name` resolved as the C's gethostbyname2() and getservbyname() resolve
# them from the hosts and services files, and entered as
# enter_network_address() enters them; and the password file read only where
# nsswitch.conf has glibc read it. One per rule, each a plausible way to get
# that rule wrong. The kill table is this file, run (porting-kit LESSONS
# #083):
#
#   cd lsof-rs && python3 ../porting-kit/harnesses/port-mutation/mutate_port.py --first-kill mutants/row38.toml
#
# It needs the C oracle built at ../lsof (README: Building) and root, or
# passwordless sudo: the differential's LSOF_DIFF_MT=names, namesmulti and
# namesnopw modes mount a tmpfs over /etc in a mount namespace of each
# run's own. CI runs only --apply-only.
#
# Run 2026-11-11 as root with --first-kill, after the review's fixes: 169 of
# 169 killed, 118 by lsof-core's unit tests (the gate `unit-core`: the
# translator's, the glibc table's, the nsswitch.conf reader's and the files
# readers'), 47 by lsof-cli's and the Linux backend's, and 4 by the
# differential alone (`names-backend-knows-no-host`,
# `names-backend-knows-no-service` and
# `names-backend-service-reads-no-nsswitch`, the backend's wiring, which no
# unit test reaches, and `names-host-conf-environment-not-read`, which reads
# the environment).
#
# The first run of the first version, of 86, was 83 killed with three
# survivors. `rx-nest-limit-lifted` survived a
# test that held the limit only from far away, and looking at it found
# that the engine counts a concatenation as a nesting level too, so an
# expression inside the translator's limit could pass the engine's: the
# limit is 100 now, the engine's is set above the deepest that writes, both
# are pinned at their edges, and `rx-engine-nest-limit-at-the-translators`
# holds the second. The other two were equivalent mutants and are gone,
# one with the code it showed to be dead: `b and x regexp modifiers
# conflict` can arise once a value at most (the "said once" guard guarded
# nothing, in the C either, and went with the review), and a `]` that opens
# a list needs no marking as a character, since `parse_bracket_element()`
# reads the list's first token as one whatever it is.
#
# The safety review of that version then found 13 mutants no gate killed,
# by hand: bounds (the configuration files' limit, the addresses kept, the
# resolver's answers kept and asked once), host.conf's and nsswitch.conf's
# terminators, a services line's junk after its port, the bracket name's
# length. Each is a mutant below now, or gone with code it showed to be
# dead: host.conf's keyword need not end at a `#` or a `,`, nor its line at
# a NUL, for the answer to be glibc's (what follows the keyword must open
# with `on` or `off` either way). With them are a mutant for each bound and
# each rule the review's fixes brought: the cost and size limits and what
# each construct costs, the `$` look-ahead, the alternation's groups, the
# answers kept, the line and file limits, what is no regular file,
# nsswitch.conf's parser and the walk through its sources, `compat`'s
# lines, `AT_SECURE` and RESOLV_HOST_CONF. Nine of the first 85 were
# replaced with the code they changed (`nsswitch_files_first` and
# `nsswitch_reads_passwd_file` are `nsswitch_database` and `nss_walk`).

[run]
dir = ".."
build = [["cargo", "build", "--release", "--bin", "lsof"]]

# lsof-core's tests first, in a gate of their own: most of these rules are
# its, and cargo would run them last (after lsof-cli's bounded-call tests,
# over a minute a mutant).
[[run.gate]]
name = "unit-core"
cmd = ["cargo", "test", "-p", "lsof-core"]
timeout = 600

[[run.gate]]
name = "unit"
cmd = ["cargo", "test", "-p", "lsof-cli", "-p", "lsof-backend-linux"]
timeout = 1200

[[run.gate]]
name = "differential"
cmd = ["unshare", "-m", "--propagation", "private", "python3", "differential/linux_diff.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]
timeout = 1800

[[mutant]]
name = "rx-option-reads-a-slash-value-as-a-name"
rule = "a -c value that opens with / is a regular expression, not a name"
[[mutant.edit]]
file = "crates/lsof-cli/src/args.rs"
old = '''if value.as_encoded_bytes().starts_with(b"/") {'''
new = '''if value.as_encoded_bytes().starts_with(b"/no") {'''

[[mutant]]
