[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''let mut pattern = String::from(if icase { "(?si)" } else { "(?s)" });'''
new = '''let mut pattern = String::from(if icase { "(?i)" } else { "" });'''

[[mutant]]
name = "rx-icase-not-written"
rule = "REG_ICASE is the engine's i flag"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''let mut pattern = String::from(if icase { "(?si)" } else { "(?s)" });'''
new = '''let mut pattern = String::from(if icase { "(?s)" } else { "(?s)" });'''

[[mutant]]
name = "rx-basic-backslash-bar-is-a-character"
rule = "\\| is alternation in a basic expression (glibc)"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''                Some(b'|') if !x => Kind::Alt,'''
new = '''                Some(b'|') if !x => Kind::Char,'''

[[mutant]]
name = "rx-basic-backslash-plus-is-a-character"
