[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''                Some(b'+') if !x => Kind::Plus,'''
new = '''                Some(b'+') if !x => Kind::Char,'''

[[mutant]]
name = "rx-back-reference-to-no-group-accepted"
rule = "\\N for a group not yet closed is Invalid back reference"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex.rs"
old = '''                if self.completed & (1u16 << n) == 0 {'''
new = '''                if self.completed & (1u16 << n) == 0 && n > 9 {'''

[[mutant]]
name = "rx-back-reference-matches-nothing-silently"
