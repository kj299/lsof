# Mutants for DIVERGENCES 38's three DEBTs (2026-11-19): a back-reference in
# `-c /regex/` is matched by lsof-rs's own engine, by every binding of the
# groups, and an expression past the `regex` crate's bounds (its cost bound,
# its program's size) is answered by that engine too. One per bound, rule
# and default the engine added, each a plausible way to get it wrong. The
# kill table is this file, run (porting-kit LESSONS #083):
#
#   cd lsof-rs && python3 ../porting-kit/harnesses/port-mutation/mutate_port.py --first-kill mutants/regex-parity.toml
#
# The gates are row38.toml's: lsof-core's tests first (the translator's,
# the engine's, the glibc table's and the back-reference table's), then
# lsof-cli's and the Linux backend's, then the differential, which needs
# the C oracle built at ../lsof and root.

[run]
dir = ".."
build = [["cargo", "build", "--release", "--bin", "lsof"]]

[[run.gate]]
name = "unit-core"
cmd = ["cargo", "test", "-p", "lsof-core"]
timeout = 900

[[run.gate]]
name = "unit"
cmd = ["cargo", "test", "-p", "lsof-cli", "-p", "lsof-backend-linux"]
timeout = 1200

[[run.gate]]
name = "differential"
cmd = ["unshare", "-m", "--propagation", "private", "python3", "differential/linux_diff.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]
timeout = 1800

