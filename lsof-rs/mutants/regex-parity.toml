# ------------------------------------------- the fix after the reviews
# (2026-11-20): every start searched in turns, the regular look first, a
# group checked against where it is named, finished states shared, the
# groups a node always sets, towupper()'s simple mapping, a byte under i.
# Left out as equivalent: dropping, before a pass, a group the pass reads
# as well as sets (it reads it only after setting it: a back-reference
# before its group closes is refused), so `again` is all the pass sets.
# The "cost" mutants change no answer, only the steps a search takes; the
# step counts of `the_search_takes_few_steps` kill them.

