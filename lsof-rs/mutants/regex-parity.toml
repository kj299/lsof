# ------------------------------------- a repetition a pass at a time (2026-11-20)
#
# The second review's F1: a repetition whose passes set groups read after it
# had been answered by every way it ends, with every group it sets, and ran
# out of budget on 15-byte names glibc matches in milliseconds. It is walked
# a pass at a time now; a group nothing after can read is taken as unset;
# and what the search holds is bounded (F2).
#
# Taken out, as their code went or as equivalent:
# - rx-repetition-groups-not-checked: a repetition's end was checked as a
#   closed group is; with a group nothing can read taken as unset as the
#   passes set it, the check found what that had found (the most it saved
#   was 411 of 886,523 steps), and it went.
# - rx-repetition-cap-without-the-groups: `cap` counted, past `n + 1`
#   passes, one that matches nothing for each group it may set to nothing.
#   Passes that match nothing are made at once now, every set of groups
#   they can set from one state (`Search::empty`), so no further pass is
#   needed for one: a pass that sets a group a later one reads in a back-
#   reference to it is the same pass, or one of a repetition inside it
#   (an alternative's group named in another is `Invalid back reference`).
#   The cap past which a most is no most counts what a pass may do, as
#   before; no case found tells `n + 2` from it.
# - in may_read, a later repetition that reads the group: the group is
#   under the repetition the state is at, so a back-reference to it after
#   that repetition, inside one the walk is in, is textually after it, and
#   is reached as a node of the pass first; where it cannot read the text
#   there it fails there (nothing between sets the group), so the answer is
#   the same either way. The test is kept as the sound one.
# - in may_read, a node that sets the group for sure, and the group's own
#   end: nothing after the repetition holds the group, so neither is ever
#   reached; both went.

