# --------- 158: COMMAND and TASKCMD are cut between the bytes of a character

[[mutant]]
name = "command-cut-by-whole-characters"
rule = "each byte that is not ASCII is an escape of its own, four wide (158)"
[[mutant.edit]]
file = "crates/lsof-core/src/render/escape.rs"
old = '''            let w = if byte.is_ascii() {
                escaped_width(char::from(byte), Mode::Command, self.backslash)
            } else {
                4
            };'''
new = '''            let w = if byte.is_ascii() {
                escaped_width(char::from(byte), Mode::Command, self.backslash)
            } else if byte & 0xc0 == 0x80 {
                0
            } else {
                4 * (byte.leading_ones().max(1) as usize)
