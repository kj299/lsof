# Mutants for the Linux audit fixes (2026-11-21): DIVERGENCES 156 (a link
# that is no path is named up to its first colon: namespace files, and
# Linux 6.9's `pidfd:[N]`), 157 (a pidfd whose process has been reaped is
# `[pidfd]`), 158 (COMMAND and TASKCMD are cut between the bytes of a
# character), 159 (ping sockets from `/proc/net/icmp`), 160 (no socket row
# carries a lock), 161 (fdinfo's numbers as `strtoul()` reads them: a
# negative `pos:`), 162 (an eventpoll's list is marked at 32), 163 (a
# descriptor whose link will not read has no access letter), 165 (under -E
# a `-c ^` still fails every `-c`), 166 (lsof's own `/proc` and
# `/proc/PID/fd` rows) and 168 (`-c ^`, the exclusion with no name). One or
# more per rule. The kill table is this file, run (porting-kit LESSONS
# #083):
#
#   cd lsof-rs && python3 ../porting-kit/harnesses/port-mutation/mutate_port.py --first-kill mutants/audit-linux.toml
#
# It needs the C oracle built at ../lsof (README: Building) and root, or
# passwordless sudo: the differential's fixture PING makes a network
# namespace of its own, and its `LSOF_DIFF_MT` modes `ping`, `pidns` and
# `pidns-outer` enter one or make a PID namespace for each run. CI runs
# only --apply-only.
#
# The unit gates are the three crates' own unit tests, a crate a gate, the
# backend's first (most of these mutants are its). Then `integration`,
# lsof-cli's `tests/audit_rows.rs`: lsof run as a process of its own, and
# beside a ping socket in a network namespace made for it. Its own `/proc`
# row is the one rule here no unit test can pin: inside a test binary other
# threads hold `/proc` open at any moment, so the row is there whether or
# not the gather keeps its own directory. The differential is the last
# gate, and no mutant here is left to it (the three it alone killed at
# first, `proc-not-held-by-the-gather`, `icmp-table-not-read` and
# `icmp-table-gated-by-dash-x`, are the integration test's and the unit
# test `the_load_reads_the_ping_table_with_and_without_dash_x`'s now).
#
# Run of 2026-11-21, on the tree as committed: 56 mutants, 56 KILLED
# (unit-backend 44, unit-core 5, unit-cli 6, integration 1:
# `icmp-table-read-from-icmp6`). `proc-not-held-by-the-gather` is killed
# by the backend's own test of the gather in a run where no other test
# thread holds `/proc` open at that moment (this run; not the first), and
# by `integration` in every run: `lsof_lists_its_own_proc_and_fd_directories`
# fails on it by itself. Each of the three the differential alone had
# killed was also run against the whole differential once more, by itself
# and with no other differential alive on the machine: it fails for the
# mutant's own cases and no other (`own-rows-proc-is-open-for-the-scan`,
# `own-rows-name-the-proc-file-system` and `own-rows-descriptor-numbers`;
# five `ping-sockets-*`; `ping-sockets-are-not-gated-by-X`), no timeout.
#
# Rules with no mutant here, each pinned elsewhere:
# * 164 (lsof in a PID namespace whose `/proc` is the host's): no code of
#   lsof-rs's follows the C there; the three ledgered `pidns-outer-*` cases
#   pin what the C does and that lsof-rs reads fdinfo all the same.
# * The helper's pipes among lsof's own descriptors (123): the ledgered
#   `own-rows-descriptor-numbers` pins the numbers on both sides.

[run]
dir = ".."
build = [["cargo", "build", "--release", "--bin", "lsof"]]

[[run.gate]]
name = "unit-backend"
cmd = ["cargo", "test", "-p", "lsof-backend-linux", "--lib"]
timeout = 1200

[[run.gate]]
name = "unit-core"
cmd = ["cargo", "test", "-p", "lsof-core", "--lib"]
timeout = 1200

[[run.gate]]
name = "unit-cli"
cmd = ["cargo", "test", "-p", "lsof-cli", "--lib", "--bins"]
timeout = 1200

[[run.gate]]
name = "integration"
cmd = ["cargo", "test", "-p", "lsof-cli", "--test", "audit_rows"]
timeout = 1200

[[run.gate]]
name = "differential"
cmd = ["unshare", "-m", "--propagation", "private", "python3", "differential/linux_diff.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]
timeout = 2400

# ---------------- 156: a link that is no path is named up to its first colon

