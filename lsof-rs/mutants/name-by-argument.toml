# Mutants for "name a located row by its search item, as the C binds it"
# (DIVERGENCES 139, 17, 125, 84): one per rule, each a plausible way to get
# that rule wrong. The kill table is this file, run (porting-kit LESSONS
# #083):
#
#   cd lsof-rs && sudo python3 ../porting-kit/harnesses/port-mutation/mutate_port.py mutants/name-by-argument.toml
#
# It needs the C oracle built at ../lsof (README: Building) and root: the
# differential runs in a mount namespace of its own (`unshare -m`), as fixture
# DN mounts there and comes up only for root or passwordless sudo. CI runs only
# --apply-only, which checks that each mutant still fits the code.
#
# Run 2026-10-18 with --first-kill: 15 of 15 killed, 13 by the unit gate
# first, and plus-d-directory-keeps-its-slashes and socket-by-its-path-first
# by the differential alone (`path-plus-d-doubled-slash-names-the-directory-
# without-it`, `path-unix-socket-by-its-file-before-its-path`). id-mask-full
# survived the first run; `the_buckets_are_the_cs` now asks an inode whose
# bucket the odd mask decides, and kills it.
#
# Added after review, run 2026-10-18 through every gate: socket-id-known-no-
# path-fallback killed by the unit gate (`a_socket_whose_file_no_item_names_
# is_located_by_its_path`) and the differential (`path-unix-socket-by-its-
# path-when-no-item-has-its-file`, fixture P); naming-where-names-are-matched
# killed by the unit gate alone (`a_located_row_is_named_by_its_item` gives a
# name-matched item an identity, which no name-matching backend does, so no
# differential can see it).
#
# Mutants the differential cannot see, and the unit tests that kill them:
# chain-takes-the-last needs an argument whose inode falls in another's hash
# bucket, which no fixture arranges (`a_row_locates_the_one_item_the_cs_chain_
# meets_first`); name-hash-unsigned and id-mask-full need such a collision too
# (`the_buckets_are_the_cs`); addition-dropped needs a located row with an
# addition (`a_new_base_keeps_the_addition`); and the two file-system mutants
# need two mounts of one device (`a_file_system_argument_names_every_mount_it_
# matches`).

[run]
dir = ".."
build = [["cargo", "build", "--release", "--bin", "lsof"]]

[[run.gate]]
name = "unit"
cmd = ["cargo", "test", "-p", "lsof-backend-linux", "-p", "lsof-core", "-p", "lsof-cli"]
timeout = 900

[[run.gate]]
name = "differential"
cmd = ["unshare", "-m", "--propagation", "private", "python3", "differential/linux_diff.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]
timeout = 1200

[[mutant]]
name = "never-renamed"
rule = "a row a file item locates is named by it (139, 17)"
[[mutant.edit]]
file = "crates/lsof-core/src/selection.rs"
old = '''    fn rename_located(&self, ix: &PathIndex<'_>, f: &mut OpenFile) {
        if f.is_socket() {'''
new = '''    fn rename_located(&self, ix: &PathIndex<'_>, f: &mut OpenFile) {
        if true {'''

[[mutant]]
name = "sockets-renamed"
rule = "a socket keeps its own name: the C entered it before it asks (139)"
[[mutant.edit]]
file = "crates/lsof-core/src/selection.rs"
old = '''    fn rename_located(&self, ix: &PathIndex<'_>, f: &mut OpenFile) {
        if f.is_socket() {'''
new = '''    fn rename_located(&self, ix: &PathIndex<'_>, f: &mut OpenFile) {
        if false {'''

