[[mutant]]
name = "file-system-before-the-file"
rule = "a row is looked up by identity first, by file system only after (125)"
[[mutant.edit]]
file = "crates/lsof-core/src/selection.rs"
old = '''        if let Some(i) = f.file_id().and_then(|id| self.by_identity(&id)) {
            return Some(i);
        }'''
new = '''        if let Some(dev) = f.searched_fs_device() {
            let head = self.fs_heads.get(&dev_ino_bucket(dev, 0, FS_MASK));
            if let Some(i) = Span::first_met(self.by_fs.get(&dev), head) {
                return Some(i);
            }
        }
        if let Some(i) = f.file_id().and_then(|id| self.by_identity(&id)) {
            return Some(i);
        }'''

[[mutant]]
name = "socket-by-its-path-first"
rule = "a socket is asked by its file's identity first, by its path only after (17)"
[[mutant.edit]]
file = "crates/lsof-core/src/selection.rs"
old = '''            return b
                .id
                .as_ref()
                .and_then(|id| self.by_identity(id))
                .or_else(|| {
                    let path = OsStr::new(b.path.as_deref()?);
                    let head = self.name_heads.get(&name_bucket(path));
                    Span::first_met(self.by_name.get(path), head)
                });'''
new = '''            let by_path = b.path.as_deref().and_then(|p| {
                let path = OsStr::new(p);
                let head = self.name_heads.get(&name_bucket(path));
                Span::first_met(self.by_name.get(path), head)
            });
            return by_path.or_else(|| b.id.as_ref().and_then(|id| self.by_identity(id)));'''

