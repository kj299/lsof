# Mutants for DIVERGENCES 39 (2026-11-20): `-u name` and USER asked of the
# C library, as the C asks getpwnam() and getpwuid(), through the new
# workspace crate `lsof-getpw` (getpwnam_r(3), getpwuid_r(3)); glibc not
# asked where nsswitch.conf has it read past a heap block or recurse until
# its stack is gone; the owners' logins asked only for what is printed. One
# per bound, default and branch the change added. The kill table is this
# file, run:
#
#   cd lsof-rs && python3 ../porting-kit/harnesses/port-mutation/mutate_port.py --first-kill mutants/row39.toml
#
# It needs the C oracle built at ../lsof and root: the differential's
# `names-*` modes mount a tmpfs over /etc in a mount namespace of each run's
# own, and the `names-hesiod` cases send Hesiod's TXT queries to the
# harness's own name server on a loopback address. CI runs only
# --apply-only.
#
# Run 2026-11-20 as root with --first-kill: 29 of 29 killed. After the
# safety and parity reviews (the netgroup and passwd_compat guard over every
# line, the second -u lookup's Error(), the logins asked where and as often
# as the C's printuid() asks them, the length told to the C library, FreeBSD
# as Linux), re-run as root with --first-kill: 47 mutants, all killed; 4 by
# differential-accounts alone (where glibc is asked, the lost -u login, the
# LOGINML cut of glibc's answer). One mutant (the list glibc keeps looked at
# beside every line) survived as equivalent and its code was removed; the
# guard's mutants were then re-run on the code that remains: killed.

[run]
dir = ".."
build = [["cargo", "build", "--release", "--bin", "lsof"]]

[[run.gate]]
name = "unit-getpw"
cmd = ["cargo", "test", "-p", "lsof-getpw", "-p", "lsof-core", "--lib"]
timeout = 600

[[run.gate]]
name = "unit"
cmd = ["cargo", "test", "-p", "lsof-backend-linux", "-p", "lsof-cli", "--lib", "--bins"]
timeout = 1200

[[run.gate]]
name = "unit-bsd"
cmd = ["cargo", "test", "-p", "lsof-backend-freebsd", "--lib"]
timeout = 600

[[run.gate]]
# The differential's cases in the `names-*` and `passwd*` modes alone (109
# of the matrix's), the C run beside each, so that a mutant only they kill
# is killed in minutes; the whole matrix after it, for any other.
name = "differential-accounts"
cmd = ["sh", "-c", '''m=$(mktemp) && python3 -c 'import sys; s = open("differential/linux-matrix.toml").read().split("\n[[case]]"); open(sys.argv[1], "w").write(s[0] + "".join("\n[[case]]" + c for c in s[1:] if "LSOF_DIFF_MT = \"names" in c or "LSOF_DIFF_MT = \"passwd" in c))' "$m" && unshare -m --propagation private python3 differential/linux_diff.py --oracle ../lsof --rust target/release/lsof --matrix "$m"; r=$?; rm -f "$m"; exit $r''']
infra = [2]
timeout = 900

[[run.gate]]
name = "differential"
cmd = ["unshare", "-m", "--propagation", "private", "python3", "differential/linux_diff.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]
timeout = 1800

# ---- lsof-getpw: the buffer, the call's reading

[[mutant]]
name = "getpw-start-not-glibcs"
rule = "the first buffer is glibc's NSS_BUFLEN_PASSWD, 1024 bytes"
[[mutant.edit]]
file = "crates/lsof-getpw/src/lib.rs"
old = '''pub const START: usize = 1024;'''
new = '''pub const START: usize = 2048;'''

[[mutant]]
name = "getpw-cap-raised"
rule = "the buffer is bounded at 16 MiB"
[[mutant.edit]]
file = "crates/lsof-getpw/src/lib.rs"
old = '''pub const CAP: usize = 1 << 24;'''
new = '''pub const CAP: usize = 1 << 25;'''

[[mutant]]
name = "getpw-buffer-grows-other-than-doubling"
rule = "ERANGE doubles the buffer"
[[mutant.edit]]
file = "crates/lsof-getpw/src/lib.rs"
old = '''size = size.saturating_mul(2).min(cap)'''
new = '''size = size.saturating_mul(4).min(cap)'''

[[mutant]]
name = "getpw-cap-itself-not-asked"
rule = "a buffer of the cap's own size is asked with before ERANGE is the answer"
[[mutant.edit]]
file = "crates/lsof-getpw/src/lib.rs"
old = '''Step::TooSmall if size < cap => size'''
new = '''Step::TooSmall if size < cap / 2 => size'''

[[mutant]]
name = "getpw-erange-at-the-cap-is-no-entry"
rule = "ERANGE at the cap is a failure, kept apart from no entry"
[[mutant.edit]]
file = "crates/lsof-getpw/src/lib.rs"
old = '''Step::TooSmall => return Answer::Failed(ERANGE),'''
new = '''Step::TooSmall => return Answer::NotFound,'''

[[mutant]]
name = "getpw-erange-number-wrong"
rule = "ERANGE is 34 on Linux and FreeBSD"
[[mutant.edit]]
file = "crates/lsof-getpw/src/lib.rs"
old = '''const ERANGE: i32 = 34;'''
new = '''const ERANGE: i32 = 35;'''

[[mutant]]
name = "getpw-empty-buffer-allowed"
rule = "a buffer is never empty, so doubling it grows it"
[[mutant.edit]]
file = "crates/lsof-getpw/src/lib.rs"
old = '''let mut size = start.clamp(1, cap.max(1));'''
new = '''let mut size = start.clamp(0, cap.max(1));'''

[[mutant]]
name = "getpw-name-without-nul-read-to-the-end"
rule = "a name no NUL ends in the buffer is no name"
[[mutant.edit]]
file = "crates/lsof-getpw/src/lib.rs"
old = '''let len = rest.iter().position(|&b| b == 0)?;'''
new = '''let len = rest.iter().position(|&b| b == 0).unwrap_or(rest.len());'''

[[mutant]]
name = "getpw-name-with-nul-not-cut"
rule = "a name is asked up to its first NUL, as a C string"
[[mutant.edit]]
file = "crates/lsof-getpw/src/lib.rs"
old = '''let end = name.iter().position(|&b| b == 0).unwrap_or(name.len());'''
new = '''let end = name.len();'''

[[mutant]]
name = "getpw-erange-not-retried"
rule = "ERANGE asks again with a larger buffer"
[[mutant.edit]]
file = "crates/lsof-getpw/src/lib.rs"
old = '''(ERANGE, _) => Err(Step::TooSmall),'''
new = '''(ERANGE, _) => Ok(Got::Error(ERANGE)),'''

[[mutant]]
name = "getpw-no-result-is-an-entry"
rule = "a call that leaves the result pointer elsewhere than the passwd has no entry"
[[mutant.edit]]
file = "crates/lsof-getpw/src/lib.rs"
old = '''(result == std::ptr::addr_of_mut!(pwd)).then_some('''
new = '''true.then_some('''

[[mutant]]
name = "getpw-no-entry-is-an-error"
rule = "a call that returns 0 and no entry is no account, not a failure"
[[mutant.edit]]
file = "crates/lsof-getpw/src/lib.rs"
old = '''(0, None) => Ok(Got::None),'''
new = '''(0, None) => Ok(Got::Error(0)),'''

[[mutant]]
name = "getpw-uid-entry-without-name-found"
rule = "by uid, an entry whose name is not in the buffer is not found"
[[mutant.edit]]
file = "crates/lsof-getpw/src/lib.rs"
old = '''Ok(Got::Entry { name: None, .. } | Got::None) => Step::Done(Answer::NotFound),'''
new = '''Ok(Got::Entry { uid, name: None }) => Step::Done(Answer::Found(Account { name: Vec::new(), uid })),
        Ok(Got::None) => Step::Done(Answer::NotFound),'''

[[mutant]]
name = "getpw-erange-at-the-cap-not-told-apart"
rule = "an answer past the cap is told apart, so that the caller reads the file"
[[mutant.edit]]
file = "crates/lsof-getpw/src/lib.rs"
old = '''        *self == Answer::Failed(ERANGE)'''
new = '''        *self == Answer::Failed(0)'''

