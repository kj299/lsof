            }'''
new = '''    pub fn stat(&self, path: &Path) -> io::Result<FileStat> {
        match self.blocking.mode() {
            Mode::Avoid => {
                self.avoiding("stat", Self::shown(path));
                self.calls.stat(path, self.blocking.limit)
            }'''

