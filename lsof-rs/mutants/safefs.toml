# Mutants for "bound the calls that can block, and take -b, -S and -O"
# (DIVERGENCES 94, the timeout half of 110, and 118-123): one per rule, each a
# plausible way to get that rule wrong. The kill table is this file, run
# (porting-kit LESSONS #083):
#
#   cd lsof-rs && sudo python3 ../porting-kit/harnesses/port-mutation/mutate_port.py mutants/safefs.toml
#
# It needs the C oracle built at ../lsof (README: Building) and root: the
# differential runs in a mount namespace of its own (`unshare -m`) because
# fixtures P and FH mount, FH mounts a FUSE server, and the unit gate's
# `bounded_calls` tests do the same and skip without root. CI runs only
# --apply-only, which checks that each mutant still fits the code.

[run]
dir = ".."
build = [["cargo", "build", "--release", "--bin", "lsof"]]

[[run.gate]]
name = "unit"
cmd = ["cargo", "test", "-p", "lsof-backend-linux", "-p", "lsof-core", "-p", "lsof-cli"]
timeout = 900

[[run.gate]]
name = "differential"
cmd = ["unshare", "-m", "--propagation", "private", "python3", "differential/linux_diff.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]
timeout = 1200

# ------------------------------------------------------------ the helper --

[[mutant]]
