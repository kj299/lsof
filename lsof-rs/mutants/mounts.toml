# Mutants for "read the mount table only when a run needs it, and as the C's
# readmnt() reads it" (DIVERGENCES 110, with 87, 88, 113 and 115): one per
# rule, each a plausible way to get that rule wrong. The kill table is this
# file, run (porting-kit LESSONS #083):
#
#   cd lsof-rs && sudo python3 ../porting-kit/harnesses/port-mutation/mutate_port.py mutants/mounts.toml
#
# It needs the C oracle built at ../lsof (README: Building), strace, and
# root: the unit gate's namespace tests (tests/bounded_calls.rs, a FUSE mount
# that never answers; tests/arguments.rs, a table of its own) skip without
# it, and the differential's fixtures MT, AUTOFS and FH mount in namespaces of
# their own. CI runs only --apply-only, which checks that each mutant still
# fits the code. The empty-table gate of the -e check is mutated in
# safefs.toml (e-checked-against-an-empty-table), and the reading of the
# table at the first +d (mount-table-under-the-final-options) there too.
#
# Run 2026-10-17, as root with --first-kill: 36 of 36 killed, 35 by the unit
# gate and dash-n-on-every-mount by the differential. The item's review added
# four (load-reads-unbounded, types-reads-unbounded, z-reads-the-stated-table,
# duplicate-test-scans-the-entries) and re-anchored five on code it reshaped;
# run again in full, as root with --first-kill: 40 of 40 killed, 39 by the
# unit gate and dash-n-on-every-mount by the differential (z-reads-the-stated-
# table by the audit as well, run alone without --first-kill). Re-anchored
# 2026-10-30 (Batch A's review): help-before-the-end-of-parse-errors, as the
# errors the C reads on after now end the parse there too, and
# z-reads-the-stated-table, as SELinux is asked while the parse meets -Z
# (DIVERGENCES 114), and errors-after-the-table, as the errors the parse read
# on after now go out through `tell_early`; each killed again.

[run]
dir = ".."
build = [["cargo", "build", "--release", "--bin", "lsof"]]

[[run.gate]]
name = "unit"
cmd = ["cargo", "test", "-p", "lsof-backend-linux", "-p", "lsof-core", "-p", "lsof-cli"]
timeout = 900

[[run.gate]]
name = "audit"
cmd = ["python3", "differential/mount_stat_audit.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]
timeout = 600

[[run.gate]]
name = "differential"
cmd = ["unshare", "-m", "--propagation", "private", "python3", "differential/linux_diff.py", "--oracle", "../lsof", "--rust", "target/release/lsof"]
infra = [2]
timeout = 1800

# ----------------------------------------------------- what is skipped --

[[mutant]]
name = "skip-list-misses-autofs"
rule = "autofs, pipefs and sockfs mounts are skipped before anything is asked: an autofs mount is never stat()ed (110)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/mounts.rs"
old = '''        || [&b"autofs"[..], b"pipefs", b"sockfs"]'''
new = '''        || [&b"pipefs"[..], b"sockfs"]'''

[[mutant]]
name = "automounter-any-colon"
rule = "an automounter's source is one whose FIRST ':' is followed by (pid (110)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/mounts.rs"
old = '''    let automounter = src.iter().position(|&b| b == b':').is_some_and(|colon| {'''
new = '''    let automounter = src.iter().rposition(|&b| b == b':').is_some_and(|colon| {'''

[[mutant]]
name = "automounter-case-sensitive"
rule = "(pid is compared in any case, strncasecmp (110)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/mounts.rs"
old = '''            .is_some_and(|w| w.eq_ignore_ascii_case(b"(pid"))'''
new = '''            .is_some_and(|w| w == b"(pid")'''

[[mutant]]
name = "two-field-line-kept"
rule = "a line of fewer than three fields is no mount (get_fields < 3) (110)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/mounts.rs"
old = '''        let (Some(source), Some(dir), Some(fstype)) = (f.next(), f.next(), f.next()) else {'''
new = '''        let (Some(source), Some(dir), Some(fstype)) = (f.next(), f.next(), f.next().or(Some(&b"none"[..]))) else {'''

[[mutant]]
name = "mounts-read-unbounded"
rule = "/proc/self/mounts is read up to a cap, cut at a whole line (110)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/mounts.rs"
old = '''        .take(cap.saturating_add(1))'''
new = '''        .take(u64::MAX)'''

[[mutant]]
name = "load-reads-unbounded"
rule = "the table's mounts are read through the cap, not around it (129; the item's review)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/mounts.rs"
old = '''    resolve_table(&parse_mounts(&read_capped(path, cap)), req, fs)'''
new = '''    resolve_table(&parse_mounts(&std::fs::read(path).unwrap_or_default()), req, fs)'''

[[mutant]]
name = "types-reads-unbounded"
rule = "-Z's types are read through the cap, not around it (129; the item's review)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/mounts.rs"
old = '''    read_capped(path, cap)
        .split(|&b| b == b'\n')'''
new = '''    std::fs::read(path)
        .unwrap_or_default()
        .split(|&b| b == b'\n')'''

[[mutant]]
name = "duplicate-test-scans-the-entries"
rule = "the duplicate test is a lookup, not a scan of the entries per row: a table the cap lets in costs time linear in its rows (110; the item's review)"
[[mutant.edit]]
file = "crates/lsof-backend-linux/src/mounts.rs"
old = '''        let duplicate = recorded.get(&dir).copied();'''
new = '''        let duplicate = table.entries.iter().position(|m| m.dir == dir);'''

