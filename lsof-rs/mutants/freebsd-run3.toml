# Mutants for the fixes after the two reviews of the FreeBSD first-run work
# (2026-11-21, FreeBSD 14.5-RELEASE amd64): DIVERGENCES 181 (a -s TCP state
# inclusion selects under the OR, whatever -i says), 183 (-c /regex/ by
# FreeBSD libc's regcomp(): its grammar, its words, its classes), 141
# (-K: a process's thread entries share its files). Every rule was measured
# against the C on FreeBSD (the regex rules against FreeBSD 14.5's libc,
# tests/posix_regex_freebsd.txt); every gate is a unit suite that runs on
# Linux.
#
#   cd lsof-rs && python3 ../porting-kit/harnesses/port-mutation/mutate_port.py --first-kill mutants/freebsd-run3.toml
#
# Not mutated, and why: the lines that compile into a FreeBSD build alone
# and so run in no Linux test: args.rs's FreeBSD -k/-m arm (`-k not followed
# by path`, its give-back), stdio.rs's per-write duplicate of descriptor 1,
# and the FreeBSD backend's gather that shares a process's files with its
# threads. Each has its tests on FreeBSD (args.rs's
# `an_illegal_option_character_is_read_past`, `a_dropped_word_is_not_read_as_text`,
# the backend's live tests, differential/freebsd-check.sh), run in the VM.

# Run 2026-11-21 (--first-kill, on a copy of the tree): 32 mutants, 27
# killed (unit-core 26, unit-cli 1), 5 survived. One, state-selects-linux-rows,
# was a missing test (a Linux row in an included state, no -i: added to
# a_freebsd_state_inclusion_is_what_the_bare_i_selects), then KILLED. Four
# were EQUIVALENT and are retired from this table: state-selects-any-state (a
# socket not in the inclusion is vetoed by -s before state_selects is asked),
# fb-empty-alternative-taken (an empty last alternative is refused by the
# next branch's own empty check either way), fb-bar-opens-nothing (p_re()
# stops at a | before p_ere_exp() could see it), fb-class-name-unbounded (no
# class of wctype()'s has a name of 15 letters).

[run]
dir = ".."
build = [["cargo", "build", "-p", "lsof-core", "-p", "lsof-cli", "-p", "lsof-backend-freebsd"]]

[[run.gate]]
name = "unit-core"
cmd = ["cargo", "test", "-p", "lsof-core", "--lib", "--test", "golden", "--test", "posix_regex"]
timeout = 1200

[[run.gate]]
name = "unit-cli"
cmd = ["cargo", "test", "-p", "lsof-cli", "--lib", "--bin", "lsof"]
timeout = 900

[[run.gate]]
name = "unit-fbsd"
cmd = ["cargo", "test", "-p", "lsof-backend-freebsd", "--lib"]
timeout = 900

# --- 181: a state inclusion selects under the OR.

[[mutant]]
name = "state-selects-nothing-without-bare-i"
rule = "a TCP socket in an included state is selected under the OR whatever -i says (181)"
[[mutant.edit]]
file = "crates/lsof-core/src/selection.rs"
old = "                    if states_select && self.state_selects(f) {"
new = "                    if false && states_select && self.state_selects(f) {"

[[mutant]]
name = "state-selects-in-a-process-the-c-drops"
rule = "not in a process is_proc_excl() drops before its files are read (-p Q -s TCP:LISTEN) (181)"
[[mutant.edit]]
file = "crates/lsof-core/src/selection.rs"
old = "            let states_select = !excluded && self.includes_states() && self.selects_process(&p);"
new = "            let states_select = !excluded && self.includes_states();"

[[mutant]]
name = "state-selects-linux-rows"
rule = "the rule is FreeBSD's rows' alone: Linux's C gives SELNET only for -i (181)"
[[mutant.edit]]
file = "crates/lsof-core/src/selection.rs"
old = "                s.is_bsd()\n                    && s.filter_state()"
new = "                s.filter_state()"

[[mutant]]
name = "state-exclusion-includes"
rule = "an exclusion alone includes nothing (181)"
[[mutant.edit]]
file = "crates/lsof-core/src/selection.rs"
old = "            .is_some_and(|s| !s.include.is_empty())"
new = "            .is_some()"

