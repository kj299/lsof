# --- C4 (2026-11-21): the two reviews of 9a3fcc6. The safety review's LOW-1
# (the guard that bounds fb_re()'s recursion, and the case lists' bound),
# the parity review's 1 (`\X` before a non-letter Unicode calls
# alphabetic), 2 (REG_ICASE by FreeBSD's case sets and tables), 3 (a FreeBSD
# command that is not UTF-8 keeps its bytes), and the safety review's INFO-1
# (a kept list is made of the rows kept; a list is copied only where a row
# is renamed). Each rule measured in the FreeBSD 14.5 VM (the golden table,
# 2,708 expressions against 116 commands, and the CHIN() oracle of
# a_list_under_icase_takes_what_chin_takes, read from regcomp.c).

[[mutant]]
name = "fb-nest-guard-deleted"
rule = "fb_re() refuses past NEST_LIMIT before it recurses: 200,000 groups are Size, not a stack overflow (safety LOW-1)"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex/freebsd.rs"
old = "        if nest > NEST_LIMIT {\n            return Err(RegexError::Size);\n        }\n        let outer = end == End::Out;"
new = "        let outer = end == End::Out;"

[[mutant]]
name = "fb-escape-before-alphabetic"
rule = "may_escape() refuses a letter alone (iswalpha, category L): a backslash before a letter number is taken (parity 1)"
[[mutant.edit]]
file = "crates/lsof-core/src/posix_regex/freebsd.rs"
old = "        !(c == '\\'' || c == '`' || is_letter(c))"
