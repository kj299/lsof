# feature-inventory — lsof-rs (the Rust port of lsof, Windows and Linux)
#
# [features] is the C's FULL enumerated surface, extracted from src/main.c and
# lib/print.c by the kit's coverage gate, plus lsof-rs's own Windows-native TYPE
# codes. Waivers SUBTRACT from it. Keeping the whole C surface here is the point:
# when the C grows a feature, it shows up as uncovered rather than never being
# noticed, and the waiver list is a reviewable record of every conscious
# exclusion (LESSONS #8 — nothing is dropped silently).
#
# Gate, once per platform (a waiver can be scoped to one; see README.md):
#        python3 ../../porting-kit/harnesses/coverage/coverage_gate.py \
#          --inventory feature-inventory-lsof-rs.toml --matrix coverage-matrix.toml \
#          --platform linux     (and again with --platform windows)

[features]
options = [
  "A", "C", "D", "E", "F", "H", "J", "K", "L", "M", "N", "O", "P", "Q", "R",
  "S", "T", "U", "V", "X", "Z", "a", "b", "c", "d", "e", "f", "g", "h", "i",
  "j", "k", "l", "m", "n", "o", "p", "r", "s", "t", "u", "v", "w", "x", "z"
]
# Options that consume a value, so `-iTCP:80` counts as `i` alone and the
# value's characters are never miscredited as coverage.
takes_value = [
  "A", "D", "F", "K", "L", "S", "T", "Z", "c", "d", "e", "f", "g", "i", "k",
  "m", "o", "p", "r", "s", "u", "x", "z"
]
types = [
  "ATALK", "BLK", "CHR", "DEL", "DIR", "DOOR", "EVENTFD", "FIFO",
  "FSEVENTS", "IPv4", "IPv6", "KQUEUE", "LINK", "MPB", "MPC", "NPOLICY",
  "PAS", "PAXV", "PCRE", "PCTL", "PCUR", "PCWD", "PDIR", "PETY", "PFD",
  "PFDR", "PFIL", "PFPR", "PGD", "PGID", "PIPE", "PLC", "PLDR", "PLDT",
  "PLPI", "PLST", "PLU", "PLWG", "PLWI", "PLWS", "PLWU", "PLWX", "PMAP",
  "PMEM", "PMPS", "PNTF", "POBJ", "PODR", "POLP", "POPF", "POPG", "PORT",
  "PREG", "PRMP", "PROCDSC", "PRTD", "PSGA", "PSIN", "PSTA", "PSXMQ",
  "PSXSEM", "PSXSHM", "PTS", "PUSG", "PW", "PXMP", "REG", "SHM", "SMT",
  "SOCK", "STR", "STSO", "UNKN", "UNKNcwd", "UNKNdel", "UNKNfd", "UNKNmem",
  "UNKNrtd", "UNKNtxt", "UNNM", "UNSP", "VBAD", "VBLK", "VCHR", "VDIR",
  "VLNK", "VMPC", "VNON", "VREG", "XNAM", "XSD", "XSEM", "a_inode", "ax25",
  "icmp", "inet", "ipx", "key", "lla", "ndrv", "netlink", "pack", "ppp",
  "raw", "raw6", "rte", "sock", "systm", "unix", "unknown", "x.25"
]
# Windows-native TYPE codes with no C counterpart — the all-handle scan's
# kernel object types (lsof-core `FileType::code`). Exactly the class that was
# silently dropped until PR #31, so they are required coverage here.
extra = [
  "type:EVT", "type:KEY", "type:MUT", "type:PROC", "type:SECT", "type:THRD",
  "type:TOKN"
]

# ============================================================== waivers
#
# PLATFORM SCOPE. A waiver carries `platforms = [...]` when its *reason* is
# platform-specific. This is not bookkeeping: most of the reasons below were
# written when "Unix" meant "not our platform", and they silently stopped being
# true the day the Linux backend merged. A waiver reading "SELinux contexts" is
# an honest exclusion on Windows and a false one on Linux, and an unscoped gate
# cannot tell the two apart — it stays green either way. Scoping makes that
# expiry a gate failure instead of a comment nobody re-reads.
#
#   platforms omitted     -> valid on every platform (genuinely other-dialect)
#   platforms = [...]     -> valid only there; elsewhere the feature is required
#
# The gate is run once per platform:
#   coverage_gate.py --inventory ... --matrix ... --platform windows
#   coverage_gate.py --inventory ... --matrix ... --platform linux
#
# 1a. Options that are N/A on BOTH backends — other dialects entirely, so no
#     scope is needed. (Reasons from docs/feature-parity-plan.md.)

[[waive]]
id = "opt:A"
reason = "AFS NWA mode — HP-UX/AIX AFS; neither backend's platform has it"

[[waive]]
id = "opt:C"
reason = "kernel name cache — a BSD/Solaris construct; neither Windows nor /proc has one to disable"

[[waive]]
id = "opt:k"
reason = "kernel symbol file — for dialects that read kernel memory; both backends read a documented API instead"

[[waive]]
id = "opt:z"
reason = "Solaris zones"

# 1b. Options waived ONLY on Windows. Each of these is a real feature of the C
#     on Linux, so on that platform the waiver does not apply and the option
#     becomes required — see 1c for the debt this exposes.

[[waive]]
ids = ["opt:M", "opt:N"]
platforms = ["windows"]
reason = "portmapper / NFS — Unix RPC and NFS have no Windows analogue"

[[waive]]
id = "opt:S"
platforms = ["windows"]
reason = "stat/readlink timeout — accepted on Windows since 2026-10-09 and changes nothing there: the bounded layer has no helper on Windows, which makes those calls in-process and bounds its own blocking handle queries by its worker model; no Windows test can observe a limit"

[[waive]]
id = "opt:b"
platforms = ["windows"]
reason = "\"avoid blocking kernel\" — accepted on Windows since 2026-10-09, where it avoids the same calls (a +d/+D directory's stat); the Windows smoke harness has no case for it (the portable unit test `a_plus_d_is_examined_under_the_options_before_it` runs there and pins its `avoiding stat(D)` line), and its blocking handle queries are bounded by the worker model instead"

[[waive]]
ids = ["opt:X", "opt:Z"]
platforms = ["windows"]
reason = "/proc/net socket tables and SELinux contexts — Linux kernel features with no Windows counterpart. (This reason used to read \"epoll bridge\" for `-X`; that is not what `-X` is. `machine.h:502` defines HASXOPT as \"skip TCP&UDP* files\" on this dialect, and the option gates the inet socket tables.)"

[[waive]]
ids = ["opt:e", "opt:f", "opt:m", "opt:x"]
platforms = ["windows"]
reason = "mount-table concepts (exempt FS, FS detail, mtab supplement, cross-mount walk) — Windows has no mount table in this sense"

# 1c. Linux-scoped option waivers. These are the waivers above whose
#     justification was "Unix-only" — true of Windows, false here. Of them, -m
#     and -M are absent from this C's Linux build too (NOT IN THE DIALECT), and
#     -Z is the one still DEBT, declared with what closes it, NOT re-waived as
#     out of scope: a waiver says "we will never do this", and that would be
#     untrue. (-S and -b left this section when they shipped, 2026-10-09.)

[[waive]]
id = "opt:m"
platforms = ["linux"]
reason = "NOT IN THE DIALECT — `lsof -m <file>` on this C answers `-m not supported`. Waived as absent upstream rather than as debt."

[[waive]]
id = "opt:M"
platforms = ["linux"]
reason = "NOT IN THE DIALECT — `lsof -M` on this C answers `illegal option character: M`. Waived as absent upstream rather than as debt: this port owes nothing the reference implementation does not do."

[[waive]]
id = "opt:Z"
platforms = ["linux"]
reason = "DEBT (L2), NARROWED 2026-09-20: the gate ships and matches the C — `is_selinux_enabled()` is a MOUNTED-selinuxfs test, and lsof-rs answers `-Z limited to SELinux` with exit 1 exactly as the C does where it is not. What is missing is the CONTEXT column itself, and it is missing ON PURPOSE: `print.c:902` puts it among the PROCESS columns with a width grown to the longest value, and no host available to this port has SELinux enabled, so its position relative to USER and FD cannot be observed. Writing it from the source means guessing a layout whose errors would be silent. lsof-rs refuses loudly instead; see DIVERGENCES."

# `opt:S` and `opt:b` were DEBT (L2) here until 2026-10-09 (DIVERGENCES 94):
# the bounded layer and its options, covered by the `opt-S-*`, `opt-b-*` and
# `fh-*` cases of the Linux differential.

# 2. TYPE codes of other dialects, or unreachable on Windows. Grouped `ids`
#    share a reason; every id is still named explicitly — no globs, so a
#    feature added to the C later can never be swallowed by an old waiver.

[[waive]]
ids = [
  "type:PAS", "type:PAXV", "type:PCRE", "type:PCTL", "type:PCUR",
  "type:PCWD", "type:PDIR", "type:PETY", "type:PFD", "type:PFDR",
  "type:PFIL", "type:PFPR", "type:PGD", "type:PGID", "type:PLC",
  "type:PLDR", "type:PLDT", "type:PLPI", "type:PLST", "type:PLU",
  "type:PLWG", "type:PLWI", "type:PLWS", "type:PLWU", "type:PLWX",
  "type:PMAP", "type:PMEM", "type:PMPS", "type:PNTF", "type:POBJ",
  "type:PODR", "type:POLP", "type:POPF", "type:POPG", "type:PORT",
  "type:PREG", "type:PRMP", "type:PROCDSC", "type:PRTD", "type:PSGA",
  "type:PSIN", "type:PSTA", "type:PSXMQ", "type:PSXSEM", "type:PSXSHM",
  "type:PTS", "type:PUSG", "type:PW", "type:PXMP"
]
reason = "Solaris /proc file types — no Windows equivalent"

[[waive]]
ids = [
  "type:VBAD", "type:VBLK", "type:VCHR", "type:VDIR", "type:VLNK",
  "type:VMPC", "type:VNON", "type:VREG"
]
reason = "BSD/macOS vnode types — lsof-rs reports Windows object types instead"

[[waive]]
ids = [
  "type:ATALK", "type:lla", "type:ndrv", "type:ppp", "type:systm"
]
reason = "macOS/BSD link-layer and AppleTalk families — no backend targets those dialects"

# Socket families the Linux kernel really has. On Windows they are unreachable;
# on Linux they are exactly what phase L1 exists to classify, so the same ids
# are debt there rather than waived away.
[[waive]]
ids = [
  "type:a_inode", "type:ax25", "type:icmp", "type:inet", "type:ipx",
  "type:key", "type:netlink", "type:pack", "type:raw", "type:raw6",
  "type:rte", "type:sock", "type:x.25"
]
platforms = ["windows"]
reason = "Unix socket families not reachable on Windows"

[[waive]]
ids = [
  "type:ax25", "type:icmp", "type:inet", "type:ipx",
  "type:key", "type:netlink", "type:raw", "type:raw6",
  "type:rte", "type:x.25"
]
platforms = ["linux"]
reason = "DEBT (L2): lsof's per-family type codes for families lsof-rs does not read. A raw socket is typed IPv4 or IPv6 where the C types it raw from /proc/net/raw (DIVERGENCES 108), a bound netlink socket is SOCK where the C types it netlink from /proc/net/netlink (109), and a socket no table lists, an unbound netlink or a ping socket among them, is named by the C from its `system.sockprotoname` xattr (22). `type:pack` came off this list when /proc/net/packet shipped; `type:a_inode` and `type:sock`, which lsof-rs emits as the C does, came off it on 2026-10-04, when a retrospective found them still listed."

[[waive]]
ids = [
  "type:DOOR", "type:FSEVENTS", "type:KQUEUE", "type:MPB", "type:MPC",
  "type:NPOLICY", "type:SMT", "type:STR", "type:STSO", "type:XNAM",
  "type:XSD", "type:XSEM"
]
reason = "Solaris doors/STREAMS, BSD kqueue, macOS fsevents — other dialects entirely"

[[waive]]
ids = [
  "type:DEL", "type:EVENTFD", "type:LINK", "type:SHM", "type:SOCK",
  "type:UNKN", "type:UNKNcwd", "type:UNKNdel", "type:UNKNfd",
  "type:UNKNmem", "type:UNKNrtd", "type:UNKNtxt", "type:UNNM", "type:UNSP"
]
platforms = ["windows"]
reason = "Unix object types with no Windows analogue"

# `type:DEL` is NOT waived on Linux any more: mem rows, the `(deleted)` marking
# and the named anon_inode kinds all ship, and the differential compares the
# DEL row against the C directly (linux/differential-mappings-mem-and-del).
[[waive]]
ids = ["type:EVENTFD", "type:SHM", "type:UNNM", "type:UNSP"]
platforms = ["linux"]
reason = "NOT IN THE DIALECT — these names live in lib/print.c's shared table and include/lsof.h's enum, but nothing under lib/dialects/linux/ ever sets them: an eventfd is typed `a_inode` here, /dev/shm is a plain `REG`. Waived as unreachable on this dialect rather than as debt."

# The UNKN* codes are `-e`'s, not an unreadable link's (2026-09-25). The
# waivers here had said the C emits them "with an errno on a link it cannot
# read": it does not — that row is TYPE `unknown`, now emitted and compared
# (linux/differential-unreadable-rows-say-what-could-not-be-read). The C types
# a row `UNKN<fd kind>` when `-e` exempts it from stat (`isefsys()`,
# dproc.c), and lsof-rs has done that for cwd/rtd/txt/fd since 2026-09-20
# (linux/differential-opt-e-exempts-a-mount) and for mapped files, UNKNmem and
# UNKNdel, since 2026-10-04 (linux/differential-exempt-mappings-are-unkn,
# DIVERGENCES 40), when the DEBT waiver for those two came off.

[[waive]]
ids = ["type:UNKN"]
platforms = ["linux"]
reason = "NOT IN THE DIALECT — `isefsys()` prints UNKN only when it LINKS a row with no type, and every Linux call that links one passes a real type (UNKNcwd, UNKNrtd, UNKNtxt, UNKNfd); the one call with none, for mapped files, only reports."

# type:FIFO and type:BLK are NOT waived on Linux: L0 emits both today
# (S_IFIFO -> FIFO, S_IFBLK -> BLK), so they are covered, not excused.
[[waive]]
id = "type:FIFO"
platforms = ["windows"]
reason = "Windows has no FIFO distinct from named pipes — pipe handles are typed PIPE"

[[waive]]
id = "type:BLK"
platforms = ["windows"]
reason = "Windows exposes no block-device object type through the handle table"

# 3. COVERAGE DEBT — none. Every in-scope feature is exercised by a real test.
#    (Closed 2026-07-25: `-u` gained parser + selection tests, and the six
#    object types gained `enumerates_real_kernel_object_types`, which creates
#    real Event/Mutant/Section/process/token/char-device handles and runs the
#    actual enumeration over them. If a fixture is ever removed, the gate fails
#    rather than quietly reverting to an untested feature.)
