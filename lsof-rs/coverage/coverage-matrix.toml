# coverage-matrix — what lsof-rs's verification surface actually exercises.
#
# This is NOT a differential input matrix (lsof-rs's differential is
# oracle-substitution over live fixtures — see ../differential/README.md). It is
# the coverage *declaration* the kit's gate reads: one [[case]] per real test in
# lsof-rs's suite, naming the args it runs and the TYPE codes its fixtures
# create. Option coverage is inferred from `args`; TYPE coverage must be
# declared with `covers`, because no flag spells what a fixture creates — which
# is precisely how the dropped-object-type gap stayed invisible (LESSONS #8).
#
# Sources, all three real and maintained:
#   golden/*      crates/lsof-core/tests/golden.rs   (portable, every CI push)
#   diff/*        ../differential/capture.ps1        (windows CI, hard gate)
#   smoke/*       ../smoketest/Invoke-LsofRsSmokeTest.ps1  (65-case live harness)
#
# Keep it truthful: a case belongs here only if a test really runs those args
# and really asserts on that output. Declaring coverage you don't have converts
# this gate from a control into a lie.

# ---------------------------------------------------------------- golden tests
# Renderer-level, over the deterministic mock backend. These pin FORMAT, and the
# object-type test pins that native kernel TYPE codes render at all.

[[case]]
name = "golden/table"
args = []
covers = ["type:REG", "type:DIR"]

[[case]]
name = "golden/fields-F"
args = ["-F"]

[[case]]
name = "golden/json-J"
args = ["-J"]

[[case]]
name = "golden/json-lines-j"
args = ["-j"]

[[case]]
name = "golden/terse-t"
args = ["-t"]

[[case]]
name = "golden/ppid-R"
args = ["-R"]

[[case]]
name = "golden/offset-o"
args = ["-o"]

[[case]]
name = "golden/human-size-H"
args = ["-H"]

[[case]]
name = "golden/command-width-plus-c"
args = ["+c", "4"]

[[case]]
name = "golden/object-types-render"
# windows_object_types_render: KEY + FileType::Other("SEM") in table and -F t.
covers = ["type:KEY"]
args = []

[[case]]
name = "golden/tcp-info-structured"
# tcp_info_{table_suffix,fields_tokens,json_keys}: a fixture with TcpExtInfo
# set renders the table (Win=/QR=/QS= NAME suffix), -F (TQR/TQS/TWR tokens
# after TST), and JSON (tcp_window/tcp_queue_recv/tcp_queue_send); absent
# info renders nothing extra, and the suffix never leaks into -F/JSON names.
args = ["-T"]
covers = ["type:IPv4"]

[[case]]
name = "core/user-filter-u"
# args::tests::user_filter_parses (`-u`, `-ualice`, comma lists) plus
# selection::tests::user_selector (matches bare account or DOMAIN\user, either
# case; rejects a different domain and an unknown user).
args = ["-u", "USER"]

[[case]]
name = "core/inet-etw-families"
# args::tests::inet_etw_families_icmp_raw (icmp/raw parse like tcp/udp, the
# [46] prefix composes, needs_etw reports the ETW implication) plus
# selection::tests::inet_etw_family_filters_icmp_raw (ICMP matches the v4+v6
# codes, RAW is exact, family narrows). Portable, every push.
args = ["-iICMP"]

[[case]]
name = "core/repeat-delay-as-the-next-word"
# args::tests::dash_r_takes_its_delay_as_the_next_word: `-r 2` repeats every two
# seconds, `-r abc` is `-r` and a file, and the C's `c`/`m` suffixes are
# refused. Repeat mode never exits, so no differential or smoke case can run
# this spelling to completion; smoke/repeat runs the attached `-r1`.
args = ["-r", "2"]

[[case]]
name = "core/privilege-hint-predicate"
# main.rs tests::privilege_hint_* over the extracted wants_privilege_hint():
# both elevation branches through the real argv parser (`-w` suppression,
# table-only, -i/-U/path exemptions). This is what makes `-w`'s semantics
# CI-covered at all — the smoke -w case SKIPs on the always-elevated hosted
# runner (docs/road-to-1.0.md, the elevation blind spot).
args = ["-w"]

# ------------------------------------------------------- backend unit tests
# crates/lsof-backend-windows/src/handles.rs `#[cfg(test)] mod tests`, run by
# `cargo test --all` on the windows CI runner.

[[case]]
name = "backend/enumerates-real-kernel-object-types"
# enumerates_real_kernel_object_types: creates a real Event, Mutant, Section,
# process handle, token and NUL char device in-process, runs the actual
# `enumerate()` over this PID, and requires each object's TYPE code back. This
# is end-to-end on purpose — the bug it guards (every non-File object dropped)
# lived in the enumeration loop, upstream of classification, so a mapping unit
# test could not have caught it.
args = []
covers = [
  "type:EVT",
  "type:MUT",
  "type:SECT",
  "type:PROC",
  "type:TOKN",
  "type:CHR",
]

# ------------------------------------------------------------- differential
# Oracle-substitution vs Get-NetTCPConnection / Get-NetUDPEndpoint over
# self-owned loopback fixtures. IPv4: TCP LISTEN + ESTABLISHED + a half-closed
# CLOSE_WAIT/FIN_WAIT2 pair + UDP. IPv6: TCP LISTEN + ESTABLISHED (always
# present on the hosted runner; a host without ::1 degrades with a warning).

[[case]]
name = "diff/sockets-json"
args = ["-J", "-nP", "-i"]
covers = ["type:IPv4", "type:IPv6"]

[[case]]
name = "diff/sockets-fields"
args = ["-F", "-nP", "-i"]
covers = ["type:IPv4", "type:IPv6"]

