# ------------------------------- linux differential: values as the next word
# getopt offers every value-taking option the next word as its value, and the
# gate requires each spelled that way (porting-kit LESSONS #071). lsof-rs took
# attached values only for -F, -L, -f, -r and -x until 2026-09-26, and for -i
# and -s before items 21 and 6; these are the cases that pin the spellings
# against the C.

[[case]]
name = "linux/differential-fields-list-as-the-next-word"
args = ["-n", "-P", "-F", "pfn", "-a", "-d", "3", "-p", "PID"]

[[case]]
