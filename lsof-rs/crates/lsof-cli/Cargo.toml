[package]
name = "lsof-cli"
description = "Command-line front end for lsof-rs — parses lsof-compatible options and renders the table / -F / JSON output. Produces the `lsof` binary."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "lsof"
path = "src/main.rs"

[dependencies]
lsof-core = { path = "../lsof-core" }
# The inherited SIGPIPE disposition, read before the runtime ignores the
# signal, and its default put back (DIVERGENCES 36, 152); and the C's first
# two steps, taken by the same constructor before the runtime starts: the
# descriptors lsof was started with closed from 3 up, and /dev/null on a
# closed 0, 1 or 2 (DIVERGENCES 170, 171). The one crate of the workspace's
# own that allows `unsafe` on every Unix target.
lsof-sigpipe = { path = "../lsof-sigpipe" }

# Each platform links its own backend (Windows, Linux, FreeBSD); anywhere else the CLI
# falls back to the mock backend so the parse -> select -> render pipeline runs
# (and is testable) on any host.
[target.'cfg(windows)'.dependencies]
lsof-backend-windows = { path = "../lsof-backend-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
lsof-backend-linux = { path = "../lsof-backend-linux" }

[target.'cfg(target_os = "freebsd")'.dependencies]
lsof-backend-freebsd = { path = "../lsof-backend-freebsd" }

[lints]
workspace = true
