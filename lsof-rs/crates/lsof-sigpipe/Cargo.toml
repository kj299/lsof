[package]
name = "lsof-sigpipe"
description = "What lsof-rs does before the Rust runtime starts, in a constructor in .init_array: it reads the SIGPIPE disposition it inherited (and can put the default back, so a closed pipe ends lsof-rs as it ends the C lsof), closes every descriptor from 3 up it was started with and puts /dev/null on a closed 0, 1 or 2, as the C lsof's main() does first."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

# libc, for its `sigaction` layout and its `sigaction()` and `signal()`:
# std has neither, and the disposition must be read before std's runtime
# sets SIGPIPE to SIG_IGN and drops what was there. And, since 2026-11-21,
# for the calls the C's first two steps make (DIVERGENCES 170, 171), which
# no safe interface offers and which are sound only before the runtime
# starts: `syscall(SYS_close_range)` (FreeBSD: `closefrom()`), `open()`,
# `syscall(SYS_getdents64)`, `getdtablesize()`, `close()` and `_exit()`.
# Already in the lock file (rustix brings it for its other targets), MIT OR
# Apache-2.0, no default features; pinned exactly, as rustix and regex are.
# Only Linux and FreeBSD link it: elsewhere this crate is an empty shell.
[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
libc = { version = "=0.2.190", default-features = false }

[lints]
workspace = true
