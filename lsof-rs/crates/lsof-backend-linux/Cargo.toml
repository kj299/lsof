[package]
name = "lsof-backend-linux"
description = "Linux data-acquisition backend for lsof-rs: enumerates processes and their open files from /proc. Implements lsof-core's Backend trait. Dependency-free — everything it needs is in std."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
lsof-core = { path = "../lsof-core" }

# No platform bindings: /proc is a filesystem, and `std::os::unix::fs::MetadataExt`
# exposes every stat field this backend needs (mode, ino, dev, size, nlink). That
# keeps the dependency surface — and so the `cargo-deny` supply-chain gate —
# exactly as small as `lsof-core`'s.

[features]
# Exposes the pure text parsers (`/proc/net/*`, `/proc/<pid>/status`, fdinfo,
# /etc/passwd) through `fuzz_api` so the cargo-fuzz targets in ../../fuzz can
# reach them. Nothing else changes; the crate stays forbid(unsafe_code). Never
# enabled by the CLI (porting-kit PLAYBOOK Phase 4 gate 3, LESSONS #021).
fuzzing = []

[lints]
workspace = true
