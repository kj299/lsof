# lsof-rs — a memory-safe reimplementation of lsof, in Rust.
#
# This Cargo workspace lives alongside the original C lsof tree (it does not
# modify or build it). The portable core (`lsof-core`) builds and is unit-tested
# on any platform; the Windows and Linux data-acquisition backends are each
# compiled and tested by CI on their own runner. See README.md and docs/ for the
# design and the plan.
[workspace]
resolver = "2"
members = [
    "crates/lsof-core",
    "crates/lsof-cli",
    "crates/lsof-backend-windows",
    "crates/lsof-backend-linux",
]
# The fuzz crate is its own workspace (nightly + libfuzzer-sys); keep it out of
# the main build.
exclude = ["fuzz"]

# Encode the // SAFETY discipline as a native clippy lint (belt-and-suspenders
# with the toolchain-free unsafe-audit gate): every `unsafe {}` block must carry
# a `// SAFETY:` justification. The CLI and both backends opt in via
# `[lints] workspace = true`; lsof-core keeps its stricter local
# `unsafe_code = "forbid"`.
[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "LicenseRef-lsof"
repository = "https://github.com/kj299/lsof"
# The build's minimum, checked 2026-10-04: `cargo +1.82 build --workspace`
# succeeds. The tests need 1.87 (`std::io::pipe`, `ErrorKind::ExecutableFileBusy`),
# which `cargo test` on 1.82 reports; no CI job builds with 1.82.
rust-version = "1.82"

[profile.release]
lto = true
strip = true
opt-level = "z"
# An overflow panics instead of wrapping (maintainer's decision, 2026-10-09).
# Arithmetic on values other processes or the kernel supply is checked first
# (peb_walk.rs, sizes.rs, handles.rs, etw.rs), so hostile input is unreadable,
# never a panic. Cost, measured on Linux 2026-10-09: 633,256 -> 636,384 bytes
# (+0.49%), and +0.5% instructions listing a process with 18,000 fds
# (callgrind, 6 runs each). CI and the release workflow fail a build where it
# did not reach every crate and the binary (differential/overflow_gate.py), so
# do not override it per package.
overflow-checks = true
