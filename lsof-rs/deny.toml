# cargo-deny — supply-chain gate for the lsof-rs workspace.
#
#   cargo deny check          (run from lsof-rs/)
#
# The whole third-party dependency tree is the `windows-sys` family
# (windows-sys -> windows-targets -> the per-arch import-lib shims), all
# MIT OR Apache-2.0, and, for the Linux backend's `getxattr(2)`
# (DIVERGENCES 22, 2026-10-30) and its `NETLINK_SOCK_DIAG` query for `-E`
# (`net`, DIVERGENCES 56, 2026-11-06), `rustix` pinned at =1.1.5 with `bitflags`
# and `linux-raw-sys` (and, for rustix's other targets only, `libc` and
# `errno`), each MIT OR Apache-2.0 at least: rustix and linux-raw-sys are
# `Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT`, which the allow
# list below satisfies through either plain licence, so nothing new is
# allowed for them. And, for `-c /regex/` (DIVERGENCES 38, 2026-11-11), in
# `lsof-core` and so on every platform, `regex` pinned at =1.12.3 with no
# default features, with `regex-automata` and `regex-syntax` (each MIT OR
# Apache-2.0); `aho-corasick` and `memchr` (Unlicense OR MIT), which only
# its `perf-*` features build, are in the lock file and not in any binary.
# lsof-rs's own crates are `publish = false` with LicenseRef-lsof and are
# skipped via `private.ignore`.

[advisories]
version = 2
# Fail on a yanked crate in the lockfile; RUSTSEC vulnerability/unmaintained
# advisories are denied by default in v2.
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0"]
# lsof-rs's workspace crates are unpublished (LicenseRef-lsof); don't judge them.
private = { ignore = true }

[bans]
# Flag (don't fail on) duplicate versions of a crate; deny explicit `*` version
# requirements, but allow the workspace's own path dependencies.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io; refuse an unknown registry or a git dependency.
unknown-registry = "deny"
unknown-git = "deny"
